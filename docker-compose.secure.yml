# docker-compose.secure.yml
# Production-ready, security-hardened Docker Compose configuration
#
# Usage:
#   1. Generate secrets: ./scripts/security-setup.sh
#   2. Set environment variables
#   3. docker-compose -f docker-compose.secure.yml up -d
#
# Security Features:
# - Redis password authentication
# - Non-root container users
# - Read-only root filesystems
# - Capability dropping
# - Network segmentation
# - Resource limits

services:
  # ==================== CONTROL API ====================
  control-api:
    build:
      context: ./services/control-api
      dockerfile: Dockerfile.secure
    environment:
      # Required secrets - must be set in environment
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET:-}
      - GATEWAY_SHARED_SECRET=${GATEWAY_SHARED_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      
      # Application settings
      - PORT=8080
      - APP_ENV=${APP_ENV:-production}
      - EMBEDDED_WALLET_KEK_PROVIDER=${EMBEDDED_WALLET_KEK_PROVIDER:-gcp-kms}
      - EMBEDDED_WALLET_GCP_KMS_KEY=${EMBEDDED_WALLET_GCP_KMS_KEY:-}
      - EMBEDDED_WALLET_GCP_KMS_SERVICE_ACCOUNT=${EMBEDDED_WALLET_GCP_KMS_SERVICE_ACCOUNT:-}
      - EMBEDDED_WALLET_GCP_KMS_READ_KEYS=${EMBEDDED_WALLET_GCP_KMS_READ_KEYS:-}
      - EMBEDDED_WALLET_KMS_PROTECTION_LEVEL=${EMBEDDED_WALLET_KMS_PROTECTION_LEVEL:-HSM}
      - PROVIDER_SIGNATURE_MODE=${PROVIDER_SIGNATURE_MODE:-enforce}
      - API_BASE_URL=${API_BASE_URL:-http://localhost:8080}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - CORS_ORIGINS=${CORS_ORIGINS}
      
    # Security hardening
    read_only: true
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    
    tmpfs:
      - /tmp:noexec,nosuid,size=100m,uid=1000,gid=1000
      - /var/tmp:noexec,nosuid,size=50m,uid=1000,gid=1000
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    
    # Health check
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Restart policy
    restart: unless-stopped
    
    # Networking
    networks:
      - backend
    
    depends_on:
      redis:
        condition: service_healthy

  # ==================== EDGE GATEWAY ====================
  # NOTE: edge-gateway requires project root context for proto files
  edge-gateway:
    build:
      context: .
      dockerfile: services/edge-gateway/Dockerfile
    environment:
      - RUST_LOG=info
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - CONTROL_API_URL=http://control-api:8080
      - GATEWAY_SHARED_SECRET=${GATEWAY_SHARED_SECRET}
      - PROXYHUB_REQUIRE_SIGNED_HEARTBEATS=${PROXYHUB_REQUIRE_SIGNED_HEARTBEATS:-true}
      - SESSION_SECRET=${SESSION_SECRET}
      - PROVIDER_PRIVATE_KEY=${PROVIDER_PRIVATE_KEY}
    
    ports:
      - "3128:3128"
    
    # Security hardening
    read_only: true
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    
    restart: unless-stopped
    
    networks:
      - backend
      - frontend
    
    depends_on:
      - control-api
      - redis

  # ==================== REDIS (SECURED) ====================
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --protected-mode yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --tcp-backlog 511
      --timeout 0
      --tcp-keepalive 300
      --loglevel warning
    
    volumes:
      - redis_data:/data
    
    # Security
    sysctls:
      - net.core.somaxconn=65535
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    
    # Health check with authentication
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    
    restart: unless-stopped
    
    networks:
      - backend

  # ==================== POSTGRES (Optional) ====================
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-proxyhubb}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-proxyhubb}
      - PGDATA=/var/lib/postgresql/data/pgdata
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    
    # Security
    read_only: false  # Postgres needs to write to its data dir
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proxyhubb} -d ${POSTGRES_DB:-proxyhubb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    restart: unless-stopped
    
    networks:
      - backend
    
    # Only start if DATABASE_URL points to localhost
    profiles:
      - local-db

  # ==================== PROMETHEUS ====================
  prometheus:
    image: prom/prometheus:v2.48.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    
    ports:
      - "127.0.0.1:9090:9090"  # Only accessible locally
    
    networks:
      - backend
    
    restart: unless-stopped

  # ==================== GRAFANA ====================
  grafana:
    image: grafana/grafana:10.2.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_password
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_SECURITY_ALLOW_EMBEDDING=false
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_AUTH_DISABLE_SIGNOUT_MENU=false
    
    secrets:
      - grafana_password
    
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana:/etc/grafana/provisioning:ro
    
    ports:
      - "127.0.0.1:3001:3000"  # Only accessible locally
    
    networks:
      - backend
    
    restart: unless-stopped

# ==================== NETWORKS ====================
networks:
  backend:
    driver: bridge
    internal: false
    ipam:
      config:
        - subnet: 172.20.0.0/16
  
  frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

# ==================== VOLUMES ====================
volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ==================== SECRETS ====================
# In production, use Docker Swarm secrets or external secret management
# These are defined here for Docker Compose compatibility
secrets:
  grafana_password:
    environment: GRAFANA_PASSWORD
