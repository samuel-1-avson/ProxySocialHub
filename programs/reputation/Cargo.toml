[package]
name = "proxy-reputation"
version = "0.1.0"
description = "ProxyHubb reputation program (BC-11 / Wave 4.2). Devnet program ID EnVE6ehKA2dYi69B3Lo8wt2wyDgzLw4tdtSEKoMYe5bF."
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "proxy_reputation"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
default = []
# When enabled, verify_usage requires a live proxyhub ZKBatchPDA (Wave 4.1/4.2).
onchain-groth16 = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
