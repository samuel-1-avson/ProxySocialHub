[package]
name = "proxy-gateway-bond"
version = "0.1.0"
description = "ProxyHubb Wave 8 bonded-gateway stake + challenge-window slash. Not programs/session. Localnet ID 7nvrNVaNWcG4DzcPygEyXoVC3k19ePUAncGE25dUEyi5."
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "proxy_gateway_bond"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }

[dev-dependencies]
solana-program-test = "=1.18.26"
solana-sdk = "=1.18.26"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
