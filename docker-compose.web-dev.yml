# docker-compose.web-dev.yml
# Web App development environment with hot reload
# Usage: docker-compose -f docker-compose.web-dev.yml up -d
# Host port 4001 is reserved for the Next.js dev server.
# If a local IPFS container is running alongside it, remap the container's
# internal 4001 swarm port to a different host port such as 4401.

services:
  web-dev:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_GATEWAY_URL=http://localhost:3128
      - NEXT_PUBLIC_ENABLE_EVM_WALLETS=${NEXT_PUBLIC_ENABLE_EVM_WALLETS:-false}
      - NEXT_PUBLIC_EVM_CHAIN=${NEXT_PUBLIC_EVM_CHAIN:-sepolia}
      - NEXT_PUBLIC_EVM_RPC_URL=${NEXT_PUBLIC_EVM_RPC_URL:-}
      - NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID=${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
      - NEXT_TELEMETRY_DISABLED=1
    ports:
      - "4001:4001"
    volumes:
      # Mount source code for hot reload
      - ./apps/web/src:/app/src:ro
      - ./apps/web/public:/app/public:ro
    networks:
      - proxyhubb_backend
    restart: unless-stopped

networks:
  proxyhubb_backend:
    external: true
