basePath: /v1
definitions:
  api.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  api.SuccessResponse:
    properties:
      message:
        type: string
    type: object
  health.Dependency:
    properties:
      error:
        type: string
      healthy:
        type: boolean
      latency:
        type: string
      name:
        type: string
    type: object
  health.SystemHealth:
    properties:
      database:
        $ref: '#/definitions/health.Dependency'
      healthy:
        type: boolean
      last_checked:
        type: string
      redis:
        $ref: '#/definitions/health.Dependency'
      uptime:
        type: integer
    type: object
  models.FriendRequest:
    properties:
      created_at:
        type: string
      id:
        type: string
      receiver:
        $ref: '#/definitions/models.User'
      receiver_id:
        type: string
      sender:
        allOf:
        - $ref: '#/definitions/models.User'
        description: Relationships
      sender_id:
        type: string
      status:
        $ref: '#/definitions/models.FriendRequestStatus'
      updated_at:
        type: string
    type: object
  models.FriendRequestStatus:
    enum:
    - pending
    - accepted
    - rejected
    type: string
    x-enum-varnames:
    - FriendRequestPending
    - FriendRequestAccepted
    - FriendRequestRejected
  models.Friendship:
    properties:
      created_at:
        type: string
      friend:
        $ref: '#/definitions/models.User'
      friend_id:
        type: string
      id:
        type: string
      user:
        allOf:
        - $ref: '#/definitions/models.User'
        description: Relationships
      user_id:
        type: string
    type: object
  models.KYCStatus:
    enum:
    - not_started
    - pending
    - in_review
    - approved
    - rejected
    - expired
    type: string
    x-enum-varnames:
    - KYCStatusNotStarted
    - KYCStatusPending
    - KYCStatusInReview
    - KYCStatusApproved
    - KYCStatusRejected
    - KYCStatusExpired
  models.TrustTier:
    enum:
    - new
    - verified
    - premium
    type: string
    x-enum-varnames:
    - TrustTierNew
    - TrustTierVerified
    - TrustTierPremium
  models.User:
    properties:
      avatar_url:
        type: string
      avg_rating:
        type: number
      bio:
        type: string
      cover_image_url:
        type: string
      created_at:
        type: string
      display_name:
        description: Social Profile fields
        type: string
      email:
        type: string
      email_verified:
        description: Email verification fields
        type: boolean
      followers_count:
        description: Social Stats
        type: integer
      following_count:
        type: integer
      id:
        type: string
      kyc_status:
        $ref: '#/definitions/models.KYCStatus'
      location:
        type: string
      provider_since:
        description: Provider Stats
        type: string
      reviews_count:
        type: integer
      role:
        description: '''buyer'', ''provider'', ''admin'''
        type: string
      status:
        $ref: '#/definitions/models.UserStatus'
      total_bandwidth_sold:
        type: number
      totp_enabled:
        type: boolean
      trust_tier:
        $ref: '#/definitions/models.TrustTier'
      updated_at:
        type: string
      username:
        type: string
      verified:
        type: boolean
      website:
        type: string
    type: object
  models.UserStatus:
    enum:
    - active
    - pending
    - suspended
    - banned
    type: string
    x-enum-varnames:
    - UserStatusActive
    - UserStatusPending
    - UserStatusSuspended
    - UserStatusBanned
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is the control plane API for ProxySocialHub.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: ProxySocialHub Control API
  version: "1.0"
paths:
  /friends:
    get:
      description: List all friends of the current user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Friendship'
            type: array
      summary: List friends
      tags:
      - friends
  /friends/request/{requestId}/accept:
    put:
      description: Accept a received friend request
      parameters:
      - description: Request ID
        in: path
        name: requestId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Friendship'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Accept friend request
      tags:
      - friends
  /friends/request/{requestId}/reject:
    put:
      description: Reject a received friend request
      parameters:
      - description: Request ID
        in: path
        name: requestId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Reject friend request
      tags:
      - friends
  /friends/request/{userId}:
    post:
      description: Send a friend request to another user
      parameters:
      - description: Target User ID
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Send friend request
      tags:
      - friends
  /friends/requests:
    get:
      description: List incoming and outgoing pending friend requests
      parameters:
      - description: 'Type: incoming (default) or outgoing'
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.FriendRequest'
            type: array
      summary: List friend requests
      tags:
      - friends
  /health/system:
    get:
      description: Checks health of DB, Redis, and other dependencies
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/health.SystemHealth'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/health.SystemHealth'
      summary: Get system health
      tags:
      - health
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
