# PgBouncer Configuration for ProxySocialHub
# Connection pooler for PostgreSQL/Supabase

[databases]
# Primary database (read/write)
postgres = host=aws-1-eu-west-1.pooler.supabase.com port=5432 dbname=postgres auth_user=postgres

# Read replica (for analytics queries)
# Uncomment when read replica is provisioned
# postgres_readonly = host=read-replica-host port=5432 dbname=postgres auth_user=postgres

[pgbouncer]
# Listen address
listen_addr = 127.0.0.1
listen_port = 6432

# Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

# Pool settings
pool_mode = transaction
max_client_conn = 300
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

# Connection timeouts
server_connect_timeout = 15
server_idle_timeout = 600
server_lifetime = 3600
client_idle_timeout = 300
client_login_timeout = 60

# Query limits
query_timeout = 300
query_wait_timeout = 120

# SSL (for Supabase)
server_tls_sslmode = require

# Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60

# Admin settings
admin_users = postgres
stats_users = postgres
