[package]
name = "proxyhubb-zk-prover"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "proxyhubb_zk_prover"
path = "src/lib.rs"

[[bin]]
name = "proxyhubb-zk-prover"
path = "src/main.rs"

[dependencies]
axum = "0.8"
base64 = "0.22"
halo2_proofs = "0.3"
hex = "0.4"
rand_core = "0.6"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
