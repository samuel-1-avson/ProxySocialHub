[package]
name = "provider-node"
version = "1.0.13"
edition = "2021"
publish = false
description = "ProxyHubb Provider Node — high-performance Rust daemon for sharing bandwidth"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Stream multiplexing (reverse tunnel)
yamux = "0.10"

# TLS (using ring backend to avoid aws-lc-sys C compilation)
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
webpki-roots = "0.26"

# HTTP client (for registration & IP detection)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# CLI
clap = { version = "4", features = ["derive", "env"] }
ratatui = "0.29"
crossterm = "0.28"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
bs58 = "0.5"
ed25519-dalek = "2.1"
sha2 = "0.10"
getrandom = "0.2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# System metrics (cross-platform CPU/RAM)
sysinfo = "0.31"

# Utilities
anyhow = "1"
futures = "0.3"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["compat"] }
toml = "0.8"
dirs = "5.0"
uuid = { version = "1", features = ["v4"] }
quinn = { version = "0.11.7", optional = true }

[features]
default = []
# P4: QUIC provider tunnel (UDP + TLS); pair with PROVIDER_TRANSPORT=quic on gateway and node.
quic = ["dep:quinn"]

[target."cfg(unix)".dependencies]
nix = { version = "0.31.3", features = ["signal", "process"] }

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
