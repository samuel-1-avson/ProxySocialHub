[package]
name = "proxyhubb-groth16-prover"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "proxyhubb_groth16_prover"
path = "src/lib.rs"

[[bin]]
name = "proxyhubb-groth16-prover"
path = "src/main.rs"

[dependencies]
ark-bn254 = "0.4"
ark-ec = "0.4"
ark-ff = "0.4"
ark-groth16 = "0.4"
ark-relations = "0.4"
ark-serialize = "0.4"
ark-snark = "0.4"
ark-std = "0.4"
axum = "0.8"
base64 = "0.22"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
groth16-solana = "0.2.0"
