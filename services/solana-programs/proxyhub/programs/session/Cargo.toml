[package]
name = "session"
version = "0.1.0"
description = "ProxySocialHub Session and Gateway Registry Program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "session"

[features]
cpi = ["no-entrypoint"]
default = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build"]
no-entrypoint = []

[dependencies]
anchor-lang = "0.32.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
