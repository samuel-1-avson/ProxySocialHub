[package]
name = "edge-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bytes = "1.6"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1.3", features = ["full"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "http1", "http2", "tokio"] }
prost = "0.13"
rand = "0.8"
redis = { version = "0.25", features = ["tokio-comp", "cluster", "connection-manager"] }
deadpool-redis = "0.15"
reqwest = { version = "0.12", features = ["json"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.37", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# ORT: ONNX Runtime for ML-Routing. 
# P9-W22: Enabled CUDA and TensorRT for high-performance GPU scoring.
ort = { version = "2.0.0-rc.9", features = ["load-dynamic", "cuda", "tensorrt", "ndarray"], optional = true }
ndarray = "0.15"
tokio-util = { version = "0.7", features = ["compat"] }
tonic = { version = "0.12", features = ["transport"] }
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.8", features = ["v4", "fast-rng"] }
yamux = "0.10"
jsonwebtoken = "9.3"
lru = "0.12"
governor = "0.6"
nonzero_ext = "0.3"
hex = "0.4"
maxminddb = "0.24"
prometheus = { version = "0.13", features = ["process"] }
lazy_static = "1.4"
dashmap = "5.5"
h2 = "0.4"
tokio-tungstenite = "0.23"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
tokio-stream = "0.1"
# --- ZK and Solana Integrations (Phase 5/8/9) ---
ark-ff = "0.4"
ark-bn254 = "0.4"
ark-groth16 = "0.4"
ark-serialize = "0.4"
solana-sdk = "2.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[features]
ml = ["dep:ort"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "registry_bench"
harness = false

[build-dependencies]
tonic-build = "0.12"
