[package]
name = "edge-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
async-nats = "0.37"
base64 = "0.22"
bytes = "1.6"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1.3", features = ["full"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "http1", "http2", "tokio"] }
prost = { version = "0.13", optional = true }
rand = "0.8"
redis = { version = "0.25", features = ["tokio-comp", "cluster", "connection-manager"] }
deadpool-redis = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.37", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# ONNX ML routing — optional; default `ml` is CPU/dynamic only (no CUDA in slim images).
ort = { version = "2.0.0-rc.9", features = ["load-dynamic", "ndarray"], optional = true }
ndarray = "0.15"
tokio-util = { version = "0.7", features = ["compat"] }
tonic = { version = "0.12", features = ["transport"], optional = true }
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.8", features = ["v4", "fast-rng"] }
yamux = "0.10"
jsonwebtoken = "9.3"
bs58 = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
moka = { version = "0.12", features = ["future"] }
governor = "0.6"
nonzero_ext = "0.3"
hex = "0.4"
maxminddb = "0.24"
prometheus = { version = "0.13", features = ["process"] }
lazy_static = "1.4"
dashmap = "5.5"
h2 = "0.4"
tokio-tungstenite = "0.23"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
tokio-stream = "0.1"
# Legacy edge-side ZK + Solana settlement (not built by default).
ark-ff = { version = "0.4", optional = true }
ark-bn254 = { version = "0.4", optional = true }
ark-groth16 = { version = "0.4", optional = true }
ark-relations = { version = "0.4", optional = true }
ark-serialize = { version = "0.4", optional = true }
ark-snark = { version = "0.4", optional = true }
solana-client = { version = "2.1", default-features = false, optional = true }
solana-commitment-config = { version = "2.2", optional = true }
solana-instruction = { version = "2.3", optional = true }
solana-keypair = { version = "2.2", optional = true }
solana-pubkey = { version = "2.4", default-features = false, features = ["std", "curve25519"], optional = true }
solana-sdk-ids = { version = "2.2", optional = true }
solana-signer = { version = "2.2", optional = true }
solana-transaction = { version = "2.2", features = ["bincode"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[features]
default = []
ml = ["dep:ort"]
ml-gpu = ["ml", "ort/cuda", "ort/tensorrt"]
legacy-zk = [
    "dep:ark-ff",
    "dep:ark-bn254",
    "dep:ark-groth16",
    "dep:ark-relations",
    "dep:ark-serialize",
    "dep:ark-snark",
    "dep:solana-client",
    "dep:solana-commitment-config",
    "dep:solana-instruction",
    "dep:solana-keypair",
    "dep:solana-pubkey",
    "dep:solana-sdk-ids",
    "dep:solana-signer",
    "dep:solana-transaction",
]
blockchain = ["dep:tonic", "dep:prost"]
pricing = []

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1.37", features = ["rt-multi-thread"] }
moka = { version = "0.12", features = ["future"] }

[[bench]]
name = "registry_bench"
harness = false

[[bench]]
name = "hotpath_bench"
harness = false

[build-dependencies]
tonic-build = "0.12"
