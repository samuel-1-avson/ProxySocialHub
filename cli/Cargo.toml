[package]
name = "proxyhubb-cli"
version = "1.0.8"
edition = "2021"
publish = false
description = "ProxyHubb provider CLI (install via GitHub Releases / cargo install --git; not crates.io)"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.0"
indicatif = "0.17"
toml = "0.8"
anyhow = "1.0"
dirs = "5.0"
bs58 = "0.5"
getrandom = "0.2"
