# docker-compose.full.yml
# Full stack with Control API, Edge Gateway, and Web App
# Usage: docker-compose -f docker-compose.full.yml up -d

services:
  # ==================== CONTROL API ====================
  control-api:
    build:
      context: ./services/control-api
      dockerfile: Dockerfile.simple
    environment:
      - DATABASE_URL=postgresql://proxyhubb:proxyhubb@postgres:5432/proxyhubb?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - PORT=8080
      - APP_ENV=${APP_ENV:-production}
      - API_BASE_URL=${API_BASE_URL:-http://localhost:8080}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY}
      - PAYSTACK_PUBLIC_KEY=${PAYSTACK_PUBLIC_KEY}
      # --- Solana / Blockchain ---
      - SOLANA_NETWORK=${SOLANA_NETWORK:-devnet}
      - SOLANA_PROGRAM_ID=${SOLANA_PROGRAM_ID:-2yDRyTwhHnVakKKMhhGG61V9b78RUdXRjAL3UiPwmDd7}
      # Treasury wallet receiving buyer SOL deposits (server-side only)
      - SOLANA_TREASURY_ADDRESS=${SOLANA_TREASURY_ADDRESS}
      # Comma-separated RPC endpoints (failover order)
      - SOLANA_RPC_ENDPOINT=${SOLANA_RPC_ENDPOINT:-https://api.devnet.solana.com}
      # Path inside the container to the oracle keypair JSON (64-byte array)
      - SOLANA_ORACLE_KEYPAIR=/run/secrets/oracle-keypair.json
      # --- Admin ---
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET}
      - ADMIN_ACCOUNT_1_USERNAME=${ADMIN_ACCOUNT_1_USERNAME}
      - ADMIN_ACCOUNT_1_PASSWORD=${ADMIN_ACCOUNT_1_PASSWORD}
      - ADMIN_ACCOUNT_1_ROLE=${ADMIN_ACCOUNT_1_ROLE:-superadmin}
      - ADMIN_ACCOUNT_2_USERNAME=${ADMIN_ACCOUNT_2_USERNAME}
      - ADMIN_ACCOUNT_2_PASSWORD=${ADMIN_ACCOUNT_2_PASSWORD}
      - ADMIN_ACCOUNT_2_ROLE=${ADMIN_ACCOUNT_2_ROLE:-sysops}
      - ADMIN_ACCOUNT_3_USERNAME=${ADMIN_ACCOUNT_3_USERNAME}
      - ADMIN_ACCOUNT_3_PASSWORD=${ADMIN_ACCOUNT_3_PASSWORD}
      - ADMIN_ACCOUNT_3_ROLE=${ADMIN_ACCOUNT_3_ROLE:-support}
      - ENABLE_DEV_LOGIN=${ENABLE_DEV_LOGIN:-false}

    # Mount oracle keypair as a read-only secret file.
    # Before running: create ./oracle-keypair.json (64-byte Solana keypair array).
    # If absent, oracle client is skipped gracefully.
    volumes:
      - ./oracle-keypair.json:/run/secrets/oracle-keypair.json:ro

    ports:
      - "8080:8080"

    # Security hardening
    read_only: true
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    
    tmpfs:
      - /tmp:noexec,nosuid,size=100m,uid=1000,gid=1000
    
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    restart: unless-stopped
    
    networks:
      - backend
    
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ==================== EDGE GATEWAY ====================
  edge-gateway:
    build:
      context: ./services/edge-gateway
      dockerfile: Dockerfile.simple
    environment:
      - RUST_LOG=info
      - HOST=0.0.0.0
      - PORT=8090
      - TUNNEL_PORT=3128
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CONTROL_API_URL=http://control-api:8080
      - PROVIDER_PRIVATE_KEY=${PROVIDER_PRIVATE_KEY:-750cb0f0d0b7dce54567b0394513cd19a2ab6d21d4691696179061c20da297d1}
      - STICKY_TTL_SECS=3600
      - JWT_SECRET=${JWT_SECRET}
      - TLS_CERT_PATH=/app/certs/server.crt
      - TLS_KEY_PATH=/app/certs/server.key
      # S-07 / Geo filtering — comma-separated ISO-3166-1 alpha-2 country codes
      - GEO_DENY_LIST=${GEO_DENY_LIST:-}
      - GEO_ALLOW_LIST=${GEO_ALLOW_LIST:-}
      - REGION=${REGION:-default}
      # Optional MaxMind GeoLite2 database path inside the container
      - GEOIP_DB_PATH=${GEOIP_DB_PATH:-}
    
    volumes:
      - ./certs:/app/certs:ro
      # Optional GeoIP database — mount only when GEOIP_DB_PATH is set
      # - ./geoip/GeoLite2-Country.mmdb:/app/geoip/GeoLite2-Country.mmdb:ro

    ports:
      - "3128:3128"    # SOCKS5/HTTP Proxy port
      - "8090:8090"    # Gateway API/Health port

    # Security hardening
    read_only: true
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    
    tmpfs:
      - /tmp:noexec,nosuid,size=100m,uid=1000,gid=1000
    
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    restart: unless-stopped
    
    networks:
      - backend
      - frontend
    
    depends_on:
      control-api:
        condition: service_started
      redis:
        condition: service_healthy

  # ==================== WEB APP (Next.js) ====================
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # API_URL is server-only — baked into Next.js rewrites/API routes at build time.
        # Must use the Docker-internal service name, never exposed to the browser.
        - API_URL=http://control-api:8080
        - NEXT_PUBLIC_GATEWAY_URL=${GATEWAY_PUBLIC_URL:-http://localhost:3128}
        - NEXT_PUBLIC_SOLANA_NETWORK=${SOLANA_NETWORK:-devnet}
        - NEXT_PUBLIC_SOLANA_PROGRAM_ID=${SOLANA_PROGRAM_ID:-2yDRyTwhHnVakKKMhhGG61V9b78RUdXRjAL3UiPwmDd7}
    environment:
      # Server-side only — used by Next.js API routes, never sent to the browser
      - API_URL=http://control-api:8080
      # Public vars — must be the public-facing host:port, not Docker-internal
      - NEXT_PUBLIC_API_URL=${API_BASE_URL:-http://localhost:8080}
      - NEXT_PUBLIC_GATEWAY_URL=${GATEWAY_PUBLIC_URL:-http://localhost:3128}
      - NEXT_PUBLIC_SOLANA_RPC=${SOLANA_RPC_ENDPOINT:-https://api.devnet.solana.com}
      - NEXT_PUBLIC_SOLANA_NETWORK=${SOLANA_NETWORK:-devnet}
      - NEXT_PUBLIC_SOLANA_PROGRAM_ID=${SOLANA_PROGRAM_ID:-2yDRyTwhHnVakKKMhhGG61V9b78RUdXRjAL3UiPwmDd7}
      - NEXT_PUBLIC_SOLANA_TREASURY=${SOLANA_TREASURY_ADDRESS}
    
    ports:
      - "3000:3000"
    
    restart: unless-stopped
    
    networks:
      - backend
      - frontend
    
    depends_on:
      control-api:
        condition: service_started

  # ==================== REDIS (SECURED) ====================
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --protected-mode yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    
    volumes:
      - redis_data:/data
    
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    
    restart: unless-stopped
    
    networks:
      - backend

  # ==================== POSTGRES ====================
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-proxyhubb}
      - POSTGRES_PASSWORD=proxyhubb
      - POSTGRES_DB=${POSTGRES_DB:-proxyhubb}
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proxyhubb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    restart: unless-stopped
    
    networks:
      - backend

  # ==================== REDIS EXPORTER ====================
  redis-exporter:
    image: oliver006/redis_exporter:v1.55.0
    environment:
      - REDIS_ADDR=redis://:${REDIS_PASSWORD}@redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - backend
    depends_on:
      - redis
    restart: unless-stopped

  # ==================== PROMETHEUS (Metrics) ====================
  prometheus:
    image: prom/prometheus:v2.48.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    
    ports:
      - "127.0.0.1:9090:9090"  # Only accessible locally
    
    networks:
      - backend
    
    restart: unless-stopped

  # ==================== GRAFANA (Dashboards) ====================
  grafana:
    image: grafana/grafana:10.2.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_SECURITY_ALLOW_EMBEDDING=false
    
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana:/etc/grafana/provisioning:ro
    
    ports:
      - "127.0.0.1:3001:3000"  # Only accessible locally
    
    networks:
      - backend
    
    restart: unless-stopped

networks:
  backend:
    driver: bridge
  
  frontend:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
  prometheus_data:
  grafana_data:
