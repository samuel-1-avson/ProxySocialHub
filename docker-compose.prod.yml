services:
  # ==================== DB Migrate (one-shot init container) ====================
  db-migrate:
    image: proxyhubb/control-api:latest
    build:
      context: .
      dockerfile: services/control-api/Dockerfile
    container_name: proxyhubb-db-migrate
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - AUTO_MIGRATE=true
      - FORCE_MIGRATE=${FORCE_MIGRATE:-false}
      - MIGRATE_ONLY=true
      - MIGRATIONS_DIR=/app/migrations
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
      - TOKEN_HMAC_SECRET=${TOKEN_HMAC_SECRET:?TOKEN_HMAC_SECRET must be set}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      - NATS_URL=nats://nats:4222
      - PORT=8080
      - APP_ENV=migration
      - GIN_MODE=release
      - DB_LOG_LEVEL=${DB_LOG_LEVEL:-warn}
    volumes:
      - ./migrations:/app/migrations:ro
    restart: "no"
    networks:
      - proxyhubb
    depends_on:
      postgres:
        condition: service_healthy

  # ==================== Control API ====================
  control-api:
    image: proxyhubb/control-api:latest
    build:
      context: .
      dockerfile: services/control-api/Dockerfile
    ports:
      - "8081:8080"
    environment:
      - GIN_MODE=release
      - PORT=8080
      - APP_ENV=production
      - EMBEDDED_WALLET_KEK_PROVIDER=${EMBEDDED_WALLET_KEK_PROVIDER:-gcp-kms}
      - EMBEDDED_WALLET_GCP_KMS_KEY=${EMBEDDED_WALLET_GCP_KMS_KEY:-}
      - EMBEDDED_WALLET_GCP_KMS_SERVICE_ACCOUNT=${EMBEDDED_WALLET_GCP_KMS_SERVICE_ACCOUNT:-}
      - EMBEDDED_WALLET_GCP_KMS_READ_KEYS=${EMBEDDED_WALLET_GCP_KMS_READ_KEYS:-}
      - EMBEDDED_WALLET_KMS_PROTECTION_LEVEL=${EMBEDDED_WALLET_KMS_PROTECTION_LEVEL:-HSM}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - NATS_URL=nats://nats:4222
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      # Admin token signing key (openssl rand -hex 32); empty = admin routes answer 503.
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET:-}
      - GATEWAY_SHARED_SECRET=${GATEWAY_SHARED_SECRET:?GATEWAY_SHARED_SECRET must be set}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
      - CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS must be set}
      # APP_URL is used for WebSocket CORS origin validation.
      - APP_URL=${APP_URL:?APP_URL must be set in production}
      - API_BASE_URL=${API_BASE_URL:?API_BASE_URL must be set}
      - FRONTEND_URL=${FRONTEND_URL:?FRONTEND_URL must be set}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - SUPABASE_DATABASE_URL=${SUPABASE_DATABASE_URL}
      - ORACLE_PRIVATE_KEY=${ORACLE_PRIVATE_KEY:-}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      # Solana — BC-09: KMS-only in production (no file keypair mounts)
      - SOLANA_ORACLE_KEYPAIR=${SOLANA_ORACLE_KEYPAIR:-}
      - SOLANA_TREASURY_HOT_KEYPAIR=${SOLANA_TREASURY_HOT_KEYPAIR:-}
      - USE_GCP_KMS=${USE_GCP_KMS:-true}
      - GCP_KMS_KEY_NAME=${GCP_KMS_KEY_NAME:?GCP_KMS_KEY_NAME required when USE_GCP_KMS=true}
      - GCP_KMS_PUBLIC_KEY=${GCP_KMS_PUBLIC_KEY:-}
      - PROXYHUB_REQUIRE_GCP_KMS=${PROXYHUB_REQUIRE_GCP_KMS:-true}
      - USE_GCP_KMS_HOT=${USE_GCP_KMS_HOT:-true}
      - GCP_KMS_HOT_KEY_NAME=${GCP_KMS_HOT_KEY_NAME:?GCP_KMS_HOT_KEY_NAME required when USE_GCP_KMS_HOT=true}
      - GCP_KMS_HOT_PUBLIC_KEY=${GCP_KMS_HOT_PUBLIC_KEY:-}
      - PROXYHUB_REQUIRE_GCP_KMS_HOT=${PROXYHUB_REQUIRE_GCP_KMS_HOT:-true}
      - USE_AWS_KMS=${USE_AWS_KMS:-false}
      - SOLANA_RPC_ENDPOINT=${SOLANA_RPC_ENDPOINT:?SOLANA_RPC_ENDPOINT must be set}
      - SOLANA_RPC_ENDPOINTS=${SOLANA_RPC_ENDPOINTS}
      - SOLANA_WS_ENDPOINT=${SOLANA_WS_ENDPOINT}
      - SOLANA_NETWORK=${SOLANA_NETWORK:-mainnet-beta}
      - SOLANA_PROGRAM_ID=${SOLANA_PROGRAM_ID:?SOLANA_PROGRAM_ID must be set}
      - SOLANA_TREASURY_ADDRESS=${SOLANA_TREASURY_ADDRESS:?SOLANA_TREASURY_ADDRESS must be set}
      - SOLANA_TREASURY_HOT_ADDRESS=${SOLANA_TREASURY_HOT_ADDRESS:?SOLANA_TREASURY_HOT_ADDRESS must be set and must differ from oracle}
      - SOLANA_TREASURY_COLD_ADDRESS=${SOLANA_TREASURY_COLD_ADDRESS:-}
      - SOLANA_TREASURY_HOT_MIN_BALANCE=${SOLANA_TREASURY_HOT_MIN_BALANCE:-100}
      - SOLANA_TREASURY_HOT_MAX_BALANCE=${SOLANA_TREASURY_HOT_MAX_BALANCE:-500}
      - SOLANA_TREASURY_REPLENISH_AMOUNT=${SOLANA_TREASURY_REPLENISH_AMOUNT:-200}
      - SOLANA_VAULT_TOPUP_MAX_SOL=${SOLANA_VAULT_TOPUP_MAX_SOL:-200}
      - SOLANA_VAULT_DAILY_TOPUP_CAP_SOL=${SOLANA_VAULT_DAILY_TOPUP_CAP_SOL:-2000}
      - SOLANA_VAULT_RESERVE_FLOOR_SOL=${SOLANA_VAULT_RESERVE_FLOOR_SOL:-0.01}
      - SOLANA_DEPOSIT_VAULT_ADDRESS=${SOLANA_DEPOSIT_VAULT_ADDRESS:-}
      # BC-07: require finalized commitment for deposit credits (default true via APP_ENV=production)
      - PROXYHUB_DEPOSIT_REQUIRE_FINALIZED=${PROXYHUB_DEPOSIT_REQUIRE_FINALIZED:-true}
      - PROXYHUB_DEPOSIT_VAULT_CREDIT_ENABLED=${PROXYHUB_DEPOSIT_VAULT_CREDIT_ENABLED:-true}
      - PROXYHUB_DEPOSIT_LEGACY_TREASURY_CREDIT=${PROXYHUB_DEPOSIT_LEGACY_TREASURY_CREDIT:-false}
      - PROXYHUB_REQUIRE_ESCROW_PDA=${PROXYHUB_REQUIRE_ESCROW_PDA:-false}
      # PHB_TOKEN_MINT: platform SPL token mint address for wallet balance display
      - PHB_TOKEN_MINT=${PHB_TOKEN_MINT}
      # Price feeds
      - COINGECKO_API_KEY=${COINGECKO_API_KEY}
      - COINGECKO_API_URL=${COINGECKO_API_URL:-https://api.coingecko.com/api/v3}
      - COINMARKETCAP_API_KEY=${COINMARKETCAP_API_KEY}
      # Edge Gateway
      - EDGE_GATEWAY_MGMT_URL=${EDGE_GATEWAY_MGMT_URL:-http://edge-gateway:8090}
      # Provider Engine
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:?SUPABASE_JWT_SECRET must be set}
      - PLATFORM_FEE_PERCENT=${PLATFORM_FEE_PERCENT:-0.10}
      - MIN_PAYOUT_SOL=${MIN_PAYOUT_SOL:-0.01}
      - PAYOUT_BATCH_SIZE=${PAYOUT_BATCH_SIZE:-20}
      # --- Provider Token Auth (HMAC-SHA256) ---
      - TOKEN_HMAC_SECRET=${TOKEN_HMAC_SECRET:?TOKEN_HMAC_SECRET must be set}
      # --- Google sign-in. Embedded wallets refuse the env KEK in production (KMS KEK is phase 2). ---
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      # --- Provider proofs (production default: enforce when unset) ---
      - PROVIDER_SIGNATURE_MODE=${PROVIDER_SIGNATURE_MODE:-enforce}
      # --- Alert Channels ---
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - ALERT_ADMIN_EMAILS=${ALERT_ADMIN_EMAILS:-}
      # --- Oracle Velocity Guard ---
      - ORACLE_MAX_SINGLE_TRANSFER_SOL=${ORACLE_MAX_SINGLE_TRANSFER_SOL:-50}
      - ORACLE_MAX_HOURLY_OUTFLOW_SOL=${ORACLE_MAX_HOURLY_OUTFLOW_SOL:-500}
      - ORACLE_TRANSFER_FREEZE=${ORACLE_TRANSFER_FREEZE:-false}
      # --- Emergency price fallback ---
      - EMERGENCY_SOL_PRICE_USD=${EMERGENCY_SOL_PRICE_USD:-200}
      # --- GeoIP Backfill Worker ---
      # Resolves lat/lon for explorer nodes via ip-api.com (free, 45 req/min).
      # Set to "false" in air-gapped environments or when coordinates are pre-populated.
      - GEOIP_ENABLED=${GEOIP_ENABLED:-true}
      # Phase 5: aggregate session_intents → map_node_links for GET /v1/map/links
      - MAP_TOPOLOGY_ENABLED=${MAP_TOPOLOGY_ENABLED:-true}
      # --- Explorer (public API + workers; sessions off by default in production) ---
      - FULL_DECENTRALIZATION=${FULL_DECENTRALIZATION:-false}
      - EXPLORER_PUBLIC_SESSIONS_ENABLED=${EXPLORER_PUBLIC_SESSIONS_ENABLED:-false}
      - EXPLORER_PUBLIC_EARNINGS_ENABLED=${EXPLORER_PUBLIC_EARNINGS_ENABLED:-false}
      - EXPLORER_MIN_WRITERS=${EXPLORER_MIN_WRITERS:-2}
      - EXPLORER_METRICS_ENABLED=${EXPLORER_METRICS_ENABLED:-true}
      - EXPLORER_METRICS_INTERVAL=${EXPLORER_METRICS_INTERVAL:-10m}
      - EXPLORER_INDEXER_ENABLED=${EXPLORER_INDEXER_ENABLED:-true}
      - EXPLORER_INDEXER_POLL_INTERVAL_MS=${EXPLORER_INDEXER_POLL_INTERVAL_MS:-5000}
      # DB Migrations
      - AUTO_MIGRATE=false
      - FORCE_MIGRATE=${FORCE_MIGRATE:-false}
      - MIGRATIONS_DIR=/app/migrations
      # DB Observability (E8)
      - DB_LOG_LEVEL=${DB_LOG_LEVEL:-warn}
      - DB_SLOW_QUERY_MS=${DB_SLOW_QUERY_MS:-500}
      - DB_MAX_OPEN_CONNS=${DB_MAX_OPEN_CONNS:-30}
      - DB_MAX_IDLE_CONNS=${DB_MAX_IDLE_CONNS:-5}
    volumes:
      # BC-09: do not mount oracle/hot keypair JSON — use Cloud KMS (or AWS KMS).
      - ./cli-dist:/app/cli-dist:ro
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - proxyhubb
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always

  # ==================== Edge Gateway ====================
  edge-gateway:
    image: proxyhubb/edge-gateway:latest
    build:
      context: ./services/edge-gateway
      dockerfile: Dockerfile
      args:
        ENABLE_OTEL: ${EDGE_GATEWAY_ENABLE_OTEL:-0}
    ports:
      - "3128:3128"
      - "8090:8090"
    environment:
      - RUST_LOG=info
      - HOST=0.0.0.0
      - PORT=8090
      - TUNNEL_PORT=3128
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - NATS_URL=nats://nats:4222
      - CONTROL_API_URL=http://control-api:8080
      - JWT_SECRET=${JWT_SECRET}
      - GATEWAY_SHARED_SECRET=${GATEWAY_SHARED_SECRET:?GATEWAY_SHARED_SECRET must be set}
      - PROXYHUB_REQUIRE_SIGNED_HEARTBEATS=${PROXYHUB_REQUIRE_SIGNED_HEARTBEATS:-true}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
      # Reject provider tunnels without a valid lease (explicit prod default; PN-04)
      - REQUIRE_PROVIDER_LEASE=${REQUIRE_PROVIDER_LEASE:-true}
      # GW-07: Resolve CONNECT hostnames and reject if they map to private/reserved IPs
      - GATEWAY_DNS_REBIND_CHECK=${GATEWAY_DNS_REBIND_CHECK:-true}
      - TLS_CERT_PATH=/app/certs/server.crt
      - TLS_KEY_PATH=/app/certs/server.key
      - PROVIDER_PRIVATE_KEY=${PROVIDER_PRIVATE_KEY}
      - GEO_DENY_LIST=${GEO_DENY_LIST:-}
      - GEO_ALLOW_LIST=${GEO_ALLOW_LIST:-}
      - REGION=${REGION:-default}
      - GEOIP_DB_PATH=/app/geoip/GeoLite2-Country.mmdb
      - SESSION_CACHE_SIZE=${SESSION_CACHE_SIZE:-100000}
      - SESSION_CACHE_TTL_SECS=${SESSION_CACHE_TTL_SECS:-300}
      # P2-12: Per-operation timeouts
      - PROXY_CONNECT_TIMEOUT_SECS=${PROXY_CONNECT_TIMEOUT_SECS:-10}
      - PROXY_IDLE_TIMEOUT_SECS=${PROXY_IDLE_TIMEOUT_SECS:-60}
      - RPC_REQUEST_TIMEOUT_SECS=${RPC_REQUEST_TIMEOUT_SECS:-15}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-edge-gateway}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - ./certs:/app/certs:ro
      - ./geoip:/app/geoip:ro
    depends_on:
      control-api:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - proxyhubb
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:8090/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: always

  # ==================== NATS ====================
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    networks:
      - proxyhubb
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/varz"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always

  # ==================== Web (Frontend) ====================
  web:
    image: proxyhubb/web:latest
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        - API_URL=http://control-api:8080
        - NEXT_PUBLIC_GATEWAY_URL=${GATEWAY_PUBLIC_URL}
        - NEXT_PUBLIC_ENABLE_EVM_WALLETS=${NEXT_PUBLIC_ENABLE_EVM_WALLETS:-false}
        - NEXT_PUBLIC_EVM_CHAIN=${NEXT_PUBLIC_EVM_CHAIN:-sepolia}
        - NEXT_PUBLIC_EVM_RPC_URL=${NEXT_PUBLIC_EVM_RPC_URL:-}
        - NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID=${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
        - NEXT_PUBLIC_SOLANA_NETWORK=${SOLANA_NETWORK:-mainnet-beta}
        - NEXT_PUBLIC_SOLANA_PROGRAM_ID=${SOLANA_PROGRAM_ID}
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - NEXT_PUBLIC_API_URL=${API_BASE_URL}
        - NEXT_PUBLIC_WS_URL=${WS_PUBLIC_URL}
        - NEXT_PUBLIC_EXPLORER_PUBLIC_SESSIONS_ENABLED=${EXPLORER_PUBLIC_SESSIONS_ENABLED:-false}
        - NEXT_PUBLIC_EXPLORER_PUBLIC_EARNINGS_ENABLED=${EXPLORER_PUBLIC_EARNINGS_ENABLED:-false}
        - NEXT_PUBLIC_EXPLORER_MAP_BUY_ENABLED=${EXPLORER_MAP_BUY_ENABLED:-false}
        - NEXT_PUBLIC_UNIFIED_NETWORK=${NEXT_PUBLIC_UNIFIED_NETWORK:-false}
        - NEXT_PUBLIC_MAP_LIVE_ON_MARKETPLACE=${NEXT_PUBLIC_MAP_LIVE_ON_MARKETPLACE:-false}
        - NEXT_PUBLIC_GLOBE_TOPOLOGY=${NEXT_PUBLIC_GLOBE_TOPOLOGY:-false}
        - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
        - NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID=${NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID:-}
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
        - NEXT_PUBLIC_LEGACY_EXPLORER_GLOBE=${NEXT_PUBLIC_LEGACY_EXPLORER_GLOBE:-false}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - API_URL=http://control-api:8080
      - NEXT_PUBLIC_API_URL=${API_BASE_URL}
      - NEXT_PUBLIC_ENABLE_EVM_WALLETS=${NEXT_PUBLIC_ENABLE_EVM_WALLETS:-false}
      - NEXT_PUBLIC_EVM_CHAIN=${NEXT_PUBLIC_EVM_CHAIN:-sepolia}
      - NEXT_PUBLIC_EVM_RPC_URL=${NEXT_PUBLIC_EVM_RPC_URL:-}
      - NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID=${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
      # WebSocket URL for explorer real-time updates
      - NEXT_PUBLIC_WS_URL=${WS_PUBLIC_URL}
      - NEXT_PUBLIC_SOLANA_RPC=${SOLANA_RPC_ENDPOINT}
      - NEXT_PUBLIC_SOLANA_NETWORK=${SOLANA_NETWORK:-mainnet-beta}
      - NEXT_PUBLIC_SOLANA_PROGRAM_ID=${SOLANA_PROGRAM_ID}
      - NEXT_PUBLIC_SOLANA_TREASURY=${SOLANA_TREASURY_ADDRESS}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_EXPLORER_PUBLIC_SESSIONS_ENABLED=${EXPLORER_PUBLIC_SESSIONS_ENABLED:-false}
      - NEXT_PUBLIC_EXPLORER_PUBLIC_EARNINGS_ENABLED=${EXPLORER_PUBLIC_EARNINGS_ENABLED:-false}
      - NEXT_PUBLIC_EXPLORER_MAP_BUY_ENABLED=${EXPLORER_MAP_BUY_ENABLED:-false}
      - NEXT_PUBLIC_UNIFIED_NETWORK=${NEXT_PUBLIC_UNIFIED_NETWORK:-false}
      - NEXT_PUBLIC_MAP_LIVE_ON_MARKETPLACE=${NEXT_PUBLIC_MAP_LIVE_ON_MARKETPLACE:-false}
      - NEXT_PUBLIC_GLOBE_TOPOLOGY=${NEXT_PUBLIC_GLOBE_TOPOLOGY:-false}
    depends_on:
      control-api:
        condition: service_healthy
    networks:
      - proxyhubb
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: always

  # ==================== PostgreSQL ====================
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-proxyhubb}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=${POSTGRES_DB:-proxyhubb}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - proxyhubb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proxyhubb} -d ${POSTGRES_DB:-proxyhubb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      --protected-mode yes
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - proxyhubb
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always

  # ==================== Redis Exporter ====================
  redis-exporter:
    image: oliver006/redis_exporter:v1.55.0
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - proxyhubb
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  # ==================== Prometheus ====================
  prometheus:
    image: prom/prometheus:v2.48.0
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    networks:
      - proxyhubb
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  # ==================== Grafana ====================
  grafana:
    image: grafana/grafana:10.2.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_SECURITY_ALLOW_EMBEDDING=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./infra/grafana/dashboard.json:/etc/grafana/provisioning/dashboards/proxyhubb.json:ro
    depends_on:
      - prometheus
    networks:
      - proxyhubb
    restart: always

volumes:
  postgres_data:
  redis_data:
  grafana_data:
  prometheus_data:

networks:
  proxyhubb:
    driver: bridge
