# docker-compose.minimal.yml
# Minimal setup for testing control-api only
# Usage: docker-compose -f docker-compose.minimal.yml up -d

services:
  # ==================== DB MIGRATE (one-shot) ====================
  db-migrate:
    build:
      context: .
      dockerfile: services/control-api/Dockerfile
    container_name: proxyhubb-db-migrate
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-proxyhubb}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-proxyhubb}?sslmode=disable
      - AUTO_MIGRATE=true
      - FORCE_MIGRATE=${FORCE_MIGRATE:-true}
      - MIGRATE_ONLY=true
      - MIGRATIONS_DIR=/app/migrations
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
      - SKIP_CREDENTIAL_CHECK=true
      - PORT=8080
      - APP_ENV=migration
      - GIN_MODE=release
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
    volumes:
      - ./migrations:/app/migrations:ro
    restart: "no"
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy

  # ==================== CONTROL API ====================
  control-api:
    build:
      context: .
      dockerfile: services/control-api/Dockerfile
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-proxyhubb}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-proxyhubb}?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - PORT=8080
      - APP_ENV=${APP_ENV:-development}
      - EMBEDDED_WALLET_KEK=${EMBEDDED_WALLET_KEK:-}
      - EMBEDDED_WALLET_KEK_PROVIDER=${EMBEDDED_WALLET_KEK_PROVIDER:-local}
      - EMBEDDED_WALLET_GCP_KMS_KEY=${EMBEDDED_WALLET_GCP_KMS_KEY:-}
      - EMBEDDED_WALLET_GCP_KMS_READ_KEYS=${EMBEDDED_WALLET_GCP_KMS_READ_KEYS:-}
      - EMBEDDED_WALLET_KMS_PROTECTION_LEVEL=${EMBEDDED_WALLET_KMS_PROTECTION_LEVEL:-HSM}
      - API_BASE_URL=${API_BASE_URL:-http://localhost:8080}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - FULL_DECENTRALIZATION=${FULL_DECENTRALIZATION:-false}
      - EXPLORER_PUBLIC_SESSIONS_ENABLED=${EXPLORER_PUBLIC_SESSIONS_ENABLED:-true}
      - EXPLORER_PUBLIC_EARNINGS_ENABLED=${EXPLORER_PUBLIC_EARNINGS_ENABLED:-false}
      - EXPLORER_MIN_WRITERS=${EXPLORER_MIN_WRITERS:-2}
      - EXPLORER_METRICS_ENABLED=${EXPLORER_METRICS_ENABLED:-true}
      - EXPLORER_METRICS_INTERVAL=${EXPLORER_METRICS_INTERVAL:-10m}
      - EXPLORER_INDEXER_ENABLED=${EXPLORER_INDEXER_ENABLED:-true}
      - EXPLORER_INDEXER_POLL_INTERVAL_MS=${EXPLORER_INDEXER_POLL_INTERVAL_MS:-5000}

    ports:
      - "8080:8080"
    
    # Security hardening
    read_only: true
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    
    tmpfs:
      - /tmp:noexec,nosuid,size=100m,uid=1000,gid=1000
    
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    restart: unless-stopped
    
    networks:
      - backend
    
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ==================== REDIS (SECURED) ====================
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      --appendonly yes
      --protected-mode yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    
    volumes:
      - redis_data:/data
    
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    
    restart: unless-stopped
    
    networks:
      - backend

  # ==================== POSTGRES ====================
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-proxyhubb}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=${POSTGRES_DB:-proxyhubb}
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proxyhubb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    restart: unless-stopped
    
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
