services:
  explorer:
    image: EXPLORER_IMAGE_PLACEHOLDER
    pull_policy: never
    ports:
      - "127.0.0.1:4012:3000"
    environment:
      NODE_ENV: production
      API_URL: http://control-api:8080
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 4
    restart: unless-stopped
