openapi: 3.1.0
info:
  title: ProxyHub Control API
  description: |
    API for managing proxy sessions, wallets, users, and analytics in the ProxyHub residential proxy network.
    
    ## Authentication
    All protected endpoints require a Bearer token in the Authorization header:
    ```
    Authorization: Bearer <access_token>
    ```
    
    ## Rate Limiting
    - 100 requests per minute per user/IP
    - Rate limit headers: `X-RateLimit-Limit`, `X-RateLimit-Remaining`

    ## Authority Headers
    The API emits authority metadata headers so operators can distinguish
    chain-authoritative and DB-authoritative paths at runtime:
    - `X-ProxyHubb-Authority-Mode`
    - `X-ProxyHubb-Authority-Chain-Scope`
    - `X-ProxyHubb-Authority-DB-Role`
  version: 1.0.0
  contact:
    name: ProxyHub Support
    email: support@proxyhubb.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.proxyhubb.com
    description: Production

tags:
  - name: Auth
    description: Authentication and user registration
  - name: Sessions
    description: Proxy session management
  - name: Wallet
    description: Wallet and payments
  - name: Usage
    description: Usage tracking and analytics
  - name: KYC
    description: Identity verification
  - name: Circles
    description: Provider groups and pools
  - name: Analytics
    description: Usage analytics and charts
  - name: Geo
    description: Geo-targeting
  - name: Admin
    description: Admin operations

paths:
  # ==================== Auth ====================
  /v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already exists

  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  # ==================== Sessions ====================
  /v1/sessions:
    get:
      tags: [Sessions]
      summary: List user sessions
      operationId: listSessions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'

    post:
      tags: [Sessions]
      summary: Create a new proxy session
      operationId: createSession
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    $ref: '#/components/schemas/Session'
                  proxy_endpoint:
                    type: string
                    example: "proxy.proxyhubb.com:8443"

  /v1/sessions/intent:
    post:
      tags: [Sessions]
      summary: Issue a signed V2 session intent token
      operationId: createSessionIntent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionIntentRequest'
      responses:
        '200':
          description: Session intent issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionIntentResponse'

  /v1/sessions/intents:
    get:
      tags: [Sessions]
      summary: List recent V2 session intents for the current user
      operationId: listSessionIntents
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Recent session intents
          content:
            application/json:
              schema:
                type: object
                properties:
                  intents:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionIntentStatusResponse'

  /v1/sessions/intents/{id}:
    get:
      tags: [Sessions]
      summary: Get lifecycle state for a signed V2 session intent
      operationId: getSessionIntentStatus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session intent status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionIntentStatusResponse'

  /v1/sessions/{id}:
    get:
      tags: [Sessions]
      summary: Get session details
      operationId: getSession
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'

    delete:
      tags: [Sessions]
      summary: Terminate a session
      operationId: terminateSession
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session terminated

  /v1/provider/lease:
    post:
      tags: [Provider]
      summary: Issue a short-lived provider capability lease for gateway admission
      operationId: issueProviderLease
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueProviderLeaseRequest'
      responses:
        '200':
          description: Provider lease issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderLeaseResponse'

  # ==================== Wallet ====================
  /v1/wallet:
    get:
      tags: [Wallet]
      summary: Get wallet balance
      operationId: getWallet
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Wallet details
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallet:
                    $ref: '#/components/schemas/Wallet'

  /v1/wallet/deposit:
    post:
      tags: [Wallet]
      summary: Initiate deposit via MoMo
      operationId: initiateDeposit
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositRequest'
      responses:
        '200':
          description: Deposit initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  reference:
                    type: string
                  status:
                    type: string

  /v1/wallet/withdraw:
    post:
      tags: [Wallet]
      summary: Initiate withdrawal to MoMo
      operationId: initiateWithdrawal
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawRequest'
      responses:
        '200':
          description: Withdrawal initiated

  # ==================== Usage ====================
  /v1/usage/me:
    get:
      tags: [Usage]
      summary: Get user's usage statistics
      operationId: getUserUsage
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usage statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserUsage'

  # ==================== Analytics ====================
  /v1/analytics/overview:
    get:
      tags: [Analytics]
      summary: Get analytics overview
      operationId: getAnalyticsOverview
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Analytics overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsOverview'

  /v1/analytics/usage/daily:
    get:
      tags: [Analytics]
      summary: Get daily usage chart data
      operationId: getDailyUsage
      security:
        - bearerAuth: []
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 7
            minimum: 1
            maximum: 90
      responses:
        '200':
          description: Daily usage data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DailyUsagePoint'

  # ==================== Geo ====================
  /v1/geo/regions:
    get:
      tags: [Geo]
      summary: Get available regions
      operationId: getAvailableRegions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Available regions
          content:
            application/json:
              schema:
                type: object
                properties:
                  regions:
                    type: array
                    items:
                      $ref: '#/components/schemas/RegionInfo'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    ProxyHubbAuthorityMode:
      description: Runtime authority model for the endpoint.
      schema:
        type: string
        enum: [chain_authoritative, db_authoritative, hybrid_async_chain]
    ProxyHubbAuthorityChainScope:
      description: Chain interaction scope for this response.
      schema:
        type: string
        examples: [none, read_only_balance_check, write, async_write, async_write_attestation, async_write_settlement, required]
    ProxyHubbAuthorityDBRole:
      description: Role of the DB in the response path.
      schema:
        type: string
        examples: [source_of_truth, mirror, none]

  schemas:
    RegisterRequest:
      type: object
      required: [email, password, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum: [buyer, provider]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
        status:
          type: string
        trust_tier:
          type: string
        kyc_status:
          type: string
        created_at:
          type: string
          format: date-time

    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [rotating, sticky]
        status:
          type: string
          enum: [active, terminated]
        credentials_user:
          type: string
        credentials_pass:
          type: string
        created_at:
          type: string
          format: date-time

    CreateSessionRequest:
      type: object
      properties:
        type:
          type: string
          enum: [rotating, sticky]
          default: rotating
        target_geo:
          type: string
          description: Target country code (ISO 3166-1 alpha-2)
        target_isp:
          type: string

    CreateSessionIntentRequest:
      type: object
      properties:
        type:
          type: string
          enum: [rotating, sticky]
          default: rotating
        listing_id:
          type: string
          format: uuid
        bandwidth_limit:
          type: integer
          description: Requested bandwidth limit in bytes. The server caps this to the user's trust-tier allowance.
        target_geo:
          type: string
          description: Preferred target country code (ISO 3166-1 alpha-2)
        target_isp:
          type: string
        routing_profile:
          type: string
        allowed_domains:
          type: array
          items:
            type: string
        blocked_domains:
          type: array
          items:
            type: string
        rotation_type:
          type: string
        rotation_interval_seconds:
          type: integer
        time_limit_minutes:
          type: integer
        preferred_tier:
          type: string
        max_price_per_gb:
          type: number
          format: float

    SessionIntentResponse:
      type: object
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
        lifecycle_state:
          type: string
          enum: [authorized, routed, active, closing, ledger_committed, batched, chain_committed, archived, expired]
        intent:
          $ref: '#/components/schemas/SessionIntent'

    SessionIntentStatusResponse:
      type: object
      properties:
        lifecycle_state:
          type: string
          enum: [authorized, routed, active, closing, ledger_committed, batched, chain_committed, archived, expired]
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        routed_at:
          type: string
          format: date-time
        activated_at:
          type: string
          format: date-time
        closing_at:
          type: string
          format: date-time
        ledger_committed_at:
          type: string
          format: date-time
        batched_at:
          type: string
          format: date-time
        chain_committed_at:
          type: string
          format: date-time
        archived_at:
          type: string
          format: date-time
        expired_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        last_metered_at:
          type: string
          format: date-time
        usage_snapshot:
          $ref: '#/components/schemas/SessionIntentUsageSnapshot'
        billing_snapshot:
          $ref: '#/components/schemas/SessionIntentBillingSnapshot'
        intent:
          $ref: '#/components/schemas/SessionIntent'

    SessionIntentUsageSnapshot:
      type: object
      properties:
        total_bytes:
          type: integer
          format: int64
        total_bytes_up:
          type: integer
          format: int64
        total_bytes_down:
          type: integer
          format: int64
        last_bytes_up_delta:
          type: integer
          format: int64
        last_bytes_down_delta:
          type: integer
          format: int64
        total_gb:
          type: number
          format: float
        percent_used:
          type: number
          format: float
        bytes_remaining:
          type: integer
          format: int64
        unlimited:
          type: boolean

    SessionIntentBillingSnapshot:
      type: object
      properties:
        currency:
          type: string
        price_source:
          type: string
        unit_price_usd_per_gb:
          type: number
          format: float
        unit_price_sol_per_gb:
          type: number
          format: float
        estimated_cost_usd:
          type: number
          format: float
        estimated_cost_sol:
          type: number
          format: float
        projected_full_limit_cost_usd:
          type: number
          format: float
        projected_full_limit_cost_sol:
          type: number
          format: float

    SessionIntent:
      type: object
      properties:
        intent_id:
          type: string
        user_id:
          type: string
          format: uuid
        listing_id:
          type: string
          format: uuid
        session_type:
          type: string
          enum: [rotating, sticky]
        trust_tier:
          type: string
        bandwidth_limit:
          type: integer
        target_geo:
          type: string
        target_isp:
          type: string
        routing_profile:
          type: string
        allowed_domains:
          type: array
          items:
            type: string
        blocked_domains:
          type: array
          items:
            type: string
        rotation_type:
          type: string
        rotation_interval_seconds:
          type: integer
        time_limit_minutes:
          type: integer
        preferred_tier:
          type: string
        requests_per_minute:
          type: integer
        max_concurrency:
          type: integer
        max_price_per_gb:
          type: number
          format: float
        billing_price_per_gb_usd:
          type: number
          format: float
        billing_price_source:
          type: string
        provider_node_id:
          type: string
        target_host:
          type: string
        total_bytes_up:
          type: integer
          format: int64
        total_bytes_down:
          type: integer
          format: int64
        last_bytes_up_delta:
          type: integer
          format: int64
        last_bytes_down_delta:
          type: integer
          format: int64
        usage_update_count:
          type: integer

    IssueProviderLeaseRequest:
      type: object
      required: [connection_type, max_connections, max_bandwidth_mbps]
      properties:
        connection_type:
          type: string
        available_ports:
          type: array
          items:
            type: integer
        max_connections:
          type: integer
        max_bandwidth_mbps:
          type: integer
        uplink_speed_kbps:
          type: integer
        downlink_speed_kbps:
          type: integer
        cpu_cores:
          type: integer
        memory_mb:
          type: integer
        os:
          type: string
        client_version:
          type: string
        features:
          type: array
          items:
            type: string

    ProviderLeaseResponse:
      type: object
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
        expires_in:
          type: integer
        renew_after_secs:
          type: integer
        lease:
          $ref: '#/components/schemas/ProviderLease'

    ProviderLease:
      type: object
      properties:
        lease_id:
          type: string
        user_id:
          type: string
          format: uuid
        connection_type:
          type: string
        available_ports:
          type: array
          items:
            type: integer
        max_connections:
          type: integer
        max_bandwidth_mbps:
          type: integer
        uplink_speed_kbps:
          type: integer
        downlink_speed_kbps:
          type: integer
        cpu_cores:
          type: integer
        memory_mb:
          type: integer
        os:
          type: string
        client_version:
          type: string
        features:
          type: array
          items:
            type: string

    Wallet:
      type: object
      properties:
        id:
          type: string
          format: uuid
        balance:
          type: number
          format: float
        currency:
          type: string
          default: GHS

    DepositRequest:
      type: object
      required: [amount, phone]
      properties:
        amount:
          type: number
          minimum: 1
        phone:
          type: string

    WithdrawRequest:
      type: object
      required: [amount, phone]
      properties:
        amount:
          type: number
          minimum: 1
        phone:
          type: string

    UserUsage:
      type: object
      properties:
        total_bytes:
          type: integer
        total_gb:
          type: number
        total_cost_ghs:
          type: number
        sessions:
          type: array
          items:
            type: object

    AnalyticsOverview:
      type: object
      properties:
        total_bandwidth_gb:
          type: number
        success_rate:
          type: number
        avg_latency_ms:
          type: integer
        active_sessions:
          type: integer

    DailyUsagePoint:
      type: object
      properties:
        date:
          type: string
          format: date
        bytes_used:
          type: integer
        gb_used:
          type: number
        cost_ghs:
          type: number

    RegionInfo:
      type: object
      properties:
        country_code:
          type: string
        country_name:
          type: string
        provider_count:
          type: integer
        avg_latency_ms:
          type: integer
        is_available:
          type: boolean

  responses:
    BadRequest:
      description: Invalid request
      headers:
        X-ProxyHubb-Authority-Mode:
          $ref: '#/components/headers/ProxyHubbAuthorityMode'
        X-ProxyHubb-Authority-Chain-Scope:
          $ref: '#/components/headers/ProxyHubbAuthorityChainScope'
        X-ProxyHubb-Authority-DB-Role:
          $ref: '#/components/headers/ProxyHubbAuthorityDBRole'
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

    Unauthorized:
      description: Authentication required
      headers:
        X-ProxyHubb-Authority-Mode:
          $ref: '#/components/headers/ProxyHubbAuthorityMode'
        X-ProxyHubb-Authority-Chain-Scope:
          $ref: '#/components/headers/ProxyHubbAuthorityChainScope'
        X-ProxyHubb-Authority-DB-Role:
          $ref: '#/components/headers/ProxyHubbAuthorityDBRole'
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

    NotFound:
      description: Resource not found
      headers:
        X-ProxyHubb-Authority-Mode:
          $ref: '#/components/headers/ProxyHubbAuthorityMode'
        X-ProxyHubb-Authority-Chain-Scope:
          $ref: '#/components/headers/ProxyHubbAuthorityChainScope'
        X-ProxyHubb-Authority-DB-Role:
          $ref: '#/components/headers/ProxyHubbAuthorityDBRole'
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
