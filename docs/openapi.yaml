components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    ProxyHubbAuthorityMode:
      description: Runtime authority model for the endpoint.
      schema:
        type: string
        enum: [chain_authoritative, db_authoritative, hybrid_async_chain]
    ProxyHubbAuthorityChainScope:
      description: Chain interaction scope for this response.
      schema:
        type: string
        examples: [none, read_only_balance_check, write, async_write, async_write_attestation, async_write_settlement, required]
    ProxyHubbAuthorityDBRole:
      description: Role of the DB in the response path.
      schema:
        type: string
        examples: [source_of_truth, mirror, none]

  schemas:
    WalletChallengeRequest:
      type: object
      required: [address]
      properties:
        address:
          type: string
          description: Wallet address to challenge. Current backend flow verifies Solana Ed25519 signatures.

    WalletChallengeResponse:
      type: object
      properties:
        nonce:
          type: string
        message:
          type: string
        blockhash_backed:
          type: boolean

    WalletLoginRequest:
      type: object
      required: [address, signature, nonce]
      properties:
        address:
          type: string
        signature:
          type: string
        nonce:
          type: string

    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          description: Synthetic or profile email. Wallet login is the primary auth mechanism.
        role:
          type: string
        status:
          type: string
        display_name:
          type: string
          nullable: true
        username:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        wallet_address:
          type: string
          nullable: true
        trust_tier:
          type: string
        verified:
          type: boolean
        created_at:
          type: string
          format: date-time

    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        node_id:
          type: string
          format: uuid
          nullable: true
        listing_id:
          type: string
          format: uuid
          nullable: true
        type:
          type: string
          enum: [rotating, sticky, universal]
        status:
          type: string
          enum: [active, terminated]
        strategy:
          type: string
        max_price:
          type: number
          format: float
        bandwidth_limit:
          type: integer
          format: int64
        bytes_used:
          type: integer
          format: int64
        credentials_user:
          type: string
        credentials_pass:
          type: string
        config:
          type: string
        start_time:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    CreateSessionRequest:
      type: object
      properties:
        type:
          type: string
          enum: [rotating, sticky]
          default: rotating
        bandwidth_limit:
          type: integer
          format: int64
        target_geo:
          type: string
          description: Target country code (ISO 3166-1 alpha-2)
        target_isp:
          type: string
        routing_profile:
          type: string
        allowed_domains:
          type: array
          items:
            type: string
        blocked_domains:
          type: array
          items:
            type: string
        rotation_type:
          type: string
        rotation_interval_seconds:
          type: integer
        time_limit_minutes:
          type: integer
        preferred_tier:
          type: string

    CreateInstantSessionRequest:
      type: object
      required: [strategy]
      properties:
        strategy:
          type: string
          enum: [fastest, cheapest, random, country]
        max_price:
          type: number
          format: float
        target_country:
          type: string
        bandwidth_limit:
          type: integer
          format: int64

    CreateSessionFromListingRequest:
      type: object
      required: [listing_id]
      properties:
        listing_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [rotating, sticky]
        bandwidth_limit:
          type: integer
          format: int64

    SessionProxyCredentials:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        host:
          type: string
        port:
          type: integer
        protocol:
          type: string
        endpoint:
          type: string

    SessionLimits:
      type: object
      properties:
        bandwidth_limit_bytes:
          type: integer
          format: int64
        bandwidth_limit_gb:
          type: number
          format: float
        trust_tier:
          type: string
        max_concurrency:
          type: integer

    SessionListItem:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/Session'
        bandwidth_used:
          type: integer
          format: int64
        bandwidth_limit:
          type: integer
          format: int64

    SessionListResponse:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionListItem'
        count:
          type: integer

    CreateSessionResponse:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/Session'
        proxy_credentials:
          $ref: '#/components/schemas/SessionProxyCredentials'
        limits:
          $ref: '#/components/schemas/SessionLimits'
        redis_warning:
          type: string

    InstantSessionResponse:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/Session'
        proxy_credentials:
          $ref: '#/components/schemas/SessionProxyCredentials'
        strategy:
          type: string
        warning:
          type: string

    ProviderSelection:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        listing_title:
          type: string
        price_per_gb:
          type: number
          format: float
        proxy_type:
          type: string
        country:
          type: string
        quality_score:
          type: number
          format: float

    ListingSessionInfo:
      type: object
      properties:
        type:
          type: string
        bandwidth_limit_gb:
          type: number
          format: float
        min_cost_sol:
          type: number
          format: float
        node_latency_ms:
          type: integer

    ListingSessionResponse:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/Session'
        proxy_credentials:
          $ref: '#/components/schemas/SessionProxyCredentials'
        provider:
          $ref: '#/components/schemas/ProviderSelection'
        session_info:
          $ref: '#/components/schemas/ListingSessionInfo'
        redis_warning:
          type: string

    SessionDetailResponse:
