            type: string
            enum: [uptime, bandwidth, sessions]
            default: uptime
        - name: period
          in: query
          schema:
            type: string
            enum: [1h, 24h, 7d, 30d]
            default: 24h
          description: Filters bandwidth (usage_records) and sessions rankings; uptime uses indexed counters (see period_applied).
      responses:
        '200':
          description: Leaderboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplorerLeaderboard'

  /v1/explorer/sessions:
    get:
      tags: [Explorer]
      summary: Public session explorer (optional)
      description: Requires EXPLORER_PUBLIC_SESSIONS_ENABLED=true on the server.
      operationId: listExplorerSessions
      responses:
        '200':
          description: Sessions
        '404':
          description: Feature disabled

  /v1/explorer/earnings:
    get:
      tags: [Explorer]
      summary: Provider earnings explorer (optional)
      description: Requires EXPLORER_PUBLIC_EARNINGS_ENABLED=true on the server.
      operationId: getExplorerProviderEarnings
      responses:
        '200':
          description: Earnings
        '404':
          description: Feature disabled

  /v1/explorer/health/history:
    get:
      tags: [Explorer]
      summary: Network health history
      operationId: getExplorerHealthHistory
      responses:
        '200':
          description: Health history

  /v1/explorer/ws:
    get:
      tags: [Explorer]
      summary: Explorer WebSocket (real-time)
      description: |
        Upgrades to WebSocket. Server sends JSON envelopes `{ "type", "data", "timestamp" }`.

        **Server → client types**
        - `initial` — snapshot: `{ transactions[], blocks[], nodes[] }` on connect
        - `new_transaction` — `{ tx_hash, from, to, amount, currency, tx_type }`
        - `new_block` — `{ block_number, block_hash, transaction_count }`
        - `node_update` — node geo/status patch for map markers

        **Client → server**
        - `{ "type": "subscribe", "topics": ["transactions", "blocks", "nodes"] }` — optional topic filter

        Idle connections receive WebSocket ping every 30s. Per-IP connection caps apply.
      responses:
        '101':
          description: Switching Protocols
        '429':
          description: Too many WebSocket connections

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Partner API key (`phub_…`). Create with JWT via POST /v1/bulk/api-keys.

  headers:
    ProxyHubbAuthorityMode:
      description: Runtime authority model for the endpoint.
      schema:
        type: string
        enum: [chain_authoritative, db_authoritative, hybrid_async_chain]
    ProxyHubbAuthorityChainScope:
      description: Chain interaction scope for this response.
      schema:
        type: string
        examples: [none, read_only_balance_check, write, async_write, async_write_attestation, async_write_settlement, required]
    ProxyHubbAuthorityDBRole:
      description: Role of the DB in the response path.
      schema:
        type: string
        examples: [source_of_truth, mirror, none]

  schemas:
    MarketplaceFunnelSummary:
      type: object
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        filters:
          type: object
          properties:
            collection: { type: string }
            country: { type: string }
            seller_id: { type: string, format: uuid }
        steps:
          type: array
          items:
            type: object
            properties:
              event_name: { type: string }
              count: { type: integer, format: int64 }
        conversion:
          type: object
          additionalProperties:
            type: number
            format: double
          description: Ratios such as view_to_order, order_to_escrow_confirmed, view_to_escrow_confirmed
        countries:
          type: array
          items: { type: string }
          description: Distinct listing countries present in the filtered window

    WalletChallengeRequest:
      type: object
      required: [address]
      properties:
        address:
          type: string
          description: Wallet address to challenge. Current backend flow verifies Solana Ed25519 signatures.

    WalletChallengeResponse:
      type: object
      properties:
        nonce:
          type: string
        message:
          type: string
        blockhash_backed:
          type: boolean

    WalletLoginRequest:
      type: object
      required: [address, signature, nonce]
      properties:
        address:
          type: string
        signature:
          type: string
        nonce:
          type: string

    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          description: Synthetic or profile email. Wallet login is the primary auth mechanism.
        role:
          type: string
        status:
          type: string
        display_name:
          type: string
          nullable: true
        username:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        wallet_address:
          type: string
          nullable: true
        trust_tier:
          type: string
        verified:
          type: boolean
        created_at:
          type: string
          format: date-time

    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        node_id:
          type: string
          format: uuid
          nullable: true
        listing_id:
          type: string
          format: uuid
          nullable: true
        type:
          type: string
          enum: [rotating, sticky, universal]
        status:
          type: string
          enum: [active, terminated]
        strategy:
          type: string
        max_price:
          type: number
          format: float
        bandwidth_limit:
          type: integer
          format: int64
        bytes_used:
          type: integer
          format: int64
        credentials_user:
          type: string
        credentials_pass:
          type: string
        config:
          type: string
        start_time:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    CreateSessionRequest:
      type: object
      properties:
        type:
          type: string
          enum: [rotating, sticky]
          default: rotating
        bandwidth_limit:
          type: integer
          format: int64
        target_geo:
          type: string
          description: Target country code (ISO 3166-1 alpha-2)
        target_isp:
          type: string
        routing_profile:
          type: string
        allowed_domains:
          type: array
          items:
            type: string
        blocked_domains:
          type: array
          items:
            type: string
        rotation_type:
          type: string
        rotation_interval_seconds:
          type: integer
        time_limit_minutes:
          type: integer
        preferred_tier:
          type: string

    CreateInstantSessionRequest:
      type: object
