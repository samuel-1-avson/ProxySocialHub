          style: form
          explode: true
        - name: min_quality_score
          in: query
          schema:
            type: number
            format: float
        - name: max_price_per_gb
          in: query
          schema:
            type: number
            format: float
        - name: min_success_rate
          in: query
          schema:
            type: number
            format: float
        - name: min_uptime_percent
          in: query
          schema:
            type: number
