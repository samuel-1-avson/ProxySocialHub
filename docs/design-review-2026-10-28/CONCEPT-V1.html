<script>
'use strict';
const state={mode:'buyer',page:'overview',scenario:'ready',country:'all',type:'all',marketView:'list',tab:'',networkTab:'overview'};
const labels={buyer:[['overview','Overview','◫'],['marketplace','Marketplace','⌕'],['connections','Connections','⇄'],['activity','Activity','≡'],['network','Network','◎']],provider:[['overview','Overview','◫'],['nodes','Nodes','◇'],['listings','Listings','▤'],['earnings','Earnings','↗'],['network','Network','◎']]};
const listings=[{id:'GH-01',country:'GH',name:'Ghana',city:'Accra',type:'Residential',price:'0.89',latency:'55 ms · measured example',reviews:'No reviews yet',available:'Available',minimum:'1 GB minimum'},{id:'US-02',country:'US',name:'United States',city:'New York',type:'Residential',price:'1.04',latency:'Latency not measured',reviews:'No reviews yet',available:'Available',minimum:'1 GB minimum'},{id:'DE-03',country:'DE',name:'Germany',city:'Frankfurt',type:'Datacenter',price:'0.48',latency:'42 ms · measured example',reviews:'4.8 · 14 example reviews',available:'Available',minimum:'5 GB minimum'}];
const $=s=>document.querySelector(s);
const btn=(text,attrs='',variant='')=>`<button class="btn ${variant}" ${attrs}>${text}</button>`;
const status=(text,kind='good')=>`<span class="status ${kind}">${text}</span>`;
const tabs=(items,selected,kind='tab')=>`<div class="tabs" role="group" aria-label="View">${items.map(([id,label])=>`<button class="tab ${selected===id?'active':''}" data-${kind}="${id}" aria-pressed="${selected===id}">${label}</button>`).join('')}</div>`;
const stats=items=>`<div class="stats">${items.map(([label,value,detail])=>`<div class="stat"><div class="label">${label}</div><div class="value mono">${value}</div><div class="detail">${detail}</div></div>`).join('')}</div>`;
const head=(title,desc,actions='')=>`<div class="pagehead"><div><p class="eyebrow">${state.mode==='buyer'?'Buyer':'Provider'} workspace</p><h1>${title}</h1><p class="sub">${desc}</p></div>${actions?`<div class="actions">${actions}</div>`:''}</div>`;
const foot=()=>'<p class="footnote">Design specimen. All places, prices, statuses, balances, traffic, ratings and dates in this concept are illustrative. No payments, credentials, live telemetry or account changes are performed.</p>';
function coverage(){return `<div class="map"><div class="smallcaps">Coverage preview</div><svg viewBox="0 0 300 190" role="img" aria-label="Schematic example coverage connecting United States, Germany and Ghana; not a geographic map"><path d="M20 43L48 20 94 23 112 48 92 69 82 94 54 85 38 65ZM90 101L114 109 127 135 111 172 95 145ZM157 33L193 27 210 46 192 62 163 54ZM164 73L195 69 216 101 204 142 184 157 166 116ZM218 36L263 32 288 66 273 100 241 86 214 65Z" fill="#cbd2d8"/><path d="M70 62Q141 8 181 49M181 49Q165 74 176 101" stroke="#6b7c87" fill="none" stroke-dasharray="3 5"/><g fill="#5c6b73"><circle cx="70" cy="62" r="5"/><circle cx="181" cy="49" r="5"/><circle cx="176" cy="101" r="5"/></g><g fill="#2b303a" font-size="10" font-family="Arial"><text x="47" y="51">US</text><text x="190" y="44">DE</text><text x="186" y="108">GH</text></g></svg><div class="maplegend"><span class="dot"></span>Three example regions · schematic</div><p class="footnote">Production uses measured regional supply, synchronized with the list.</p></div>`}
function overview(){
 if(state.mode==='provider')return providerOverview();
 const scenario=`<label class="sub">Preview state <select class="stateselect" id="scenario" aria-label="Preview account state"><option value="ready" ${state.scenario==='ready'?'selected':''}>Access ready</option><option value="new" ${state.scenario==='new'?'selected':''}>New buyer</option><option value="preparing" ${state.scenario==='preparing'?'selected':''}>Access preparing</option></select></label>`;
 let hero=state.scenario==='new'?`${status('Start with a proxy','muted')}<h2>Your first connection starts here.</h2><p class="sub">Choose a location, review the price, then connect your app with the credentials from your order.</p>`:state.scenario==='preparing'?`${status('Payment confirmed','warn')}<h2>Your access is being prepared.</h2><p class="sub">Order PH-1042 is funded. You can leave this screen and return to the same order.</p>`:`${status('Access ready')}<h2>Your proxy access is ready.</h2><p class="sub">United States · Residential · HTTP CONNECT / SOCKS5</p><p class="sub" style="margin-top:8px">Credentials available. Client routing has not been verified.</p>`;
 let action=state.scenario==='new'?btn('Browse proxies →','data-nav="marketplace"'):state.scenario==='preparing'?btn('View order →','data-order="PH-1042"'):btn('Open connection →','data-nav="connections"');
 return head('Overview','Your access, usage, and next step.',scenario)+`<section class="hero"><div>${hero}</div><div class="actions">${action}</div></section>`+stats(state.scenario==='new'?[['Active access','0','No purchases yet'],['Usage this month','—','No measurements yet'],['Spend this month','—','No charges yet']]:[['Active access','2','One expiring within 24 hours'],['Usage this month','3.2 GB','Across two example connections'],['Spend this month','0.040 SOL','Settled usage · example']])+`<div class="columns"><section><div class="sectionhead"><h2>Your connections</h2>${btn('View all →','data-nav="connections"','ghost')}</div>${state.scenario==='new'?'<p class="sub">Purchased access will appear here.</p>':connectionRows()}</section><section class="attention">${status('Needs attention','warn')}<h3>${state.scenario==='new'?'No setup required to browse.':'Ghana access expires tomorrow.'}</h3><p class="muted">${state.scenario==='new'?'Explore locations and pricing before connecting a wallet.':'Review your remaining allocation before the current access expires.'}</p>${btn(state.scenario==='new'?'Explore the marketplace →':'Review access →',state.scenario==='new'?'data-nav="marketplace"':'data-nav="connections"','ghost')}</section></div><section class="timeline"><div class="sectionhead"><h2>Recent activity</h2>${btn('View activity →','data-nav="activity"','ghost')}</div>${state.scenario==='new'?'<p class="sub">Your first order and usage will appear here.</p>':`<div class="event"><time>Today</time><span>Order PH-1042 · ${state.scenario==='preparing'?'Payment confirmed; access preparing':'Access prepared'}</span><span class="muted">United States</span></div><div class="event"><time>Yesterday</time><span>Session ended · Usage settled</span><span class="mono">0.012 SOL</span></div>`}</section>`+foot();
}
function connectionRows(){return `<div class="row"><div class="rowleft"><span class="location">US</span><div><h3>United States · Residential</h3><p class="sub">2.8 GB remaining · client routing unknown</p></div></div>${btn('Open','data-access="US-02"','small secondary')}</div><div class="row"><div class="rowleft"><span class="location">GH</span><div><h3>Ghana · Residential</h3><p class="sub">0.7 GB remaining · expires tomorrow</p></div></div>${btn('Open','data-access="GH-01"','small secondary')}</div>`}
function marketplace(){const shown=listings.filter(x=>(state.country==='all'||x.country===state.country)&&(state.type==='all'||x.type===state.type)&&(state.tab!=='saved'||x.country!=='DE')).sort((a,b)=>Number(a.price)-Number(b.price));return head('Marketplace','Find capacity that fits your next request.',btn('Help me choose','data-info="matching"','secondary'))+tabs([['list','Browse'],['saved','Saved']],state.tab==='saved'?'saved':'list','market-tab')+`<div class="filterbar"><label>Location <select id="country" aria-label="Filter by location"><option value="all">All locations</option>${listings.map(x=>`<option value="${x.country}" ${state.country===x.country?'selected':''}>${x.name}</option>`).join('')}</select></label><label>Type <select id="type" aria-label="Filter by proxy type"><option value="all">All types</option><option ${state.type==='Residential'?'selected':''}>Residential</option><option ${state.type==='Datacenter'?'selected':''}>Datacenter</option></select></label>${btn('More filters','data-info="filters"','secondary')}<span class="push">${shown.length} ${state.tab==='saved'?'saved examples':shown.length===1?'example offer':'example offers'} · lowest price first</span></div><div class="catalog"><section aria-label="Proxy offers">${shown.length?shown.map(x=>`<article class="listing"><div><div class="rowleft"><span class="location">${x.country}</span><div><h3>${x.name}</h3><p class="sub">${x.city} · ${x.type} · HTTP / SOCKS5</p></div></div><div class="listingmeta">${status(x.available)}<span>${x.latency}</span><span>${x.reviews}</span></div></div><div class="listingprice"><div class="price mono">$${x.price}<span> / GB</span></div><p class="minimum">${x.minimum}</p>${btn('View details →',`data-listing="${x.id}"`,'small secondary')}</div></article>`).join(''):`<div class="empty"><h2>No proxies match these filters.</h2><p class="sub">Try a different location or proxy type.</p>${btn('Clear filters','id="clearfilters"')}</div>`}</section>${coverage()}</div>`+foot()}
function connections(){return head('Connections','Use purchased access and inspect actual session activity.',btn('Browse proxies','data-nav="marketplace"','secondary'))+tabs([['access','Access'],['sessions','Sessions']],state.tab==='sessions'?'sessions':'access')+(state.tab==='sessions'?`<div class="tablewrap" role="region" aria-label="Scrollable data table" tabindex="0"><table class="table"><thead><tr><th>Session</th><th>Traffic state</th><th>Usage</th><th>Cost</th><th></th></tr></thead><tbody><tr><td>US · Residential<p class="sub">Order PH-1042</p></td><td>${status('No traffic observed','muted')}</td><td class="mono">0 GB</td><td class="mono">0 SOL</td><td>${btn('Inspect','data-info="session"','small secondary')}</td></tr><tr><td>GH · Residential<p class="sub">Previous example session</p></td><td>${status('Ended','muted')}</td><td class="mono">1.1 GB</td><td class="mono">0.012 SOL</td><td>${btn('Receipt','data-order="PH-1041"','small secondary')}</td></tr></tbody></table></div>`:`<div class="introline">${status('Access ready')}<span class="muted">Ready credentials do not verify that your browser is routing traffic.</span></div><section class="quietpanel">${connectionRows()}</section><div class="steps"><section class="step"><div class="stepnumber mono">01 / Purchase</div><h3>Choose your capacity</h3><p>Location, protocol and a clear per-GB price.</p></section><section class="step"><div class="stepnumber mono">02 / Configure</div><h3>Connect your app</h3><p>Extension, cURL or your preferred SDK.</p></section><section class="step"><div class="stepnumber mono">03 / Verify</div><h3>Observe actual traffic</h3><p>Usage and settlement follow the same order.</p></section></div>`)+foot()}
function activity(){const active=['usage','billing'].includes(state.tab)?state.tab:'orders';return head('Activity','One place for orders, measured usage, and cost.')+tabs([['orders','Orders'],['usage','Usage'],['billing','Billing']],active)+(active==='orders'?`<div class="tablewrap" role="region" aria-label="Scrollable data table" tabindex="0"><table class="table"><thead><tr><th>Order</th><th>Location</th><th>Order state</th><th>Allocation</th><th></th></tr></thead><tbody><tr><td class="mono">PH-1042<p class="sub">28 Oct · example</p></td><td>United States</td><td>${status('Active')}</td><td>5 GB</td><td>${btn('View order →','data-order="PH-1042"','small secondary')}</td></tr><tr><td class="mono">PH-1041<p class="sub">27 Oct · example</p></td><td>Ghana</td><td>${status('Completed','muted')}</td><td>2 GB</td><td>${btn('View order →','data-order="PH-1041"','small secondary')}</td></tr></tbody></table></div>`:active==='usage'?stats([['Measured usage','3.2 GB','This month · example'],['Settled cost','0.040 SOL','This month · example'],['Unmeasured periods','—','Shown explicitly if present']])+`<section class="quietpanel"><h2>Usage follows each connection.</h2><p class="sub">Production adds the measured usage chart, accessible data table, period selection, and per-order breakdown here.</p>${btn('Inspect example receipt →','data-order="PH-1041"','ghost')}</section>`:`<section class="quietpanel"><h2>Your entitlements</h2><p class="sub">Access Passes, supported subscriptions and their payment history live here. Wallet funds and escrow stay separately labeled.</p>${btn('View wallet breakdown','data-info="wallet"','secondary')}</section>`)+foot()}
function providerOverview(){return head('Provider overview','Reliable supply, clear readiness, and traceable earnings.',btn('Add node →','data-setup="true"'))+`<section class="hero"><div>${status('Two nodes reporting')}<h2>Your supply is available.</h2><p class="sub">Two example offers are published. Review one node that has stopped reporting.</p></div>${btn('Review nodes →','data-nav="nodes"','secondary')}</section>`+stats([['Nodes online','2 / 3','One needs attention'],['Earned this month','0.124 SOL','Metered usage · example'],['Pending settlement','0.018 SOL','Separate from paid earnings']])+`<div class="columns"><section><div class="sectionhead"><h2>Provider readiness</h2></div><div class="row"><h3>Account approved</h3>${status('Complete')}</div><div class="row"><h3>Heartbeat verified</h3>${status('2 of 3 nodes')}</div><div class="row"><h3>Offers published</h3>${status('2 available')}</div><div class="row"><h3>Usage and earnings</h3>${btn('View evidence →','data-nav="earnings"','ghost')}</div></section><section class="attention">${status('Heartbeat missing','warn')}<h3>accra-backup needs a check.</h3><p class="muted">Last heartbeat 18 minutes ago in this example. A registered node is not automatically healthy.</p>${btn('Inspect node →','data-node="accra-backup"','ghost')}</section></div>`+foot()}
function nodes(){return head('Nodes','Operate supply and diagnose the node that needs attention.',btn('Add node →','data-setup="true"'))+`<div class="introline">${status('2 healthy')}<span class="muted">1 missing heartbeat · example fleet</span></div><div class="tablewrap" role="region" aria-label="Scrollable data table" tabindex="0"><table class="table"><thead><tr><th>Node</th><th>Readiness</th><th>Last heartbeat</th><th>Offers</th><th></th></tr></thead><tbody>${[['accra-primary','GH · Residential','Healthy','8 seconds ago','1'],['new-york-01','US · Residential','Healthy','12 seconds ago','1'],['accra-backup','GH · Residential','Offline','18 minutes ago','0']].map(n=>`<tr><td><h3>${n[0]}</h3><p class="sub">${n[1]}</p></td><td>${status(n[2],n[2]==='Offline'?'warn':'good')}</td><td>${n[3]}</td><td>${n[4]}</td><td>${btn('Inspect →',`data-node="${n[0]}"`,'small secondary')}</td></tr>`).join('')}</tbody></table></div>`+foot()}
function providerListings(){const products=state.tab==='products';return head('Listings','Keep offers, products, and linked-node readiness together.',btn('Create listing →','data-info="newlisting"'))+tabs([['offers','Offers'],['products','Products']],products?'products':'offers')+`<div class="tablewrap" role="region" aria-label="Scrollable data table" tabindex="0"><table class="table"><thead><tr><th>${products?'Product template':'Offer'}</th><th>Linked supply</th><th>Price / GB</th><th>Availability</th><th></th></tr></thead><tbody>${listings.slice(0,2).map(x=>`<tr><td><h3>${x.name} · ${x.type}</h3><p class="sub">${products?'Catalog template':'Provider-signed offer example'}</p></td><td>${x.country==='GH'?'accra-primary':'new-york-01'}</td><td class="mono">$${x.price}</td><td>${status('Available')}</td><td>${btn('Preview →',`data-listing="${x.id}"`,'small secondary')}</td></tr>`).join('')}</tbody></table></div>`+foot()}
function earnings(){const tab=['payouts','customers'].includes(state.tab)?state.tab:'overview';return head('Earnings','Earned, pending, and paid are different states.')+tabs([['overview','Overview'],['payouts','Payouts'],['customers','Customers']],tab)+stats([['Earned this month','0.124 SOL','Metered example usage'],['Pending settlement','0.018 SOL','Not yet payable'],['Paid this month','0.106 SOL','Confirmed example payouts']])+(tab==='customers'?`<section class="quietpanel"><h2>Customer context</h2><p class="sub">Relationships, order-linked conversations, and supported refill offers remain accessible here.</p>${btn('Open example conversation','data-info="inbox"','secondary')}</section>`:`<section class="receipt"><div class="sectionhead"><h2>${tab==='payouts'?'Payout history':'Recent settlement'}</h2>${status('Example receipt')}</div><div class="row"><span>Usage attributed to accra-primary</span><span class="mono">1.1 GB</span></div><div class="row"><span>Settled provider amount</span><span class="mono">0.012 SOL</span></div><div class="row"><span>Evidence</span>${btn('Inspect receipt →','data-info="payout"','ghost')}</div></section>`)+foot()}
function network(){const nt=state.networkTab;return head('Network','Public evidence, with sources and operating limitations.')+tabs([['overview','Overview'],['nodes','Nodes'],['ledger','Ledger'],['governance','Governance']],nt,'network-tab')+(nt==='overview'?`<div class="networkhero"><section class="quietpanel">${status('Example evidence only','muted')}<h2 style="margin-top:16px">A network you can inspect.</h2><p class="sub">Measured availability, real settlement references, and explicit data freshness belong together.</p><div class="statbar"><div><strong class="mono">3</strong><span>Example registered nodes</span></div><div><strong class="mono">2</strong><span>Example healthy nodes</span></div></div><p class="footnote">Production exposes operating environment, indexing health, quorum limitations, and observation times. This concept is not a live network display.</p></section>${coverage()}</div>`:nt==='nodes'?`<div class="introline">${status('Table and map share data','muted')}<span class="muted">Public node evidence is distinct from purchasable offers.</span></div>${coverage()}`:nt==='ledger'?`<section class="quietpanel"><h2>Transactions and blocks</h2><p class="sub">Separate subviews retain transaction hashes and block identities. Address search returns typed wallet or contract details.</p>${btn('Inspect example settlement','data-info="payout"','secondary')}</section>`:`<section class="quietpanel"><h2>Proposals and treasury</h2><p class="sub">Public proposals, eligibility-aware voting, execution status, and treasury evidence share a focused destination.</p>${btn('Inspect proposal anatomy','data-info="governance"','secondary')}</section>`)+foot()}
function navHTML(){return labels[state.mode].map(([id,label,icon])=>`<button class="navbtn ${state.page===id?'active':''}" data-nav="${id}" ${state.page===id?'aria-current="page"':''}><span class="navicon" aria-hidden="true">${icon}</span><span>${label}</span></button>`).join('')}
function render(){ $('#workspace').value=state.mode;$('#desktopnav').innerHTML=navHTML();$('#mobilenav').innerHTML=navHTML();$('#screen').innerHTML=({overview,marketplace,connections,activity,nodes,listings:providerListings,earnings,network}[state.page]||overview)();document.title=`${labels[state.mode].find(x=>x[0]===state.page)?.[1]||'Overview'} · ProxyHubb design concept`; }
function navigate(page){state.page=page;state.tab='';render();window.scrollTo({top:0,behavior:'instant'});}
function modal(title,html){$('#dialogtitle').textContent=title;$('#dialogbody').innerHTML=html;if(!$('#detail').open)$('#detail').showModal();}
const information={
help:['Help & support','Find guidance by task: buying bandwidth, connecting an app, wallet recovery, or provider setup. The support forum and an actual configured contact route live here.'],
settings:['Settings','Profile · Wallet · Security · Developer access · Notifications. Account sessions and devices belong under Security; proxy traffic sessions belong under Connections.'],
wallet:['Wallet breakdown','<div class="row"><span>Wallet available</span><b class="mono">0.250 SOL</b></div><div class="row"><span>Locked in escrow</span><b class="mono">0.058 SOL</b></div><div class="row"><span>Platform balance</span><b class="mono">0.000 SOL</b></div><p class="footnote">Invented balances. Production includes authoritative balances, network, history, and supported recovery/deposit/withdrawal actions.</p>'],
inbox:['Inbox','One place for account notifications and messages. An order-specific conversation links back to its receipt and connection. Infrastructure alerts appear only for authorized operators.'],
matching:['Help me choose','An optional refinement asks for location, budget, and session type. Browse stays usable if the recommendation service is unavailable. Ranking explanations use actual available signals.'],
filters:['Additional filters','The implementation adds supported protocol, measured latency, session mode, and purchase limits. Applied filters remain visible and shareable. This specimen filters by Location and Type above.'],
session:['Session evidence','No traffic has been observed for this example. Ready credentials and a configured client are separate from measured traffic. The implementation shows observation time, usage, interruptions, and linked settlement.'],
newlisting:['Create a listing','A short dedicated flow selects a healthy node, defines the offer, validates price/capacity, obtains the required signature, and previews the buyer view. Draft support depends on the service contract.'],
payout:['Settlement evidence','A real receipt includes the originating order/session, metered quantity, price, provider amount, fees, refund if any, transaction reference, and current settlement state. This example has no on-chain transaction.'],
governance:['Proposal anatomy','The production detail shows the actual proposal, voting eligibility, outcomes, execution state, and related treasury records. A proposal view does not imply permission to vote or execute.']};
function openAccess(id){modal('Connect your app',`<p class="sub">${id==='GH-01'?'Ghana':'United States'} · Residential · example access</p>${status('Credentials ready')}<div class="secret">Endpoint: example.invalid:8090<br>Username: example-order-user<br>Password: ••••••••••••</div><p>The production screen reveals authorized credentials and provides extension pairing, cURL, and supported SDK instructions.</p><p class="sub">Client routing: unknown. No live connection is made in this concept.</p>${btn('View linked order →','data-order="PH-1042"','secondary')}`)}
function openOrder(id){modal(`Order ${id}`,`<p>One durable record follows payment, access, usage, and settlement.</p><div class="progress"><span>Order created</span><span>Funding confirmed</span><span class="current">${id==='PH-1041'?'Completed':'Active'}</span></div><div class="row"><span>Order state</span><strong>${id==='PH-1041'?'Completed':'Active'}</strong></div><div class="row"><span>Access</span><strong>${id==='PH-1041'?'Historical receipt':'Ready'}</strong></div><div class="row"><span>Client routing</span><span>Not verified</span></div><p class="footnote">Actual order states include pending, awaiting payment, active, completed, disputed, refunded and cancelled. Escrow substates remain separate. This is example data.</p>${btn('Open connection instructions','data-access="US-02"','secondary')}`)}
function openListing(id){const x=listings.find(x=>x.id===id);modal(`${x.name} · ${x.type}`,`<p class="sub">${x.city} · HTTP CONNECT / SOCKS5</p><div class="row"><span>Price per GB</span><strong class="mono">$${x.price}</strong></div><div class="row"><span>Minimum</span><span>${x.minimum}</span></div><div class="row"><span>Latency</span><span>${x.latency}</span></div><div class="row"><span>Reviews</span><span>${x.reviews}</span></div><p style="margin-top:20px">Purchase uses a review step with the authoritative quote, wallet/network, fees and signature consequence. Exact provider network identity remains private before authorized access.</p><p class="footnote">Design concept only. No purchase control or wallet prompt is connected.</p>`)}
function setup(){modal('Add a node',`<p>One task, from installation to verified supply.</p><ol><li>Choose a supported OS and verified build.</li><li>Create/select a scoped node credential and configuration.</li><li>Install and start the provider.</li><li>Wait for a verified heartbeat.</li><li>Publish a ready offer.</li></ol><p class="sub">Production retains resumable steps, download verification, credential scope, and recovery. No credential or node is created here.</p>`)}
function openSearch(){modal('Search workspace',`<label for="command" class="sub">Find a destination in this design concept</label><input class="searchfield" id="command" placeholder="Search destinations…" autocomplete="off"><div id="commandresults"></div>`);updateCommands('');$('#command').focus();}
function updateCommands(q){$('#commandresults').innerHTML=labels[state.mode].filter(x=>x[1].toLowerCase().includes(q.toLowerCase())).map(([id,label])=>`<button class="commandresult" data-command="${id}">${label} →</button>`).join('')||'<p class="sub">No matching destination.</p>';}
document.addEventListener('click',e=>{const target=e.target.closest('button');if(!target)return;if(target.matches('.dialogclose')){$('#detail').close();return;}if(target.dataset.nav){navigate(target.dataset.nav);return;}if(target.dataset.command){$('#detail').close();navigate(target.dataset.command);return;}if(target.dataset.info){const [title,body]=information[target.dataset.info];modal(title,`<div>${body}</div>`);return;}if(target.dataset.listing){openListing(target.dataset.listing);return;}if(target.dataset.access){openAccess(target.dataset.access);return;}if(target.dataset.order){openOrder(target.dataset.order);return;}if(target.dataset.node){modal(target.dataset.node,`<p>Node detail owns heartbeat freshness, actual readiness, linked offers, diagnostics, supported service configuration, and scoped credentials.</p><p class="sub">${target.dataset.node==='accra-backup'?'Example state: offline. Last heartbeat 18 minutes ago.':'Example state: healthy. Last heartbeat under one minute ago.'}</p>${btn('View guided setup','data-setup="true"','secondary')}`);return;}if(target.dataset.setup){setup();return;}if(target.dataset.tab){state.tab=target.dataset.tab;render();return;}if(target.dataset.marketTab){state.tab=target.dataset.marketTab==='saved'?'saved':'';render();return;}if(target.dataset.networkTab){state.networkTab=target.dataset.networkTab;render();return;}if(target.id==='search'){openSearch();return;}if(target.id==='clearfilters'){state.country='all';state.type='all';render();return;}if(target.id==='account'){modal('Account & workspace',`<p class="sub">Jamie Demo · illustrative identity</p><div class="actions">${btn('Buyer workspace','data-switch="buyer"','secondary')}${btn('Provider workspace','data-switch="provider"','secondary')}</div><p style="margin-top:22px">In production, switching mode changes navigation without changing account capabilities. Provider access still requires approval.</p>${btn('Settings','data-info="settings"','ghost')}`);return;}if(target.dataset.switch){state.mode=target.dataset.switch;state.page='overview';state.tab='';$('#detail').close();render();}});
document.addEventListener('change',e=>{if(e.target.id==='workspace'){state.mode=e.target.value;state.page='overview';state.tab='';render();}if(e.target.id==='country'){state.country=e.target.value;render();}if(e.target.id==='type'){state.type=e.target.value;render();}if(e.target.id==='scenario'){state.scenario=e.target.value;render();}});
document.addEventListener('input',e=>{if(e.target.id==='command')updateCommands(e.target.value)});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();}});
render();
</script>
</body>
</html>
