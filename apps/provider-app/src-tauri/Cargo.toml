[package]
name = "proxyhubb-provider-app"
version = "0.1.3"
edition = "2021"
publish = false
description = "ProxyHubb Provider: a tray app that runs the provider node"

[lib]
name = "provider_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-opener = "=2.7.1"
tauri-plugin-single-instance = "=2.5.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
