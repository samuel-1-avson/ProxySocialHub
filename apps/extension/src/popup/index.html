<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ProxyHubb</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <p class="kicker">ProxyHubb</p>
      <h1 id="headline">Proxy is off</h1>
      <p id="status" class="status">Checking…</p>
      <p id="proxy-control" class="muted"></p>

      <section id="connect-panel" hidden>
        <label class="field">
          Your proxies
          <select id="order"></select>
        </label>
        <div class="row">
          <button id="connect" type="button">Turn on</button>
          <button id="disconnect" type="button" class="secondary">Turn off</button>
        </div>
        <p id="switch-note" class="muted" hidden>
          Switching changes the proxy for this whole browser. Reload open tabs afterwards.
        </p>
        <p id="expiry" class="muted"></p>
        <p id="verify" class="verify"></p>
        <button id="recheck" type="button" class="secondary">Check my IP</button>
      </section>
      <p id="incognito" class="muted"></p>

      <section id="pair-panel">
        <label class="field">
          Pairing code
          <input id="code" type="text" autocomplete="off" spellcheck="false" maxlength="16" placeholder="Shown on your order page" />
        </label>
        <button id="pair" type="button" class="secondary">Connect this browser</button>
      </section>
      <p id="error" class="error" hidden></p>

      <details class="advanced">
        <summary>Advanced</summary>
        <label class="field">
          Server address
          <input id="api-base" type="url" />
        </label>
        <button id="save-api" type="button" class="secondary">Save</button>
      </details>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
