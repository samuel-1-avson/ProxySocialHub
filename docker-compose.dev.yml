# docker-compose.dev.yml
# Development Docker Compose - builds from source for testing

version: '3.8'

services:
  # ==================== CONTROL API (Development Build) ====================
  control-api:
    build:
      context: ./services/control-api
      dockerfile: Dockerfile.simple
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: proxyhubb-control-api
    ports:
      - "8080:8080"
    environment:
      # Core secrets (will use generated ones or fail)
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}

      # Database
      - DATABASE_URL=postgresql://${POSTGRES_USER:-proxyhubb}:${POSTGRES_PASSWORD:-proxyhubb}@postgres:5432/${POSTGRES_DB:-proxyhubb}?sslmode=disable

      # Redis (with password)
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redispass}@redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redispass}

      # Application
      - PORT=8080
      - APP_ENV=${APP_ENV:-development}
      - API_BASE_URL=http://localhost:8080
      - FRONTEND_URL=http://localhost:3000
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:4001,http://127.0.0.1:4001}

      # Optional services
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY}
      - PAYSTACK_PUBLIC_KEY=${PAYSTACK_PUBLIC_KEY}
      - SOLANA_RPC_ENDPOINT=${SOLANA_RPC_ENDPOINT:-https://api.devnet.solana.com}
      - SOLANA_NETWORK=${SOLANA_NETWORK:-devnet}
      - EDGE_GATEWAY_MGMT_URL=${EDGE_GATEWAY_MGMT_URL:-http://edge-gateway:8090}
      - SOLANA_PROGRAM_ID=${SOLANA_PROGRAM_ID:-2yDRyTwhHnVakKKMhhGG61V9b78RUdXRjAL3UiPwmDd7}

    # Security hardening
    read_only: false # Development needs write access for temp files
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    # Resource limits for development
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

    # Health check
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    restart: unless-stopped

    networks:
      - backend

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ==================== POSTGRES (Development) ====================
  postgres:
    image: postgres:16-alpine
    container_name: proxyhubb-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-proxyhubb}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-proxyhubb}
      - POSTGRES_DB=${POSTGRES_DB:-proxyhubb}
      - PGDATA=/var/lib/postgresql/data/pgdata

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/control-api/migrations:/docker-entrypoint-initdb.d:ro

    ports:
      - "5432:5432"

    # Health check
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proxyhubb} -d ${POSTGRES_DB:-proxyhubb}" ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    networks:
      - backend

  # ==================== REDIS (Secured) ====================
  redis:
    image: redis:7-alpine
    container_name: proxyhubb-redis
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:-redispass} --appendonly yes --protected-mode yes --maxmemory 256mb --maxmemory-policy allkeys-lru

    volumes:
      - redis_data:/data

    ports:
      - "6379:6379"

    # Health check with authentication
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispass}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

    restart: unless-stopped

    networks:
      - backend

  # ==================== EDGE GATEWAY ====================
  edge-gateway:
    build:
      context: ./services/edge-gateway
      dockerfile: Dockerfile
    container_name: proxyhubb-edge-gateway
    ports:
      - "3128:3128"
      - "8090:8090"
    environment:
      - RUST_LOG=info
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redispass}@redis:6379
      - CONTROL_API_URL=http://control-api:8080

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    restart: unless-stopped

    networks:
      - backend
      - frontend

    depends_on:
      - control-api
      - redis

  # ==================== PROMETHEUS ====================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: proxyhubb-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    ports:
      - "9090:9090"

    networks:
      - backend

    restart: unless-stopped

  # ==================== GRAFANA ====================
  grafana:
    image: grafana/grafana:10.2.0
    container_name: proxyhubb-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_SECURITY_ALLOW_EMBEDDING=false

    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana:/etc/grafana/provisioning:ro

    ports:
      - "3001:3000"

    networks:
      - backend

    restart: unless-stopped

# ==================== NETWORKS ====================
networks:
  backend:
    driver: bridge

  frontend:
    driver: bridge

  proxyhubb-dev:
    driver: bridge

# ==================== VOLUMES ====================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
