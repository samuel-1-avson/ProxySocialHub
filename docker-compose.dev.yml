# Development Docker Compose
# Runs only the control-api backend with Supabase (external database)
# Usage: docker-compose -f docker-compose.dev.yml up -d

version: '3.8'

services:
  # ==================== Control API (Backend) ====================
  control-api:
    build:
      context: ./services/control-api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - proxyhubb-dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s
    restart: unless-stopped

  # ==================== Edge Gateway (Rust Proxy) ====================
  edge-gateway:
    build:
      context: .
      dockerfile: services/edge-gateway/Dockerfile.standalone
    ports:
      - "3128:3128"   # HTTP proxy port
      - "8090:8090"   # Tunnel server for providers
    environment:
      - PROXY_PORT=3128
      - TUNNEL_PORT=8090
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=proxyhubb-dev-secret-change-in-production
      - CONTROL_API_URL=http://control-api:8080
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - proxyhubb-dev
    restart: unless-stopped


  # ==================== Redis ====================
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - proxyhubb-dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  redis_dev_data:

networks:
  proxyhubb-dev:
    driver: bridge
