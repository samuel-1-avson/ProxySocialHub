global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'control-api'
    static_configs:
      - targets: ['control-api:8080']
    metrics_path: /metrics

  - job_name: 'edge-gateway'
    static_configs:
      - targets: ['edge-gateway:9090']
    metrics_path: /metrics

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
