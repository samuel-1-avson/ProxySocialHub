# HAProxy Configuration for ProxySocialHub
# High-performance load balancer with SSL termination and health checks

global
    # Process and thread configuration
    nbproc 1
    nbthread 4
    cpu-map auto:1/1-4 0-3
    
    # SSL/TLS configuration
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-server-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-server-options ssl-min-ver TLSv1.2 no-tls-tickets
    
    # Certificate loading
    crt-base /etc/ssl/certs
    ca-base /etc/ssl/certs
    
    # Logging
    log stdout local0 info
    
    # Stats socket
    stats socket /var/run/haproxy.sock mode 600 level admin
    stats timeout 2m
    
    # Security
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    
    # Performance tuning
    tune.ssl.default-dh-param 2048
    tune.ssl.capture-cipherlist-size 1
    tune.ssl.capture-buffer-size 1
    tune.bufsize 32768
    tune.maxrewrite 8192

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option log-health-checks
    option redispatch
    
    # Timeouts
    timeout connect 10s
    timeout client 60s
    timeout server 60s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout check 5s
    
    # Error handling
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http
    
    # Health checks
    option httpchk GET /health
    http-check expect status 200
    
    # Load balancing
    balance roundrobin
    
    # Connection optimization
    option http-server-close
    option forwardfor
    option originalto

# Frontend for HTTPS traffic
frontend https_frontend
    bind *:443 ssl crt /etc/ssl/certs/proxyhubb.pem alpn h2,http/1.1
    bind *:80
    
    # Redirect HTTP to HTTPS
    redirect scheme https code 301 if !{ ssl_fc }
    
    # Security headers
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    http-response set-header X-Frame-Options "DENY"
    http-response set-header X-Content-Type-Options "nosniff"
    http-response set-header X-XSS-Protection "1; mode=block"
    http-response set-header Referrer-Policy "strict-origin-when-cross-origin"
    
    # Rate limiting
    stick-table type ip size 100k expire 30s store http_req_rate(10s),http_err_rate(10s),conn_rate(3s),sess_rate(3s)
    http-request track-sc0 src
    http-request deny if { sc_http_req_rate(0) gt 100 }
    http-request deny if { sc_conn_rate(0) gt 20 }
    
    # CORS handling
    http-response set-header Access-Control-Allow-Origin "https://proxyhubb.com" if { hdr(origin) -i https://proxyhubb.com }
    http-response set-header Access-Control-Allow-Origin "https://app.proxyhubb.com" if { hdr(origin) -i https://app.proxyhubb.com }
    http-response set-header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
    http-response set-header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    http-response set-header Access-Control-Max-Age "86400"
    
    # Route based on host header
    use_backend control_api if { hdr(host) -i api.proxyhubb.com }
    use_backend web_app if { hdr(host) -i app.proxyhubb.com }
    use_backend edge_gateway if { hdr(host) -i gateway.proxyhubb.com }
    use_backend monitoring if { hdr(host) -i monitoring.proxyhubb.com }
    
    default_backend control_api

# Backend for Control API
backend control_api
    option httpchk GET /health
    http-check expect status 200
    
    # Connection pooling
    http-reuse always
    
    # Health check configuration
    default-server check inter 10s rise 2 fall 3 maxconn 100
    
    # Load balancing with session affinity for authenticated requests
    balance roundrobin
    hash-type consistent
    
    # Servers (updated by service discovery)
    server api1 control-api-1:8080 check
    server api2 control-api-2:8080 check
    server api3 control-api-3:8080 check

# Backend for Web Application
backend web_app
    option httpchk GET /health
    http-check expect status 200
    
    # Static content optimization
    compression algo gzip
    compression type text/html text/plain text/css application/javascript application/json
    
    default-server check inter 10s rise 2 fall 3 maxconn 50
    
    server web1 web-1:3000 check
    server web2 web-2:3000 check
    server web3 web-3:3000 check

# Backend for Edge Gateway (Proxy Traffic)
backend edge_gateway
    mode http
    option httpchk GET /health
    http-check expect status 200
    
    # High-performance settings for proxy traffic
    balance leastconn
    
    # Connection optimization for proxy workloads
    default-server check inter 5s rise 2 fall 2 maxconn 1000
    
    server gateway1 edge-gateway-1:8443 check ssl verify none
    server gateway2 edge-gateway-2:8443 check ssl verify none
    server gateway3 edge-gateway-3:8443 check ssl verify none

# Backend for Monitoring Services
backend monitoring
    # Basic authentication for monitoring
    acl auth_ok http_auth(monitoring_users)
    http-request auth unless auth_ok
    
    # Route to different monitoring services
    use-server grafana if { path_beg /grafana }
    use-server prometheus if { path_beg /prometheus }
    use-server jaeger if { path_beg /jaeger }
    
    server grafana grafana:3000 check
    server prometheus prometheus:9090 check
    server jaeger jaeger-query:16686 check

# Statistics and monitoring
listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 30s
    stats admin if TRUE
    stats auth admin:proxyhubb_stats_2024
    
    # Prometheus metrics
    http-request use-service prometheus-exporter if { path /metrics }

# User list for monitoring authentication
userlist monitoring_users
    user admin password $6$rounds=10000$salt$hash

# Resolvers for service discovery
resolvers k8s
    nameserver dns1 kube-dns.kube-system.svc.cluster.local:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold other 30s
    hold refused 30s
    hold nx 30s
    hold timeout 30s
    hold valid 10s
    hold obsolete 30s