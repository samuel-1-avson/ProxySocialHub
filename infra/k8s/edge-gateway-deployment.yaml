# Edge Gateway Deployment with HPA support
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-gateway
  namespace: proxyhubb
  labels:
    app: edge-gateway
    version: v1
spec:
  replicas: 3  # Initial replicas, HPA will manage this
  selector:
    matchLabels:
      app: edge-gateway
  template:
    metadata:
      labels:
        app: edge-gateway
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      priorityClassName: high-priority
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - edge-gateway
              topologyKey: kubernetes.io/hostname
      containers:
      - name: edge-gateway
        image: proxyhubb/edge-gateway:latest
        ports:
        - containerPort: 8443
          name: https
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        env:
        - name: RUST_LOG
          value: "info"
        - name: REDIS_URL
          value: "redis://redis-cluster:6379"
        - name: CONTROL_API_URL
          value: "http://control-api:8080"
        - name: TLS_CERT_PATH
          value: "/app/certs/server.crt"
        - name: TLS_KEY_PATH
          value: "/app/certs/server.key"
        volumeMounts:
        - name: tls-certs
          mountPath: /app/certs
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 9090
            scheme: HTTP
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 9090
            scheme: HTTP
          initialDelaySeconds: 5
          timeoutSeconds: 1
          periodSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 9090
            scheme: HTTP
          initialDelaySeconds: 10
          timeoutSeconds: 1
          periodSeconds: 2
          successThreshold: 1
          failureThreshold: 30
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      volumes:
      - name: tls-certs
        secret:
          secretName: tls-certs
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: edge-gateway
  namespace: proxyhubb
  labels:
    app: edge-gateway
spec:
  type: LoadBalancer
  ports:
  - port: 8443
    targetPort: 8443
    protocol: TCP
    name: https
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: metrics
  selector:
    app: edge-gateway

---
# ServiceMonitor for Prometheus scraping
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: edge-gateway
  namespace: proxyhubb
  labels:
    app: edge-gateway
spec:
  selector:
    matchLabels:
      app: edge-gateway
  endpoints:
  - port: metrics
    interval: 15s  # More frequent scraping for edge gateway
    path: /metrics