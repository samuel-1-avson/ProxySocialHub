# Edge Gateway Deployment with HPA support
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-gateway
  namespace: proxyhubb
  labels:
    app: edge-gateway
    version: v1
spec:
  replicas: 3  # Initial replicas, HPA will manage this
  selector:
    matchLabels:
      app: edge-gateway
  template:
    metadata:
      labels:
        app: edge-gateway
        version: v1
      annotations:
        linkerd.io/inject: enabled
        prometheus.io/scrape: "true"
        # Prometheus scrapes METRICS_PORT (9090); buyer :8090 does not expose /metrics.
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      priorityClassName: high-priority
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - edge-gateway
              topologyKey: kubernetes.io/hostname
      containers:
      - name: edge-gateway
        image: proxyhubb/edge-gateway:latest
        ports:
        # Buyer proxy API + /health + /ready (HTTP CONNECT/WS). No /metrics on this port.
        - containerPort: 8090
          name: http
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        # Provider-node yamux tunnel (TLS-capable via mounted certs).
        - containerPort: 3128
          name: tunnel
          protocol: TCP
        env:
        - name: RUST_LOG
          value: "info"
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8090"
        - name: METRICS_PORT
          value: "9090"
        - name: TUNNEL_PORT
          value: "3128"
        - name: REDIS_URL
          value: "redis://redis-cluster:6379"
        - name: CONTROL_API_URL
          value: "http://control-api:8080"
        # TLS certs are used by the provider tunnel listener. Buyer-port TLS is
        # terminated at the LB today (in-process buyer TLS is a vNext/P5 item).
        - name: TLS_CERT_PATH
          value: "/app/certs/server.crt"
        - name: TLS_KEY_PATH
          value: "/app/certs/server.key"
        # Required secrets — the gateway panics on startup if these are unset.
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: edge-gateway-secrets
              key: jwt-secret
        - name: GATEWAY_SHARED_SECRET
          valueFrom:
            secretKeyRef:
              name: edge-gateway-secrets
              key: gateway-shared-secret
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: edge-gateway-secrets
              key: session-secret
        - name: PROVIDER_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: edge-gateway-secrets
              key: provider-private-key
        volumeMounts:
        - name: tls-certs
          mountPath: /app/certs
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8090
            scheme: HTTP
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8090
            scheme: HTTP
          initialDelaySeconds: 5
          timeoutSeconds: 2
          periodSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8090
            scheme: HTTP
          initialDelaySeconds: 10
          timeoutSeconds: 1
          periodSeconds: 2
          successThreshold: 1
          failureThreshold: 30
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      volumes:
      - name: tls-certs
        secret:
          secretName: tls-certs
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: edge-gateway
  namespace: proxyhubb
  labels:
    app: edge-gateway
spec:
  type: LoadBalancer
  ports:
  # Buyer proxy API + health/ready.
  - port: 8090
    targetPort: 8090
    protocol: TCP
    name: http
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: metrics
  # Provider-node tunnel.
  - port: 3128
    targetPort: 3128
    protocol: TCP
    name: tunnel
  selector:
    app: edge-gateway

---
# ServiceMonitor for Prometheus scraping (dedicated metrics port)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: edge-gateway
  namespace: proxyhubb
  labels:
    app: edge-gateway
spec:
  selector:
    matchLabels:
      app: edge-gateway
  endpoints:
  - port: metrics
    interval: 15s  # More frequent scraping for edge gateway
    path: /metrics