# HAProxy Load Balancer Deployment
# Alternative to NGINX Ingress for high-performance load balancing
#
# SEC-06: stats auth from Secret haproxy-stats-auth; no public 8404 on LoadBalancer.
# Create before apply:
#   kubectl -n proxyhubb create secret generic haproxy-stats-auth \
#     --from-literal=username=monitor \
#     --from-literal=password="$(openssl rand -hex 24)"
# Compose testnet path is unchanged (see infra/k8s/README.md).

apiVersion: v1
kind: ConfigMap
metadata:
  name: haproxy-config
  namespace: proxyhubb
data:
  haproxy.cfg.template: |
    global
        nbproc 1
        nbthread 4
        
        ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
        ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
        
        log stdout local0 info
        stats socket /var/run/haproxy.sock mode 600 level admin
        
        tune.ssl.default-dh-param 2048
        tune.bufsize 32768
        tune.maxrewrite 8192

    defaults
        mode http
        log global
        option httplog
        option dontlognull
        option redispatch
        
        timeout connect 10s
        timeout client 60s
        timeout server 60s
        timeout http-request 10s
        timeout http-keep-alive 10s
        timeout check 5s
        
        option httpchk GET /health
        http-check expect status 200
        balance roundrobin
        option http-server-close
        option forwardfor

    frontend https_frontend
        bind *:443 ssl crt /etc/ssl/certs/tls.pem alpn h2,http/1.1
        bind *:80
        
        redirect scheme https code 301 if !{ ssl_fc }
        
        http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
        http-response set-header X-Frame-Options "DENY"
        http-response set-header X-Content-Type-Options "nosniff"
        http-response set-header X-XSS-Protection "1; mode=block"
        
        stick-table type ip size 100k expire 30s store http_req_rate(10s)
        http-request track-sc0 src
        http-request deny if { sc_http_req_rate(0) gt 100 }
        
        use_backend control_api if { hdr(host) -i api.proxyhubb.com }
        use_backend web_app if { hdr(host) -i app.proxyhubb.com }
        use_backend edge_gateway if { hdr(host) -i gateway.proxyhubb.com }
        
        default_backend control_api

    backend control_api
        option httpchk GET /health
        http-check expect status 200
        http-reuse always
        default-server check inter 10s rise 2 fall 3 maxconn 100
        
        server-template api 10 control-api:8080 check resolvers k8s init-addr none

    backend web_app
        option httpchk GET /health
        http-check expect status 200
        compression algo gzip
        compression type text/html text/plain text/css application/javascript application/json
        default-server check inter 10s rise 2 fall 3 maxconn 50
        
        server-template web 10 web:3000 check resolvers k8s init-addr none

    backend edge_gateway
        option httpchk GET /health
        http-check expect status 200
        balance leastconn
        default-server check inter 5s rise 2 fall 2 maxconn 1000
        
        server-template gateway 10 edge-gateway:8443 check ssl verify none resolvers k8s init-addr none

    # Internal scrape only (ClusterIP Service haproxy-stats). Auth required for /stats.
    listen stats
        bind *:8404
        stats enable
        stats uri /stats
        stats refresh 30s
        stats auth __STATS_USER__:__STATS_PASS__
        stats admin if FALSE
        http-request return status 200 content-type "text/plain" string "ok\n" if { path /health }
        http-request use-service prometheus-exporter if { path /metrics }

    resolvers k8s
        nameserver dns1 kube-dns.kube-system.svc.cluster.local:53
        resolve_retries 3
        timeout resolve 1s
        timeout retry 1s
        hold valid 10s

  entrypoint.sh: |
    #!/bin/sh
    set -eu
    if [ -z "${HAPROXY_STATS_USER:-}" ] || [ -z "${HAPROXY_STATS_PASSWORD:-}" ]; then
      echo "HAPROXY_STATS_USER/PASSWORD required (Secret haproxy-stats-auth)" >&2
      exit 1
    fi
    # Escape sed delimiters in password
    USER_ESC=$(printf '%s' "$HAPROXY_STATS_USER" | sed 's/[&|]/\\&/g')
    PASS_ESC=$(printf '%s' "$HAPROXY_STATS_PASSWORD" | sed 's/[&|]/\\&/g')
    sed -e "s|__STATS_USER__|${USER_ESC}|g" \
        -e "s|__STATS_PASS__|${PASS_ESC}|g" \
        /config/haproxy.cfg.template > /usr/local/etc/haproxy/haproxy.cfg
    exec haproxy -f /usr/local/etc/haproxy/haproxy.cfg

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: haproxy
  namespace: proxyhubb
  labels:
    app: haproxy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: haproxy
  template:
    metadata:
      labels:
        app: haproxy
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8404"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - haproxy
              topologyKey: kubernetes.io/hostname
      containers:
      - name: haproxy
        image: haproxy:2.8-alpine
        command: ["/bin/sh", "/config/entrypoint.sh"]
        ports:
        - containerPort: 80
          name: http
        - containerPort: 443
          name: https
        - containerPort: 8404
          name: stats
        env:
        - name: HAPROXY_STATS_USER
          valueFrom:
            secretKeyRef:
              name: haproxy-stats-auth
              key: username
              optional: false
        - name: HAPROXY_STATS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: haproxy-stats-auth
              key: password
              optional: false
        volumeMounts:
        - name: haproxy-config
          mountPath: /config
          readOnly: true
        - name: tls-certs
          mountPath: /etc/ssl/certs
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8404
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8404
          initialDelaySeconds: 5
          timeoutSeconds: 1
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
      volumes:
      - name: haproxy-config
        configMap:
          name: haproxy-config
          defaultMode: 0755
      - name: tls-certs
        secret:
          secretName: proxyhubb-tls
          items:
          - key: tls.crt
            path: tls.pem
            mode: 0644
          - key: tls.key
            path: tls.pem
            mode: 0600

---
apiVersion: v1
kind: Service
metadata:
  name: haproxy
  namespace: proxyhubb
  labels:
    app: haproxy
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  - port: 443
    targetPort: 443
    protocol: TCP
    name: https
  selector:
    app: haproxy

---
# Internal-only stats/metrics (SEC-06: not on public LoadBalancer)
apiVersion: v1
kind: Service
metadata:
  name: haproxy-stats
  namespace: proxyhubb
  labels:
    app: haproxy
spec:
  type: ClusterIP
  ports:
  - port: 8404
    targetPort: 8404
    protocol: TCP
    name: stats
  selector:
    app: haproxy

---
# HPA for HAProxy
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: haproxy-hpa
  namespace: proxyhubb
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: haproxy
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60

---
# ServiceMonitor for HAProxy metrics (scrapes ClusterIP haproxy-stats)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: haproxy
  namespace: proxyhubb
  labels:
    app: haproxy
spec:
  selector:
    matchLabels:
      app: haproxy
  endpoints:
  - port: stats
    interval: 30s
    path: /metrics

---
# PodDisruptionBudget for HAProxy
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: haproxy-pdb
  namespace: proxyhubb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: haproxy
