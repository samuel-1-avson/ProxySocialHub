# PgBouncer Connection Pooler for PostgreSQL
# Provides connection pooling and load balancing

apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: proxyhubb
data:
  pgbouncer.ini: |
    [databases]
    proxyhubb_primary = host=postgres-primary.proxyhubb.svc.cluster.local port=5432 dbname=proxyhubb
    proxyhubb_replica = host=postgres-replica.proxyhubb.svc.cluster.local port=5432 dbname=proxyhubb
    
    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 5432
    auth_type = md5
    auth_file = /etc/pgbouncer/userlist.txt
    
    # Connection pooling settings
    pool_mode = transaction
    max_client_conn = 200
    default_pool_size = 20
    min_pool_size = 5
    reserve_pool_size = 5
    reserve_pool_timeout = 5
    
    # Timeouts
    server_connect_timeout = 15
    server_login_retry = 15
    query_timeout = 0
    query_wait_timeout = 120
    client_idle_timeout = 0
    client_login_timeout = 60
    autodb_idle_timeout = 3600
    
    # Logging
    log_connections = 1
    log_disconnections = 1
    log_pooler_errors = 1
    
    # Admin
    admin_users = postgres
    stats_users = postgres
    
  userlist.txt: |
    "postgres" "md5d41d8cd98f00b204e9800998ecf8427e"

---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer-primary
  namespace: proxyhubb
  labels:
    app: pgbouncer
    role: primary
spec:
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
  selector:
    app: pgbouncer
    role: primary

---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer-replica
  namespace: proxyhubb
  labels:
    app: pgbouncer
    role: replica
spec:
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
  selector:
    app: pgbouncer
    role: replica

---
# PgBouncer for Primary (Write operations)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer-primary
  namespace: proxyhubb
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pgbouncer
      role: primary
  template:
    metadata:
      labels:
        app: pgbouncer
        role: primary
    spec:
      containers:
      - name: pgbouncer
        image: pgbouncer/pgbouncer:1.21.0
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: DATABASES_HOST
          value: postgres-primary.proxyhubb.svc.cluster.local
        - name: DATABASES_PORT
          value: "5432"
        - name: DATABASES_USER
          value: postgres
        - name: DATABASES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: postgres-password
        - name: DATABASES_DBNAME
          value: proxyhubb
        - name: POOL_MODE
          value: transaction
        - name: MAX_CLIENT_CONN
          value: "200"
        - name: DEFAULT_POOL_SIZE
          value: "20"
        volumeMounts:
        - name: pgbouncer-config
          mountPath: /etc/pgbouncer/pgbouncer.ini
          subPath: pgbouncer.ini
        - name: pgbouncer-config
          mountPath: /etc/pgbouncer/userlist.txt
          subPath: userlist.txt
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 5
          timeoutSeconds: 1
          periodSeconds: 5
      volumes:
      - name: pgbouncer-config
        configMap:
          name: pgbouncer-config

---
# PgBouncer for Replica (Read operations)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer-replica
  namespace: proxyhubb
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pgbouncer
      role: replica
  template:
    metadata:
      labels:
        app: pgbouncer
        role: replica
    spec:
      containers:
      - name: pgbouncer
        image: pgbouncer/pgbouncer:1.21.0
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: DATABASES_HOST
          value: postgres-replica.proxyhubb.svc.cluster.local
        - name: DATABASES_PORT
          value: "5432"
        - name: DATABASES_USER
          value: postgres
        - name: DATABASES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: postgres-password
        - name: DATABASES_DBNAME
          value: proxyhubb
        - name: POOL_MODE
          value: transaction
        - name: MAX_CLIENT_CONN
          value: "200"
        - name: DEFAULT_POOL_SIZE
          value: "15"
        volumeMounts:
        - name: pgbouncer-config
          mountPath: /etc/pgbouncer/pgbouncer.ini
          subPath: pgbouncer.ini
        - name: pgbouncer-config
          mountPath: /etc/pgbouncer/userlist.txt
          subPath: userlist.txt
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 5
          timeoutSeconds: 1
          periodSeconds: 5
      volumes:
      - name: pgbouncer-config
        configMap:
          name: pgbouncer-config

---
# PodDisruptionBudget for PgBouncer
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pgbouncer-pdb
  namespace: proxyhubb
spec:
  minAvailable: 2  # Ensure at least 2 PgBouncer instances are available
  selector:
    matchLabels:
      app: pgbouncer