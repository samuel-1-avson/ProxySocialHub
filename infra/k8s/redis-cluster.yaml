# Redis Cluster Configuration for High Availability
# 6-node cluster: 3 masters + 3 replicas with automatic failover
#
# SEC-05: auth via Secret redis-cluster-auth (key: password). Never commit real passwords.
# Create before apply:
#   kubectl -n proxyhubb create secret generic redis-cluster-auth \
#     --from-literal=password="$(openssl rand -hex 32)"

apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-cluster-config
  namespace: proxyhubb
data:
  # Template: entrypoint replaces __REDIS_PASSWORD__ from REDIS_PASSWORD env (Secret).
  # Do not put shell ${…} literals here — redis-server will not expand them.
  redis.conf.template: |
    cluster-enabled yes
    cluster-config-file nodes.conf
    cluster-node-timeout 5000
    cluster-announce-ip __POD_IP__
    cluster-announce-port 6379
    cluster-announce-bus-port 16379

    appendonly yes
    appendfsync everysec
    save 900 1
    save 300 10
    save 60 10000

    maxmemory 512mb
    maxmemory-policy allkeys-lru
    tcp-keepalive 60
    timeout 0

    protected-mode yes
    bind 0.0.0.0
    requirepass __REDIS_PASSWORD__
    masterauth __REDIS_PASSWORD__

    loglevel notice
    logfile ""

  entrypoint.sh: |
    #!/bin/sh
    set -eu
    if [ -z "${REDIS_PASSWORD:-}" ]; then
      echo "REDIS_PASSWORD is required (Secret redis-cluster-auth)" >&2
      exit 1
    fi
    POD_IP="${POD_IP:-0.0.0.0}"
    sed -e "s|__REDIS_PASSWORD__|${REDIS_PASSWORD}|g" \
        -e "s|__POD_IP__|${POD_IP}|g" \
        /config/redis.conf.template > /data/redis.conf
    exec redis-server /data/redis.conf

---
apiVersion: v1
kind: Service
metadata:
  name: redis-cluster
  namespace: proxyhubb
  labels:
    app: redis-cluster
spec:
  ports:
  - port: 6379
    targetPort: 6379
    name: client
  - port: 16379
    targetPort: 16379
    name: gossip
  clusterIP: None
  selector:
    app: redis-cluster

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-cluster
  namespace: proxyhubb
spec:
  serviceName: redis-cluster
  replicas: 6
  selector:
    matchLabels:
      app: redis-cluster
  template:
    metadata:
      labels:
        app: redis-cluster
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: client
        - containerPort: 16379
          name: gossip
        command: ["/bin/sh", "/config/entrypoint.sh"]
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-cluster-auth
              key: password
              optional: false
        volumeMounts:
        - name: conf
          mountPath: /config
          readOnly: true
        - name: data
          mountPath: /data
          readOnly: false
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG
          initialDelaySeconds: 5
          timeoutSeconds: 1
          periodSeconds: 5
          successThreshold: 1
          failureThreshold: 3
      volumes:
      - name: conf
        configMap:
          name: redis-cluster-config
          defaultMode: 0755
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi

---
# Redis Cluster Initialization Job
apiVersion: batch/v1
kind: Job
metadata:
  name: redis-cluster-init
  namespace: proxyhubb
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: redis-cluster-init
        image: redis:7-alpine
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-cluster-auth
              key: password
              optional: false
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          echo "Waiting for Redis pods to be ready..."
          for i in $(seq 0 5); do
            until redis-cli -a "$REDIS_PASSWORD" -h redis-cluster-${i}.redis-cluster.proxyhubb.svc.cluster.local ping | grep -q PONG; do
              echo "Waiting for redis-cluster-${i}..."
              sleep 2
            done
          done

          echo "Creating Redis cluster..."
          redis-cli -a "$REDIS_PASSWORD" --cluster create \
            redis-cluster-0.redis-cluster.proxyhubb.svc.cluster.local:6379 \
            redis-cluster-1.redis-cluster.proxyhubb.svc.cluster.local:6379 \
            redis-cluster-2.redis-cluster.proxyhubb.svc.cluster.local:6379 \
            redis-cluster-3.redis-cluster.proxyhubb.svc.cluster.local:6379 \
            redis-cluster-4.redis-cluster.proxyhubb.svc.cluster.local:6379 \
            redis-cluster-5.redis-cluster.proxyhubb.svc.cluster.local:6379 \
            --cluster-replicas 1 \
            --cluster-yes

          echo "Redis cluster initialized successfully!"

---
# PodDisruptionBudget for Redis Cluster
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-cluster-pdb
  namespace: proxyhubb
spec:
  minAvailable: 4  # Ensure at least 4 nodes are available during updates
  selector:
    matchLabels:
      app: redis-cluster

---
# NetworkPolicy for Redis Cluster
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-cluster-netpol
  namespace: proxyhubb
spec:
  podSelector:
    matchLabels:
      app: redis-cluster
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: control-api
    - podSelector:
        matchLabels:
          app: edge-gateway
    ports:
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 16379
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: redis-cluster
    ports:
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 16379
  - to: []  # Allow DNS resolution
    ports:
    - protocol: UDP
      port: 53
