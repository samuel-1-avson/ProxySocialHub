# PostgreSQL Replica Configuration
# Optimized for read operations and streaming replication

# Connection settings
listen_addresses = '*'
port = 5432
max_connections = 200

# Memory settings (slightly reduced for replica)
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 4MB
maintenance_work_mem = 64MB

# WAL settings for replica
wal_level = replica
max_wal_senders = 2
wal_keep_size = 1GB

# Hot standby settings
hot_standby = on
hot_standby_feedback = on
max_standby_archive_delay = 30s
max_standby_streaming_delay = 30s

# Checkpoint settings
checkpoint_completion_target = 0.9
wal_buffers = 16MB

# Logging
log_destination = 'stderr'
logging_collector = off
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_statement = 'all'
log_min_duration_statement = 1000
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# Performance (optimized for reads)
random_page_cost = 1.1
effective_io_concurrency = 200
seq_page_cost = 1.0

# Autovacuum (reduced activity on replica)
autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = 2min

# Recovery settings (for streaming replication)
primary_conninfo = 'host=postgres-primary port=5432 user=replicator password=replicator_pass'
primary_slot_name = 'replica_slot'
promote_trigger_file = '/tmp/promote_replica'