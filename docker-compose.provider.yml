# Optional provider-node + QUIC provider tunnel (gateway UDP listener + provider QUIC dialer).
#
# Bootstrap credentials first:
#   .\scripts\bootstrap-provider-docker.ps1
#
# Start full dev stack (always use BOTH compose files):
#   .\scripts\compose-up-dev.ps1
#   # or:
#   docker compose -f docker-compose.yml -f docker-compose.provider.yml --profile provider up -d
#
# Verify QUIC E2E:
#   .\scripts\quic-provider-e2e-docker.ps1 -SkipHeal
#   .\scripts\verify-provider-proofs-docker.ps1

services:
  edge-gateway:
    build:
      args:
        ENABLE_QUIC: "1"
    ports:
      - "3128:3128/udp"
    environment:
      - PROVIDER_TRANSPORT=quic

  provider-node:
    profiles: ["provider"]
    build:
      context: ./services/provider-node
      dockerfile: Dockerfile
      args:
        ENABLE_QUIC: "1"
    container_name: proxyhubb-provider-node
    env_file:
      - config/docker/provider.compose.env
    volumes:
      - ./config/docker/provider.toml:/config/provider.toml:ro
    environment:
      - PROXYHUB_API_URL=http://control-api:8080
      - PROXYHUB_GATEWAY_ADDR=edge-gateway:3128
      - PROVIDER_TRANSPORT=quic
      - YAMUX_CONNS_PER_NODE=${YAMUX_CONNS_PER_NODE:-1}
      - RUST_LOG=${PROVIDER_NODE_LOG:-info}
    command: ["start", "--config", "/config/provider.toml", "--use-tls"]
    depends_on:
      control-api:
        condition: service_healthy
      edge-gateway:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
