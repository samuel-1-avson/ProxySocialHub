name: SDK Publish

on:
  push:
    tags:
      - "sdk-v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - npm
          - pypi

permissions:
  contents: read

jobs:
  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test Node SDK
        working-directory: sdks/nodejs
        run: npm test

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        working-directory: sdks/python
        run: |
          python -m pip install -e ".[dev]" 2>/dev/null || python -m pip install -e .
          python -c "from proxyhubb import ProxyHubClient; c=ProxyHubClient('phub_x'); assert c._base_url=='https://api.proxyhubb.com'"

  publish-npm:
    needs: [test-js]
    if: >
      startsWith(github.ref, 'refs/tags/sdk-v') ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'both' || inputs.target == 'npm'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          scope: "@proxyhubb"
      - name: Publish @proxyhubb/sdk
        working-directory: sdks/nodejs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  publish-pypi:
    needs: [test-python]
    if: >
      startsWith(github.ref, 'refs/tags/sdk-v') ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'both' || inputs.target == 'pypi'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        working-directory: sdks/python
        run: |
          python -m pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist/
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
