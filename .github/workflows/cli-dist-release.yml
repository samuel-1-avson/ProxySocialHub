name: Provider CLI Release

# Builds provider-node + provider-cli for all OS targets and publishes a
# GitHub Release with the binaries attached (tag: provider-vX.Y.Z).

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without leading v (e.g. 1.0.1)
        required: false
        default: '1.0.0'
      prerelease:
        description: Mark GitHub Release as prerelease
        required: false
        type: boolean
        default: false
      dry_run:
        description: Build and sign, but do not publish a release (packaged files are kept as a workflow artifact)
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'provider-v*'

permissions:
  contents: write

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.out.outputs.version }}
      tag: ${{ steps.out.outputs.tag }}
      prerelease: ${{ steps.out.outputs.prerelease }}
    steps:
      - id: out
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == provider-v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#provider-v}"
            PRERELEASE=false
          else
            VERSION="${{ github.event.inputs.version || '1.0.0' }}"
            TAG="provider-v${VERSION}"
            PRERELEASE="${{ github.event.inputs.prerelease || false }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${VERSION} tag=${TAG} prerelease=${PRERELEASE}"

  linux:
    name: Build CLI (linux)
    needs: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLI_DIST_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./services/provider-node -> target
            ./cli -> target"
      - name: Build linux amd64
        run: |
          chmod +x scripts/build-cli-dist.sh
          ./scripts/build-cli-dist.sh
          ls -la "cli-dist/${CLI_DIST_VERSION}"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-dist-linux
          path: cli-dist/${{ env.CLI_DIST_VERSION }}/
          if-no-files-found: error

  windows:
    name: Build CLI (windows/amd64)
    needs: resolve-version
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CLI_DIST_VERSION: ${{ needs.resolve-version.outputs.version }}
      # `secrets` cannot be read in a step `if:`, so fold the signing inputs into one flag.
      # Azure Artifact Signing (a Public Trust certificate profile): credentials are
      # secrets, the account/endpoint/profile names are plain repository variables.
      WINDOWS_SIGNING_CONFIGURED: ${{ secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' && vars.ARTIFACT_SIGNING_ENDPOINT != '' && vars.ARTIFACT_SIGNING_ACCOUNT != '' && vars.ARTIFACT_SIGNING_PROFILE != '' }}
      REQUIRE_CODE_SIGNING: ${{ vars.REQUIRE_CODE_SIGNING }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./services/provider-node -> target
            ./cli -> target"
      - name: Build
        shell: pwsh
        run: |
          .\rebuild-cli.ps1
          $node = "cli-dist\${env:CLI_DIST_VERSION}\provider-node-${env:CLI_DIST_VERSION}-windows-amd64.exe"
          if (-not (Test-Path $node)) { throw "Missing $node" }
          if (-not (Test-Path "cli-dist\${env:CLI_DIST_VERSION}\Launch-Provider-Console.cmd")) {
            throw "Missing Launch-Provider-Console.cmd"
          }

      - name: Warn that Windows binaries are unsigned
        if: ${{ env.WINDOWS_SIGNING_CONFIGURED != 'true' }}
        shell: bash
        run: |
          if [[ "${REQUIRE_CODE_SIGNING}" == "true" ]]; then
            echo "::error::REQUIRE_CODE_SIGNING is true but Windows signing is not configured (secrets AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET; variables ARTIFACT_SIGNING_ENDPOINT, ARTIFACT_SIGNING_ACCOUNT, ARTIFACT_SIGNING_PROFILE)"
            exit 1
          fi
          echo "::warning::Windows binaries are NOT code-signed - users will see a SmartScreen warning. Configure the Azure Artifact Signing secrets/variables to sign them."

      # Sign before upload so SHA256SUMS and the checksum the in-app updater verifies
      # both describe the signed files.
      - name: Sign Windows binaries
        if: ${{ env.WINDOWS_SIGNING_CONFIGURED == 'true' }}
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\cli-dist\${{ env.CLI_DIST_VERSION }}
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Windows signatures
        if: ${{ env.WINDOWS_SIGNING_CONFIGURED == 'true' }}
        shell: pwsh
        run: |
          $exes = Get-ChildItem "cli-dist\$env:CLI_DIST_VERSION" -Filter *.exe
          if (-not $exes) { throw "No .exe files to verify" }
          $bad = @()
          foreach ($exe in $exes) {
            $sig = Get-AuthenticodeSignature $exe.FullName
            Write-Host "$($exe.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { $bad += $exe.Name }
          }
          if ($bad) { throw "Not validly signed: $($bad -join ', ')" }

      - uses: actions/upload-artifact@v4
        with:
          name: cli-dist-windows
          path: cli-dist/${{ env.CLI_DIST_VERSION }}/
          if-no-files-found: error

  macos:
    name: Build CLI (macos)
    needs: resolve-version
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CLI_DIST_VERSION: ${{ needs.resolve-version.outputs.version }}
      # See the windows job: one flag, because `secrets` cannot be read in a step `if:`.
      # Developer ID Application certificate (.p12, base64) + notarization via an Apple
      # ID app-specific password.
      MACOS_SIGNING_CONFIGURED: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      REQUIRE_CODE_SIGNING: ${{ vars.REQUIRE_CODE_SIGNING }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./services/provider-node -> target
            ./cli -> target"
      - name: Build macos amd64 + arm64
        run: |
          VERSION="${CLI_DIST_VERSION}"
          DIST_DIR="cli-dist/${VERSION}"
          mkdir -p "$DIST_DIR"
          build_one() {
            local crate_dir="$1" bin_name="$2" target="$3" out_name="$4"
            echo "Building $out_name ($target)..."
            (cd "$crate_dir" && cargo build --release --target "$target")
            cp -f "$crate_dir/target/$target/release/$bin_name" "$DIST_DIR/$out_name"
            chmod +x "$DIST_DIR/$out_name"
          }
          build_one services/provider-node provider-node x86_64-apple-darwin "provider-node-${VERSION}-macos-amd64"
          build_one cli proxyhubb-cli x86_64-apple-darwin "provider-cli-${VERSION}-macos-amd64"
          build_one services/provider-node provider-node aarch64-apple-darwin "provider-node-${VERSION}-macos-arm64"
          build_one cli proxyhubb-cli aarch64-apple-darwin "provider-cli-${VERSION}-macos-arm64"
          ls -la "$DIST_DIR"

      - name: Warn that macOS binaries are unsigned
        if: ${{ env.MACOS_SIGNING_CONFIGURED != 'true' }}
        run: |
          if [[ "${REQUIRE_CODE_SIGNING}" == "true" ]]; then
            echo "::error::REQUIRE_CODE_SIGNING is true but macOS signing is not configured (secrets APPLE_CERTIFICATE_P12, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID)"
            exit 1
          fi
          echo "::warning::macOS binaries are NOT signed or notarized - Gatekeeper will block them for users who download them in a browser."

      # Sign before upload so SHA256SUMS and the in-app updater checksum describe the
      # signed files. Bare executables cannot be stapled, so Gatekeeper checks the
      # notarization ticket online the first time a downloaded file is opened.
      - name: Sign and notarize macOS binaries
        if: ${{ env.MACOS_SIGNING_CONFIGURED == 'true' }}
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          DIST_DIR="cli-dist/${CLI_DIST_VERSION}"
          KEYCHAIN="${RUNNER_TEMP}/proxyhubb-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT="${RUNNER_TEMP}/signing-cert.p12"
          ZIP="${RUNNER_TEMP}/notarize.zip"
          cleanup() {
            security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true
            rm -f "$CERT" "$ZIP"
          }
          trap cleanup EXIT

          # Throwaway keychain that only lives for this job.
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Keep the existing search list; codesign finds the identity through it.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          shopt -s nullglob
          BINARIES=("$DIST_DIR"/provider-node-*-macos-* "$DIST_DIR"/provider-cli-*-macos-*)
          if [[ ${#BINARIES[@]} -ne 4 ]]; then
            echo "::error::expected 4 macOS binaries to sign, found ${#BINARIES[@]}"
            exit 1
          fi
          for bin in "${BINARIES[@]}"; do
            codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$bin"
            codesign --verify --strict --verbose=2 "$bin"
          done

          # Notarize all four in one submission.
          xcrun notarytool store-credentials proxyhubb-notary \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --keychain "$KEYCHAIN"
          (cd "$DIST_DIR" && zip -j "$ZIP" "${BINARIES[@]##*/}")
          RESULT="$(xcrun notarytool submit "$ZIP" --keychain-profile proxyhubb-notary --keychain "$KEYCHAIN" \
            --wait --timeout 30m --output-format json)"
          echo "$RESULT"
          STATUS="$(printf '%s' "$RESULT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
          if [[ "$STATUS" != "Accepted" ]]; then
            ID="$(printf '%s' "$RESULT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
            xcrun notarytool log "$ID" --keychain-profile proxyhubb-notary --keychain "$KEYCHAIN" || true
            echo "::error::notarization finished with status '$STATUS'"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cli-dist-macos
          path: cli-dist/${{ env.CLI_DIST_VERSION }}/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [resolve-version, linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: cli-dist-*
          merge-multiple: true

      - name: Package zips + checksums
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p packaged
          ls -la release-assets || true
          # Flatten any nested dirs from merge-multiple
          find release-assets -type f -maxdepth 3 -print
          shopt -s nullglob
          mapfile -t FILES < <(find release-assets -type f -maxdepth 3)
          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "No release assets found" >&2
            exit 1
          fi
          # Copy binaries to a flat staging dir
          STAGE="staged-${VERSION}"
          mkdir -p "$STAGE"
          for f in "${FILES[@]}"; do
            cp -f "$f" "$STAGE/$(basename "$f")"
          done
          cd "$STAGE"
          # Per-platform zip bundles for easier download from the Releases page
          zip -j "../packaged/provider-node-${VERSION}-windows-amd64.zip" \
            provider-node-${VERSION}-windows-amd64.exe \
            provider-cli-${VERSION}-windows-amd64.exe \
            Launch-Provider-Console.cmd 2>/dev/null || \
          zip -j "../packaged/provider-node-${VERSION}-windows-amd64.zip" \
            provider-node-${VERSION}-windows-amd64.exe \
            Launch-Provider-Console.cmd
          zip -j "../packaged/provider-node-${VERSION}-linux-amd64.zip" \
            provider-node-${VERSION}-linux-amd64 \
            provider-cli-${VERSION}-linux-amd64
          if [[ -f provider-node-${VERSION}-linux-arm64 ]]; then
            zip -j "../packaged/provider-node-${VERSION}-linux-arm64.zip" \
              provider-node-${VERSION}-linux-arm64 \
              provider-cli-${VERSION}-linux-arm64
          fi
          zip -j "../packaged/provider-node-${VERSION}-macos-amd64.zip" \
            provider-node-${VERSION}-macos-amd64 \
            provider-cli-${VERSION}-macos-amd64
          zip -j "../packaged/provider-node-${VERSION}-macos-arm64.zip" \
            provider-node-${VERSION}-macos-arm64 \
            provider-cli-${VERSION}-macos-arm64
          # Also attach raw binaries
          cp -f provider-node-* ../packaged/ 2>/dev/null || true
          cp -f provider-cli-* ../packaged/ 2>/dev/null || true
          cp -f Launch-Provider-Console.cmd ../packaged/ 2>/dev/null || true
          cd ../packaged
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Keep packaged files (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: cli-dist-packaged-dry-run
          path: packaged/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: Provider Node CLI v${{ needs.resolve-version.outputs.version }}
          prerelease: ${{ needs.resolve-version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            ## Provider Node CLI v${{ needs.resolve-version.outputs.version }}

            Download the zip for your OS, then:

            ### Windows
            1. Unzip the archive
            2. Double-click **`Launch-Provider-Console.cmd`** (or run `provider-node-*-windows-amd64.exe`)
            3. A console window opens with an interactive menu (dashboard, doctor, start, update, …)
            4. Get `provider.toml` from Dashboard → My nodes → Connect / Setup wizard

            ### Already installed?
            ```
            provider-node update
            ```
            Replaces the binary in place — no need to delete the old download first.

            ### Linux / macOS
            ```bash
            chmod +x provider-node-*
            ./provider-node-*            # interactive console
            # or:
            ./provider-node-* dashboard --config provider.toml
            ./provider-node-* update     # in-place upgrade
            ```

            Binaries are also mirrored for in-app download via `/v1/cli/download` after publishing to `cli-dist/`.
          files: |
            packaged/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
