# ProxyHubb deploy — GHCR build/push only.
#
# Canonical live path is GCP Phase A Compose on the GCE VM, NOT EKS/kustomize:
#   IMAGE_TAG=<tag> ./scripts/gcp-compose-pull-deploy.sh
# See docs/GCP_TESTNET_PHASE_A.md and infra/k8s/README.md.
#
# This workflow intentionally does NOT kubectl-apply. The previous EKS jobs
# targeted missing infra/k8s/overlays/{staging,production} and the wrong
# GHCR owner (proxyhubb vs samuel-1-avson).

name: Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Optional explicit image tag (default: git tag or sha)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  # Live compose pulls ghcr.io/<owner>/{control-api,edge-gateway,web}
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build:
    name: Build & Push GHCR Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - name: control-api
            context: .
            dockerfile: services/control-api/Dockerfile
            platforms: linux/amd64
          - name: edge-gateway
            context: ./services/edge-gateway
            dockerfile: Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: provider-node
            context: ./services/provider-node
            dockerfile: Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: groth16-prover
            context: ./services/groth16-prover
            dockerfile: Dockerfile
            platforms: linux/amd64
          - name: web
            context: ./apps/web
            dockerfile: Dockerfile
            platforms: linux/amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-Arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ matrix.service.platforms }}

  announce-vm-roll:
    name: Announce VM Roll Instructions
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Print canonical deploy path
        run: |
          set -euo pipefail
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              TAG="${{ github.ref_name }}"
            else
              TAG="sha-${GITHUB_SHA::7}"
            fi
          fi
          OWNER="${{ env.IMAGE_OWNER }}"
          cat <<EOF
          ✅ Images pushed to ghcr.io/${OWNER}/{control-api,edge-gateway,web}

          Canonical live deploy (on proxyhubb-testnet GCE VM):
            IMAGE_TAG=${TAG} GHCR_OWNER=${OWNER} ./scripts/gcp-compose-pull-deploy.sh

          Web-only:
            IMAGE_TAG=${TAG} ./scripts/gcp-deploy-web.sh

          Docs: docs/GCP_TESTNET_PHASE_A.md
          EOF
