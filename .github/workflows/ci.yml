name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==================== Backend (Go) ====================
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/control-api
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: proxyhubb
          POSTGRES_PASSWORD: proxyhubb
          POSTGRES_DB: proxyhubb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'
        check-latest: true

    - name: Build
      run: go build -v ./...

    - name: Test
      env:
        TEST_DATABASE_URL: "postgres://proxyhubb:proxyhubb@localhost:5432/proxyhubb_test?sslmode=disable"
        REDIS_URL: "redis://localhost:6379"
      run: go test -v ./...

  # ==================== Frontend (Next.js) ====================
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/web
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./apps/web/package-lock.json
        
    - name: Install dependencies
      run: npm ci
      
    - name: Lint
      run: npm run lint
      
    - name: Build
      run: npm run build

  # ==================== Edge Gateway (Rust) ====================
  edge-gateway-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/edge-gateway
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      
    - name: Build
      run: cargo build --verbose
      
    - name: Test
      run: cargo test --verbose

  # ==================== AI Bridge (Python) ====================
  bridge-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/bittensor-bridge
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
