name: ProxyHubb CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  GO_VERSION: '1.26' # go.mod requires 1.26 (golang.org/x/net 0.60); matches the Dockerfiles
  NODE_VERSION: '20'
  RUST_VERSION: 'stable'

jobs:
  # ==================== Secret / keypair gate (always) ====================
  secrets-gate:
    name: Secrets & keypair gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail on tracked keypair or env secret files
        run: |
          set -euo pipefail
          bad=$(git ls-files \
            'infra/oracle-keypair.json' \
            'treasury-keypair.json' \
            'provider-keypair.json' \
            'oracle-keypair.json' \
            '.env' \
            'config/docker/provider.compose.env' \
            || true)
          bad=$(echo "$bad" | grep -v '\.example$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Tracked secret-like files (remove with git rm --cached):"
            echo "$bad"
            exit 1
          fi
          echo "No tracked keypair or .env files in index."

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================== Changes Detection ====================
  changes:
    needs: secrets-gate
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
      explorer: ${{ steps.filter.outputs.explorer }}
      edge: ${{ steps.filter.outputs.edge }}
      provider: ${{ steps.filter.outputs.provider }}
      providerapp: ${{ steps.filter.outputs.providerapp }}
      solana: ${{ steps.filter.outputs.solana }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            backend:
              - 'services/control-api/**'
              - 'services/provider-node/**'
              - 'proto/**'
            frontend:
              - 'apps/web/**'
            docs:
              - 'apps/docs/**'
              - 'packages/design-system/**'
            explorer:
              - 'apps/explorer/**'
              - 'packages/design-system/**'
            edge:
              - 'services/edge-gateway/**'
            provider:
              - 'services/provider-node/**'
              - 'cli/**'
              - 'scripts/build-cli-dist.sh'
              - 'rebuild-cli.ps1'
            providerapp:
              - 'apps/provider-app/**'
              - 'services/provider-node/**'
            solana:
              - 'services/solana-programs/**'

  # ==================== Backend (Go) ====================
  backend-test:
    needs: [secrets-gate, changes]
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/control-api
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: proxyhubb
          POSTGRES_PASSWORD: proxyhubb
          POSTGRES_DB: proxyhubb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
        options: >-
          --health-cmd "wget --spider -q http://localhost:8222/varz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        check-latest: true

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Run go vet
      run: go vet ./...

    - name: Install staticcheck
      run: go install honnef.co/go/tools/cmd/staticcheck@v0.6.1

    - name: Run staticcheck
      run: staticcheck ./...

    - name: Build
      run: go build -v ./...

    - name: Auth, marketplace, and map API tests
      env:
        TEST_DATABASE_URL: "postgres://proxyhubb:proxyhubb@localhost:5432/proxyhubb_test?sslmode=disable"
        REDIS_URL: "redis://localhost:6379"
        EMERGENCY_SOL_PRICE_USD: "200"
        JWT_SECRET: "test-jwt-secret-for-ci-min-32-chars-long"
        SESSION_SECRET: "test-session-secret-for-ci-min-32-chars"
        ENCRYPTION_KEY: "test-encryption-key-for-ci-32-chars-xx"
        TOKEN_HMAC_SECRET: "test-token-hmac-secret-for-ci-32-chars"
      run: |
        go test ./internal/middleware/ ./internal/marketplace/ -count=1
        go test ./internal/api/ -count=1 -run 'TestGetMapLinks|TestMapTopology|TestParseMapLinksBBox'

    - name: Wallet production closure (Go)
      # Keep going after an earlier red step so one run lists every failing test.
      if: ${{ !cancelled() }}
      env:
        TEST_DATABASE_URL: "postgres://proxyhubb:proxyhubb@localhost:5432/proxyhubb_test?sslmode=disable"
        REDIS_URL: "redis://localhost:6379"
        EMERGENCY_SOL_PRICE_USD: "200"
        JWT_SECRET: "test-jwt-secret-for-ci-min-32-chars-long"
        SESSION_SECRET: "test-session-secret-for-ci-min-32-chars"
        ENCRYPTION_KEY: "test-encryption-key-for-ci-32-chars-xx"
        TOKEN_HMAC_SECRET: "test-token-hmac-secret-for-ci-32-chars"
      run: |
        go test ./internal/billing/... -count=1
        go test ./internal/api/... -count=1 -run 'Wallet|Withdrawal|Whitelist|Cooldown|Crypto|GDPR|Treasury'

    - name: Wallet and billing coverage report
      # Keep going after an earlier red step so one run lists every failing test.
      if: ${{ !cancelled() }}
      env:
        TEST_DATABASE_URL: "postgres://proxyhubb:proxyhubb@localhost:5432/proxyhubb_test?sslmode=disable"
        REDIS_URL: "redis://localhost:6379"
        EMERGENCY_SOL_PRICE_USD: "200"
        JWT_SECRET: "test-jwt-secret-for-ci-min-32-chars-long"
        SESSION_SECRET: "test-session-secret-for-ci-min-32-chars"
        ENCRYPTION_KEY: "test-encryption-key-for-ci-32-chars-xx"
        TOKEN_HMAC_SECRET: "test-token-hmac-secret-for-ci-32-chars"
      run: |
        go test ./internal/api/... -count=1 -coverprofile=wallet_api.cover -covermode=atomic \
          -run 'Wallet|Withdrawal|Whitelist|Cooldown|Crypto|GDPR|Treasury'
        echo "=== wallet API test coverage (filtered run) ==="
        go tool cover -func=wallet_api.cover | tail -1
        go test ./internal/billing/... -count=1 -coverprofile=billing.cover -covermode=atomic
        echo "=== billing package coverage ==="
        go tool cover -func=billing.cover | tail -1

    - name: Test with coverage
      # Keep going after an earlier red step so one run lists every failing test.
      if: ${{ !cancelled() }}
      env:
        TEST_DATABASE_URL: "postgres://proxyhubb:proxyhubb@localhost:5432/proxyhubb_test?sslmode=disable"
        REDIS_URL: "redis://localhost:6379"
        NATS_URL: "nats://localhost:4222"
        JWT_SECRET: "test-jwt-secret-for-ci-min-32-chars-long"
        SESSION_SECRET: "test-session-secret-for-ci-min-32-chars"
        ENCRYPTION_KEY: "test-encryption-key-for-ci-32-chars-xx"
        TOKEN_HMAC_SECRET: "test-token-hmac-secret-for-ci-32-chars"
        SOLANA_RPC_ENDPOINT: "https://api.devnet.solana.com"
        EMERGENCY_SOL_PRICE_USD: "200"
      run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./services/control-api/coverage.out
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false

  # ==================== Frontend (Next.js) ====================
  frontend-check:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/web
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: ./apps/web/package-lock.json
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run linter
      # Pre-existing eslint debt (~100+ errors) should not block docker/type gates.
      # Keep lint visible; fail the job on typecheck/build/e2e instead.
      continue-on-error: true
      run: npm run lint

    - name: Validate route registry
      run: npm run validate:routes

    - name: Type check
      run: npm run typecheck

    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    - name: Marketplace E2E (map, browse, moderation)
      run: npm run test:e2e:marketplace
      env:
        JWT_SECRET: "test-jwt-secret-for-ci-min-32-chars-long"
        TEST_JWT_SECRET: "test-jwt-secret-for-ci-min-32-chars-long"
        PLAYWRIGHT_E2E_AUTH_BYPASS: "1"
        NEXT_PUBLIC_PLAYWRIGHT_E2E_MOCK_BUY: "1"
    - name: Data availability and geographic map regressions
      run: |
        npm run test:measurements
        npm run test:e2e:live-data
      env:
        JWT_SECRET: "test-jwt-secret-for-ci-min-32-chars-long"
        TEST_JWT_SECRET: "test-jwt-secret-for-ci-min-32-chars-long"
        PLAYWRIGHT_E2E_AUTH_BYPASS: "1"
        NEXT_PUBLIC_PLAYWRIGHT_E2E_MOCK_BUY: "1"
      
    - name: Build
      run: npm run build
      env:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_SOLANA_NETWORK: devnet

    - name: Run contract checks
      # Run the dependency compatibility and UI data contracts before release.
      run: |
        npm run test:provider-config
        npm run test:listing-display
        npm run test:order-status
        npm run test:node-status
        npm run test:wallet-session
        npm run test:explorer-redirects
        npm run test:dependency-compat
        npm run test:map-evidence

  # ==================== Docs (Next.js / MDX) ====================
  docs-check:
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/docs
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: ./apps/docs/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Verify MDX security and supported content
      run: npm run test:mdx-security

    - name: Prebuild search index & OpenAPI specs
      run: npm run prebuild

    - name: Build docs static pages
      run: npm run build

  explorer-check:
    needs: changes
    if: ${{ needs.changes.outputs.explorer == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/explorer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/explorer/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: explorer-browser-failures
          path: apps/explorer/test-results
          retention-days: 7

  # ==================== Edge Gateway (Rust) ====================
  edge-gateway-check:
    needs: changes
    if: ${{ needs.changes.outputs.edge == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/edge-gateway
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "./services/edge-gateway"
    
    - name: Check formatting
      run: cargo fmt -- --check
    
    - name: Run Clippy (default lean features)
      # Allow dead_code while gateway modules are still being wired; keep other warnings hard-fail.
      run: cargo clippy -- -D warnings -A dead_code -A unused
      
    - name: Build (default lean features)
      run: cargo build --verbose
      
    - name: Test (includes P1 deploy port parity + lean features)
      run: cargo test --verbose --bin edge-gateway

    - name: P1 bench smoke (matches scripts/p1-exit-verify.ps1)
      run: |
        cargo bench --bench registry_bench -- --test
        cargo bench --bench hotpath_bench -- --test
      # Tracker: services/edge-gateway/docs/REMAINING_PHASES.md

    - name: P2 unit tests (admission, session limits, circuit config)
      run: |
        cargo test --bin edge-gateway session_within_time_limit -- --nocapture
        cargo test --bin edge-gateway writes_http_503_and_closes -- --nocapture
        cargo test --bin edge-gateway circuit_config_from_env -- --nocapture
      # Tracker: services/edge-gateway/docs/REMAINING_PHASES.md (P2)

    - name: P3 unit tests (directory, admission)
      run: |
        cargo test --bin edge-gateway ownership_key -- --nocapture
        cargo test --bin edge-gateway writes_http_503_and_closes -- --nocapture
      # Tracker: services/edge-gateway/docs/REMAINING_PHASES.md (P3)

    # The `blockchain` feature compiles proto/blockchain.proto (tonic-build), which needs
    # protoc; the runner image does not ship it.
    - name: Install protoc
      run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

    - name: Check optional feature bundles compile
      run: cargo check --features legacy-zk,blockchain,pricing,ml,otel

  # ==================== Provider CLI distribution ====================
  cli-dist-linux:
    name: Build CLI (linux/amd64)
    needs: [secrets-gate, changes]
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.provider == 'true' ||
      needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLI_DIST_VERSION: 1.0.0
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./services/provider-node -> target
            ./cli -> target"

      - name: Build provider-node + proxyhubb-cli (linux)
        run: |
          chmod +x scripts/build-cli-dist.sh
          ./scripts/build-cli-dist.sh
          test -x "cli-dist/${CLI_DIST_VERSION}/provider-node-${CLI_DIST_VERSION}-linux-amd64"
          test -x "cli-dist/${CLI_DIST_VERSION}/provider-cli-${CLI_DIST_VERSION}-linux-amd64"

      - name: Upload linux CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-dist-linux
          path: cli-dist/${{ env.CLI_DIST_VERSION }}/
          if-no-files-found: error

  cli-dist-windows:
    name: Build CLI (windows/amd64)
    needs: [secrets-gate, changes]
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.provider == 'true' ||
      needs.changes.outputs.backend == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CLI_DIST_VERSION: 1.0.0
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./services/provider-node -> target
            ./cli -> target"

      - name: Build provider-node + proxyhubb-cli (windows)
        shell: pwsh
        run: |
          .\rebuild-cli.ps1
          $node = "cli-dist\${env:CLI_DIST_VERSION}\provider-node-${env:CLI_DIST_VERSION}-windows-amd64.exe"
          $cli = "cli-dist\${env:CLI_DIST_VERSION}\provider-cli-${env:CLI_DIST_VERSION}-windows-amd64.exe"
          if (-not (Test-Path $node)) { throw "Missing $node" }
          if (-not (Test-Path $cli)) { throw "Missing $cli" }

      - name: Upload windows CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-dist-windows
          path: cli-dist/${{ env.CLI_DIST_VERSION }}/
          if-no-files-found: error

  cli-dist-macos:
    name: Build CLI (macos)
    needs: [secrets-gate, changes]
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.provider == 'true' ||
      needs.changes.outputs.backend == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CLI_DIST_VERSION: 1.0.0
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./services/provider-node -> target
            ./cli -> target"

      - name: Build provider-node + proxyhubb-cli (macos amd64+arm64)
        run: |
          chmod +x scripts/build-cli-dist.sh
          # build-cli-dist.sh always builds linux first; on macOS we only need darwin targets.
          VERSION="${CLI_DIST_VERSION}"
          DIST_DIR="cli-dist/${VERSION}"
          mkdir -p "$DIST_DIR"
          build_one() {
            local crate_dir="$1" bin_name="$2" goos="$3" goarch="$4" target="$5" out_name="$6"
            echo "Building $out_name ($target)..."
            (cd "$crate_dir" && cargo build --release --target "$target")
            local built="$crate_dir/target/$target/release/$bin_name"
            cp -f "$built" "$DIST_DIR/$out_name"
            chmod +x "$DIST_DIR/$out_name"
          }
          build_one services/provider-node provider-node macos amd64 x86_64-apple-darwin "provider-node-${VERSION}-macos-amd64"
          build_one cli proxyhubb-cli macos amd64 x86_64-apple-darwin "provider-cli-${VERSION}-macos-amd64"
          build_one services/provider-node provider-node macos arm64 aarch64-apple-darwin "provider-node-${VERSION}-macos-arm64"
          build_one cli proxyhubb-cli macos arm64 aarch64-apple-darwin "provider-cli-${VERSION}-macos-arm64"
          ls -la "$DIST_DIR"

      - name: Upload macos CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-dist-macos
          path: cli-dist/${{ env.CLI_DIST_VERSION }}/
          if-no-files-found: error

  cli-dist-build:
    name: Verify CLI download API
    needs: [cli-dist-linux, cli-dist-windows, cli-dist-macos]
    if: |
      always() &&
      needs.cli-dist-linux.result == 'success' &&
      needs.cli-dist-windows.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLI_DIST_VERSION: 1.0.0
    steps:
      - uses: actions/checkout@v4

      - name: Download linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: cli-dist-linux
          path: cli-dist/${{ env.CLI_DIST_VERSION }}

      - name: Download windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: cli-dist-windows
          path: cli-dist/${{ env.CLI_DIST_VERSION }}

      - name: Download macos artifacts
        if: needs.cli-dist-macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: cli-dist-macos
          path: cli-dist/${{ env.CLI_DIST_VERSION }}

      - name: Write CI .env for Docker Compose
        run: |
          set -euo pipefail
          chmod +x scripts/ci-write-compose-env.sh
          CLI_DIST_VERSION="${CLI_DIST_VERSION}" ./scripts/ci-write-compose-env.sh

      - name: Start control-api with CLI dist mounted
        run: |
          docker compose -f docker-compose.yml up -d postgres redis nats zk-prover db-migrate control-api
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/health >/dev/null 2>&1; then
              echo "control-api healthy"
              exit 0
            fi
            sleep 5
          done
          echo "control-api failed to become healthy"
          docker compose -f docker-compose.yml logs control-api --tail 80
          exit 1

      - name: Verify public CLI download endpoints
        run: |
          chmod +x scripts/verify-cli-download.sh
          ./scripts/verify-cli-download.sh --api-base http://127.0.0.1:18080 --platform linux --arch amd64
          ./scripts/verify-cli-download.sh --api-base http://127.0.0.1:18080 --platform windows --arch amd64
          if [[ -f "cli-dist/${CLI_DIST_VERSION}/provider-node-${CLI_DIST_VERSION}-macos-arm64" ]]; then
            ./scripts/verify-cli-download.sh --api-base http://127.0.0.1:18080 --platform macos --arch arm64
          fi
          if [[ -f "cli-dist/${CLI_DIST_VERSION}/provider-node-${CLI_DIST_VERSION}-macos-amd64" ]]; then
            ./scripts/verify-cli-download.sh --api-base http://127.0.0.1:18080 --platform macos --arch amd64
          fi

      - name: Upload combined CLI dist for release sync
        uses: actions/upload-artifact@v4
        with:
          name: cli-dist-all
          path: cli-dist/${{ env.CLI_DIST_VERSION }}/
          if-no-files-found: error

  # ==================== Provider Node (Rust) ====================
  provider-node-check:
    needs: changes
    if: ${{ needs.changes.outputs.provider == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/provider-node
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "./services/provider-node"

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Run unit tests
      run: cargo test --verbose

    - name: Run Clippy
      run: cargo clippy -- -D warnings

  # ==================== Provider app (Tauri tray app, Windows) ====================
  # The app bundles provider-node as a sidecar, so a provider-node change re-checks it too.
  # Actions are pinned by commit SHA (the tag is in the comment).
  provider-app-check:
    name: provider-app check (windows)
    needs: changes
    if: ${{ needs.changes.outputs.providerapp == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./apps/provider-app
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Use Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        # Not env.NODE_VERSION (20): vitest 5 needs Node >= 22.12.
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: ./apps/provider-app/package-lock.json

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch tip
      with:
        toolchain: stable
        components: rustfmt, clippy

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      with:
        workspaces: "./apps/provider-app/src-tauri -> target"

    - name: Install dependencies
      run: npm ci

    # The frontend must be built first: the Rust build embeds ../dist.
    - name: Frontend typecheck, tests, build
      run: |
        npm run typecheck
        npm test
        npm run build

    # tauri-build needs the bundled node to exist; these checks never run the app.
    - name: Placeholder sidecar
      run: node scripts/build-sidecar.mjs --placeholder

    - name: Check formatting
      working-directory: ./apps/provider-app/src-tauri
      run: cargo fmt -- --check

    - name: Run unit tests
      working-directory: ./apps/provider-app/src-tauri
      run: cargo test --locked

    - name: Run Clippy
      working-directory: ./apps/provider-app/src-tauri
      run: cargo clippy --locked --all-targets -- -D warnings

  # Builds the real thing: provider-node, the app and the NSIS installer (debug profile, UNSIGNED,
  # never installed or uploaded). The installer step downloads NSIS tooling from GitHub, which
  # times out occasionally; scripts/build-app.mjs retries only that step.
  provider-app-installer:
    name: provider-app installer (windows, unsigned debug build)
    needs: [changes, provider-app-check]
    if: ${{ needs.changes.outputs.providerapp == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ./apps/provider-app
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Use Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: ./apps/provider-app/package-lock.json

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch tip
      with:
        toolchain: stable

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      with:
        workspaces: |
          ./services/provider-node -> target
          ./apps/provider-app/src-tauri -> target

    - name: Install dependencies
      run: npm ci

    - name: Build the installer
      run: npm run build:app:debug

  proxyhubb-cli-check:
    name: proxyhubb-cli check
    needs: changes
    if: ${{ needs.changes.outputs.provider == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cli
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "./cli"

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Run unit tests
      run: cargo test --verbose

    - name: Run Clippy
      run: cargo clippy -- -D warnings

  # ==================== Provider Docker E2E ====================
  provider-docker-e2e:
    name: Provider Docker E2E
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.provider == 'true' ||
      needs.changes.outputs.edge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Write CI .env for Docker Compose
      run: |
        set -euo pipefail
        chmod +x scripts/ci-write-compose-env.sh
        ./scripts/ci-write-compose-env.sh

    - name: Provider stack E2E (gateway + provider-node)
      # scripts/provider-docker-e2e.sh waits on `proxyhubb-control-api-1` and reads
      # `proxyhubb-edge-gateway-1` logs. Compose names containers <project>-<service>-N
      # and defaults the project to the checkout directory (`proxysocialhub` on a
      # runner, `proxyhubb` on the VM), so pin it or the wait times out.
      env:
        COMPOSE_PROJECT_NAME: proxyhubb
      run: |
        set -euo pipefail
        # The credential helper (go run ./cmd/provider_dev_token) runs on the host, not
        # in compose, and the .env copied from .env.example has an empty DATABASE_URL.
        # The E2E script does `source .env`, which would overwrite a variable exported
        # here, so append the URL to this job's .env (the last assignment wins for both
        # `source` and godotenv). It points at the published Postgres port with the
        # runtime-generated password. The containers are unaffected: docker-compose.yml
        # sets their DATABASE_URL under `environment:`, which beats env_file.
        envval() { grep -E "^$1=" .env | tail -n1 | cut -d= -f2- | sed 's/[[:space:]]*#.*$//'; }
        echo "DATABASE_URL=postgresql://$(envval POSTGRES_USER):$(envval POSTGRES_PASSWORD)@127.0.0.1:${POSTGRES_HOST_PORT:-55432}/$(envval POSTGRES_DB)?sslmode=disable" >> .env
        chmod +x scripts/provider-docker-e2e.sh
        PROVIDER_E2E_SKIP_HEAL=1 ./scripts/provider-docker-e2e.sh

  # ==================== Solana Programs ====================
  solana-check:
    needs: changes
    if: ${{ needs.changes.outputs.solana == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    # The root package-lock.json was deleted on 2026-08-19 (a3ceb334) and the root
    # package.json declares no dependencies, so there is nothing for `npm ci` to
    # install (it also fails without a lockfile) and nothing to cache. These four
    # suites import only node:crypto; tsx is fetched on demand.
    - name: Run Solana Protocol Security & Invariant Suite
      run: |
        npx --yes tsx testing/test_security_hardening.ts
        npx --yes tsx testing/test_zk_and_p2p.ts
        npx --yes tsx testing/test_depin_ecosystem.ts
        npx --yes tsx testing/test_staked_gateway.ts

    # BC-CRIT-01: the program once failed to compile and the old step hid it behind
    # `|| true`. Compiling it is the gate that matters, so it has no bypass.
    - name: Compile proxyhub program
      run: |
        cargo check --manifest-path services/solana-programs/proxyhub/programs/proxyhub/Cargo.toml

    # Library tests only. tests/w9a_soak.rs loads a prebuilt SBF proxyhub.so, which this
    # job does not build, so it fails here with "proxyhub.so missing". It runs in the
    # anchor-test job below, which builds the SBF artifact first.
    - name: Run proxyhub unit tests
      run: |
        cargo test --manifest-path services/solana-programs/proxyhub/Cargo.toml --lib

  # ==================== Anchor Program Tests ====================
  # P1-SC-5: build the SBF programs, run the full Anchor TS suite against a
  # local validator, then run the Rust w9a_soak test against the built
  # proxyhub.so. No bypass: a red suite fails the job. Toolchain install
  # mirrors .github/workflows/anchor-verify.yml (avm, not a from-source
  # anchor-cli build). Versions match Anchor.toml and rust-toolchain.toml.
  anchor-test:
    name: Anchor tests (proxyhub)
    needs: changes
    if: ${{ needs.changes.outputs.solana == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4

    # The Docker build (rust image, Solana toolchain, anchor build, test binaries)
    # filled the runner disk and failed linking w9a_soak with "No space left on
    # device". Drop toolchains this job never uses.
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force > /dev/null
        df -h /

    - name: Build programs and run Anchor + soak tests (Docker)
      run: |
        set -euo pipefail
        docker run --rm \
          -v "$PWD/services/solana-programs/proxyhub:/workspace" \
          -w /workspace \
          rust:1.89-trixie \
          bash -c '
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq && apt-get install -y --no-install-recommends curl git pkg-config libssl-dev libudev-dev ca-certificates build-essential xz-utils bzip2

            mkdir -p /opt/node
            curl -fsSL "https://nodejs.org/dist/v24.10.0/node-v24.10.0-linux-x64.tar.xz" | tar -xJ -C /opt/node --strip-components=1
            export PATH="/opt/node/bin:$PATH"

            curl -sSfL "https://release.anza.xyz/v2.3.0/install" | bash
            export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"

            cargo install --git https://github.com/solana-foundation/anchor --tag v0.32.1 avm --force
            export PATH="$HOME/.cargo/bin:$HOME/.avm/bin:$PATH"
            avm install 0.32.1
            avm use 0.32.1

            echo "node: $(node --version)"
            echo "solana: $(solana --version)"
            echo "anchor: $(anchor --version)"
            echo "cargo: $(cargo --version)"

            npm ci --no-audit --no-fund
            anchor build
            test -f target/deploy/proxyhub.so
            test -f target/deploy/session.so
            sha256sum target/deploy/proxyhub.so target/deploy/session.so

            set +e
            bash scripts/run-local-tests.sh
            MOCHA_RC=$?
            cargo test --manifest-path programs/proxyhub/Cargo.toml --test w9a_soak -- --nocapture
            SOAK_RC=$?
            set -e
            echo "MOCHA_EXIT=$MOCHA_RC SOAK_EXIT=$SOAK_RC"
            test "$MOCHA_RC" -eq 0
            test "$SOAK_RC" -eq 0
          '

    # The pinned toolchain makes this build reproducible (the same hashes on every run and
    # on the independent A1 proof build), so publish exactly what it produced. The devnet
    # upgrade deploys these bytes: download the artifact, check SHA256SUMS against
    # docs/audits/P1-SC-6_IDL_CALLSITES.md section 7, then upgrade. Runs on failure too, so
    # a red run still leaves whatever was built.
    - name: Collect program artifacts
      if: always()
      run: |
        set -euo pipefail
        d=services/solana-programs/proxyhub
        mkdir -p out
        for f in target/deploy/proxyhub.so target/deploy/session.so idl/proxyhub.json; do
          if [ -f "$d/$f" ]; then cp "$d/$f" out/; else echo "::warning::$d/$f was not produced"; fi
        done
        if [ -f "$d/target/idl/proxyhub.json" ] && [ -f "$d/idl/proxyhub.json" ] && ! cmp -s "$d/target/idl/proxyhub.json" "$d/idl/proxyhub.json"; then
          echo "::warning::the IDL built from source differs from the committed idl/proxyhub.json"
        fi
        if compgen -G "out/*" > /dev/null; then
          (cd out && sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS")
          cp "$RUNNER_TEMP/SHA256SUMS" out/SHA256SUMS
          { echo '### Anchor build artifacts (SHA-256)'; echo '```'; cat out/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload program artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: proxyhub-programs-${{ github.sha }}
        path: out/
        if-no-files-found: warn
        retention-days: 30

  # ==================== Docker Build Check ====================
  docker-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Control API Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: services/control-api/Dockerfile
        push: false
        tags: control-api:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build Web Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: apps/web/Dockerfile
        push: false
        tags: web:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ==================== DB Migration Smoke-Test ====================
  # Applies every *.up.sql file in sequence via psql — matching exactly what
  # the custom RunMigrations() runner does at runtime (P3-14).
  # Runs on every push so a broken migration is caught before deploy.
  db-migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: proxyhubb
          POSTGRES_PASSWORD: proxyhubb
          POSTGRES_DB: proxyhubb_migrate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4

    - name: Run all up migrations (psql)
      env:
        PGPASSWORD: proxyhubb
      run: |
        set -euo pipefail
        # Match Docker: auth stub must exist before migrations that reference auth.users / wallets.
        psql -h localhost -U proxyhubb -d proxyhubb_migrate_test -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
        psql -h localhost -U proxyhubb -d proxyhubb_migrate_test -v ON_ERROR_STOP=1 -f infra/postgres/init/00_auth_schema.sql
        for f in $(ls migrations/*.up.sql | sort); do
          echo "Applying $f ..."
          psql -h localhost -U proxyhubb -d proxyhubb_migrate_test -v ON_ERROR_STOP=1 -f "$f" \
            || { echo "FAILED: $f"; exit 1; }
        done

    - name: Verify key tables exist
      env:
        PGPASSWORD: proxyhubb
      run: |
        set -euo pipefail
        tables=$(psql -h localhost -U proxyhubb -d proxyhubb_migrate_test -t -A -c \
          "SELECT table_name FROM information_schema.tables
           WHERE table_schema = 'public'
           ORDER BY table_name;")
        for t in wallets sessions nodes provider_tokens spending_records; do
          echo "$tables" | grep -qx "$t" || { echo "missing table: $t"; exit 1; }
        done
        echo "Key tables present"

    - name: Verify wallet schema (migrations 080-088)
      env:
        PGPASSWORD: proxyhubb
      run: |
        set -euo pipefail
        DB=proxyhubb_migrate_test
        cols=$(psql -h localhost -U proxyhubb -d "$DB" -t -A -c \
          "SELECT column_name FROM information_schema.columns
           WHERE table_name = 'wallets'
             AND column_name IN ('withdrawal_whitelist','primary_withdrawal_address','withdrawal_address_changed_at','balance_usdt');")
        echo "$cols" | grep -q withdrawal_whitelist
        echo "$cols" | grep -q primary_withdrawal_address
        echo "$cols" | grep -q withdrawal_address_changed_at
        echo "$cols" | grep -q balance_usdt && { echo "balance_usdt should be dropped"; exit 1; } || true
        psql -h localhost -U proxyhubb -d "$DB" -t -A -c \
          "SELECT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_name = 'user_flags');" | grep -q t
        psql -h localhost -U proxyhubb -d "$DB" -t -A -c \
          "SELECT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name = 'wallet_ledger_entries' AND column_name = 'tx_hash');" | grep -q t
        echo "Wallet schema closure checks passed"

    - name: Run all down migrations (rollback smoke-test)
      env:
        PGPASSWORD: proxyhubb
      run: |
        for f in $(ls migrations/*.down.sql | sort -r); do
          echo "Rolling back $f ..."
          psql -h localhost -U proxyhubb -d proxyhubb_migrate_test -f "$f"
        done
      continue-on-error: true   # Down migrations are best-effort in CI

  # ==================== Lint & Format Check ====================
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Check Markdown
      uses: DavidAnson/markdownlint-cli2-action@v15
      with:
        globs: '**/*.md'
      continue-on-error: true
    
    - name: Check YAML
      run: |
        pip install yamllint
        yamllint -d relaxed .github/workflows/
      continue-on-error: true
