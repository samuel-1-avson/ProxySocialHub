name: ProxyHubb CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '20'
  RUST_VERSION: 'stable'

jobs:
  # ==================== Secret / keypair gate (always) ====================
  secrets-gate:
    name: Secrets & keypair gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail on tracked keypair or env secret files
        run: |
          set -euo pipefail
          bad=$(git ls-files \
            'infra/oracle-keypair.json' \
            'treasury-keypair.json' \
            'provider-keypair.json' \
            'oracle-keypair.json' \
            '.env' \
            'config/docker/provider.compose.env' \
            || true)
          bad=$(echo "$bad" | grep -v '\.example$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Tracked secret-like files (remove with git rm --cached):"
            echo "$bad"
            exit 1
          fi
          echo "No tracked keypair or .env files in index."

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================== Changes Detection ====================
  changes:
    needs: secrets-gate
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      edge: ${{ steps.filter.outputs.edge }}
      provider: ${{ steps.filter.outputs.provider }}
      solana: ${{ steps.filter.outputs.solana }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            backend:
              - 'services/control-api/**'
              - 'services/provider-node/**'
              - 'proto/**'
            frontend:
              - 'apps/web/**'
            edge:
              - 'services/edge-gateway/**'
            provider:
              - 'services/provider-node/**'
              - 'cli/**'
              - 'scripts/build-cli-dist.sh'
              - 'rebuild-cli.ps1'
            solana:
              - 'services/solana-programs/**'
            contracts:
              - 'packages/contracts/**'

  # ==================== Backend (Go) ====================
  backend-test:
    needs: [secrets-gate, changes]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/control-api
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: proxyhubb
          POSTGRES_PASSWORD: proxyhubb
          POSTGRES_DB: proxyhubb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
        options: >-
          --health-cmd "wget --spider -q http://localhost:8222/varz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        check-latest: true

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Run go vet
      run: go vet ./...

    - name: Install staticcheck
      run: go install honnef.co/go/tools/cmd/staticcheck@latest

    - name: Run staticcheck
      run: staticcheck ./...

    - name: Build
      run: go build -v ./...

    - name: Wallet production closure (Go)
      env:
        TEST_DATABASE_URL: "postgres://proxyhubb:proxyhubb@localhost:5432/proxyhubb_test?sslmode=disable"
        REDIS_URL: "redis://localhost:6379"
        EMERGENCY_SOL_PRICE_USD: "200"
        JWT_SECRET: "test-jwt-secret-for-ci-min-32-chars-long"
        SESSION_SECRET: "test-session-secret-for-ci-min-32-chars"
        ENCRYPTION_KEY: "test-encryption-key-for-ci-32-chars-xx"
        TOKEN_HMAC_SECRET: "test-token-hmac-secret-for-ci-32-chars"
      run: |
        go test ./internal/billing/... -count=1
        go test ./internal/api/... -count=1 -run 'Wallet|Withdrawal|Whitelist|Cooldown|Crypto|GDPR|Treasury'

    - name: Wallet and billing coverage report
      env:
        TEST_DATABASE_URL: "postgres://proxyhubb:proxyhubb@localhost:5432/proxyhubb_test?sslmode=disable"
        REDIS_URL: "redis://localhost:6379"
        EMERGENCY_SOL_PRICE_USD: "200"
        JWT_SECRET: "test-jwt-secret-for-ci-min-32-chars-long"
        SESSION_SECRET: "test-session-secret-for-ci-min-32-chars"
        ENCRYPTION_KEY: "test-encryption-key-for-ci-32-chars-xx"
        TOKEN_HMAC_SECRET: "test-token-hmac-secret-for-ci-32-chars"
      run: |
        go test ./internal/api/... -count=1 -coverprofile=wallet_api.cover -covermode=atomic \
          -run 'Wallet|Withdrawal|Whitelist|Cooldown|Crypto|GDPR|Treasury'
        echo "=== wallet API test coverage (filtered run) ==="
        go tool cover -func=wallet_api.cover | tail -1
        go test ./internal/billing/... -count=1 -coverprofile=billing.cover -covermode=atomic
        echo "=== billing package coverage ==="
        go tool cover -func=billing.cover | tail -1

    - name: Test with coverage
      env:
        TEST_DATABASE_URL: "postgres://proxyhubb:proxyhubb@localhost:5432/proxyhubb_test?sslmode=disable"
        REDIS_URL: "redis://localhost:6379"
        NATS_URL: "nats://localhost:4222"
        JWT_SECRET: "test-jwt-secret-for-ci-min-32-chars-long"
        SESSION_SECRET: "test-session-secret-for-ci-min-32-chars"
        ENCRYPTION_KEY: "test-encryption-key-for-ci-32-chars-xx"
        TOKEN_HMAC_SECRET: "test-token-hmac-secret-for-ci-32-chars"
        SOLANA_RPC_ENDPOINT: "https://api.devnet.solana.com"
        EMERGENCY_SOL_PRICE_USD: "200"
      run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./services/control-api/coverage.out
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false

  # ==================== Frontend (Next.js) ====================
  frontend-check:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/web
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: ./apps/web/package-lock.json
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run linter
      run: npm run lint

    - name: Validate route registry
      run: npm run validate:routes

    - name: Type check
      run: npm run typecheck

    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    - name: Marketplace E2E (map, browse, moderation)
      run: npm run test:e2e:marketplace
      env:
        JWT_SECRET: "test-jwt-secret-for-ci-min-32-chars-long"
        TEST_JWT_SECRET: "test-jwt-secret-for-ci-min-32-chars-long"
        PLAYWRIGHT_E2E_AUTH_BYPASS: "1"
        NEXT_PUBLIC_PLAYWRIGHT_E2E_MOCK_BUY: "1"
      
    - name: Build
      run: npm run build
      env:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_SOLANA_NETWORK: devnet

    - name: Run unit tests
      run: npm test -- --coverage --watchAll=false

  # ==================== Edge Gateway (Rust) ====================
  edge-gateway-check:
    needs: changes
    if: ${{ needs.changes.outputs.edge == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/edge-gateway
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "./services/edge-gateway"
    
    - name: Check formatting
      run: cargo fmt -- --check
    
    - name: Run Clippy (default lean features)
      run: cargo clippy -- -D warnings
      
    - name: Build (default lean features)
      run: cargo build --verbose
      
    - name: Test (includes P1 deploy port parity + lean features)
      run: cargo test --verbose --bin edge-gateway

    - name: P1 bench smoke (matches scripts/p1-exit-verify.ps1)
      run: |
        cargo bench --bench registry_bench -- --test
        cargo bench --bench hotpath_bench -- --test
      # Tracker: services/edge-gateway/docs/REMAINING_PHASES.md

    - name: P2 unit tests (admission, session limits, circuit config)
      run: |
        cargo test --bin edge-gateway session_within_time_limit -- --nocapture
        cargo test --bin edge-gateway writes_http_503_and_closes -- --nocapture
        cargo test --bin edge-gateway circuit_config_from_env -- --nocapture
      # Tracker: services/edge-gateway/docs/REMAINING_PHASES.md (P2)

    - name: P3 unit tests (directory, admission)
      run: |
        cargo test --bin edge-gateway ownership_key -- --nocapture
        cargo test --bin edge-gateway writes_http_503_and_closes -- --nocapture
      # Tracker: services/edge-gateway/docs/REMAINING_PHASES.md (P3)

    - name: Check optional feature bundles compile
      run: cargo check --features legacy-zk,blockchain,pricing,ml,otel

  # ==================== Provider CLI distribution ====================
  cli-dist-linux:
    name: Build CLI (linux/amd64)
    needs: [secrets-gate, changes]
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.provider == 'true' ||
      needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLI_DIST_VERSION: 1.0.0
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./services/provider-node -> target
            ./cli -> target"

      - name: Build provider-node + proxyhubb-cli (linux)
        run: |
          chmod +x scripts/build-cli-dist.sh
          ./scripts/build-cli-dist.sh
          test -x "cli-dist/${CLI_DIST_VERSION}/provider-node-${CLI_DIST_VERSION}-linux-amd64"
          test -x "cli-dist/${CLI_DIST_VERSION}/provider-cli-${CLI_DIST_VERSION}-linux-amd64"

      - name: Upload linux CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-dist-linux
          path: cli-dist/${{ env.CLI_DIST_VERSION }}/
          if-no-files-found: error

  cli-dist-windows:
    name: Build CLI (windows/amd64)
    needs: [secrets-gate, changes]
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.provider == 'true' ||
      needs.changes.outputs.backend == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CLI_DIST_VERSION: 1.0.0
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./services/provider-node -> target
            ./cli -> target"

      - name: Build provider-node + proxyhubb-cli (windows)
        shell: pwsh
        run: |
          .\rebuild-cli.ps1
          $node = "cli-dist\${env:CLI_DIST_VERSION}\provider-node-${env:CLI_DIST_VERSION}-windows-amd64.exe"
          $cli = "cli-dist\${env:CLI_DIST_VERSION}\provider-cli-${env:CLI_DIST_VERSION}-windows-amd64.exe"
          if (-not (Test-Path $node)) { throw "Missing $node" }
          if (-not (Test-Path $cli)) { throw "Missing $cli" }

      - name: Upload windows CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-dist-windows
          path: cli-dist/${{ env.CLI_DIST_VERSION }}/
          if-no-files-found: error

  cli-dist-macos:
    name: Build CLI (macos)
    needs: [secrets-gate, changes]
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.provider == 'true' ||
      needs.changes.outputs.backend == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CLI_DIST_VERSION: 1.0.0
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./services/provider-node -> target
            ./cli -> target"

      - name: Build provider-node + proxyhubb-cli (macos amd64+arm64)
        run: |
          chmod +x scripts/build-cli-dist.sh
          # build-cli-dist.sh always builds linux first; on macOS we only need darwin targets.
          VERSION="${CLI_DIST_VERSION}"
          DIST_DIR="cli-dist/${VERSION}"
          mkdir -p "$DIST_DIR"
          build_one() {
            local crate_dir="$1" bin_name="$2" goos="$3" goarch="$4" target="$5" out_name="$6"
            echo "Building $out_name ($target)..."
            (cd "$crate_dir" && cargo build --release --target "$target")
            local built="$crate_dir/target/$target/release/$bin_name"
            cp -f "$built" "$DIST_DIR/$out_name"
            chmod +x "$DIST_DIR/$out_name"
          }
          build_one services/provider-node provider-node macos amd64 x86_64-apple-darwin "provider-node-${VERSION}-macos-amd64"
          build_one cli proxyhubb-cli macos amd64 x86_64-apple-darwin "provider-cli-${VERSION}-macos-amd64"
          build_one services/provider-node provider-node macos arm64 aarch64-apple-darwin "provider-node-${VERSION}-macos-arm64"
          build_one cli proxyhubb-cli macos arm64 aarch64-apple-darwin "provider-cli-${VERSION}-macos-arm64"
          ls -la "$DIST_DIR"

      - name: Upload macos CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-dist-macos
          path: cli-dist/${{ env.CLI_DIST_VERSION }}/
          if-no-files-found: error

  cli-dist-build:
    name: Verify CLI download API
    needs: [cli-dist-linux, cli-dist-windows, cli-dist-macos]
    if: |
      always() &&
      needs.cli-dist-linux.result == 'success' &&
      needs.cli-dist-windows.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLI_DIST_VERSION: 1.0.0
    steps:
      - uses: actions/checkout@v4

      - name: Download linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: cli-dist-linux
          path: cli-dist/${{ env.CLI_DIST_VERSION }}

      - name: Download windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: cli-dist-windows
          path: cli-dist/${{ env.CLI_DIST_VERSION }}

      - name: Download macos artifacts
        if: needs.cli-dist-macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: cli-dist-macos
          path: cli-dist/${{ env.CLI_DIST_VERSION }}

      - name: Write CI .env for Docker Compose
        run: |
          set -euo pipefail
          cp .env.example .env
          {
            echo "JWT_SECRET=test-jwt-secret-for-ci-min-32-chars-long"
            echo "GATEWAY_SHARED_SECRET=test-gateway-shared-secret-ci-32chars"
            echo "SESSION_SECRET=test-session-secret-for-ci-min-32-chars"
            echo "ENCRYPTION_KEY=test-encryption-key-for-ci-min-32-chars"
            echo "TOKEN_HMAC_SECRET=test-token-hmac-secret-for-ci-32-chars"
            echo "POSTGRES_PASSWORD=proxyhubb"
            echo "CLI_DIST_VERSION=${CLI_DIST_VERSION}"
            echo "PROVIDER_SIGNATURE_MODE=observe"
          } >> .env

      - name: Start control-api with CLI dist mounted
        run: |
          docker compose -f docker-compose.yml up -d postgres redis nats zk-prover db-migrate control-api
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/health >/dev/null 2>&1; then
              echo "control-api healthy"
              exit 0
            fi
            sleep 5
          done
          echo "control-api failed to become healthy"
          docker compose -f docker-compose.yml logs control-api --tail 80
          exit 1

      - name: Verify public CLI download endpoints
        run: |
          chmod +x scripts/verify-cli-download.sh
          ./scripts/verify-cli-download.sh --api-base http://127.0.0.1:18080 --platform linux --arch amd64
          ./scripts/verify-cli-download.sh --api-base http://127.0.0.1:18080 --platform windows --arch amd64
          if [[ -f "cli-dist/${CLI_DIST_VERSION}/provider-node-${CLI_DIST_VERSION}-macos-arm64" ]]; then
            ./scripts/verify-cli-download.sh --api-base http://127.0.0.1:18080 --platform macos --arch arm64
          fi
          if [[ -f "cli-dist/${CLI_DIST_VERSION}/provider-node-${CLI_DIST_VERSION}-macos-amd64" ]]; then
            ./scripts/verify-cli-download.sh --api-base http://127.0.0.1:18080 --platform macos --arch amd64
          fi

      - name: Upload combined CLI dist for release sync
        uses: actions/upload-artifact@v4
        with:
          name: cli-dist-all
          path: cli-dist/${{ env.CLI_DIST_VERSION }}/
          if-no-files-found: error

  # ==================== Provider Node (Rust) ====================
  provider-node-check:
    needs: changes
    if: ${{ needs.changes.outputs.provider == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/provider-node
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "./services/provider-node"

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Run unit tests
      run: cargo test --verbose

    - name: Run Clippy
      run: cargo clippy -- -D warnings

  proxyhubb-cli-check:
    name: proxyhubb-cli check
    needs: changes
    if: ${{ needs.changes.outputs.provider == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cli
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "./cli"

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Run unit tests
      run: cargo test --verbose

    - name: Run Clippy
      run: cargo clippy -- -D warnings

  # ==================== Provider Docker E2E ====================
  provider-docker-e2e:
    name: Provider Docker E2E
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.provider == 'true' ||
      needs.changes.outputs.edge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Write CI .env for Docker Compose
      run: |
        set -euo pipefail
        cp .env.example .env
        {
          echo "JWT_SECRET=test-jwt-secret-for-ci-min-32-chars-long"
          echo "GATEWAY_SHARED_SECRET=test-gateway-shared-secret-ci-32chars"
          echo "SESSION_SECRET=test-session-secret-for-ci-min-32-chars"
          echo "ENCRYPTION_KEY=test-encryption-key-for-ci-min-32-chars"
          echo "TOKEN_HMAC_SECRET=test-token-hmac-secret-for-ci-32-chars"
          echo "POSTGRES_PASSWORD=proxyhubb"
          echo "PROVIDER_SIGNATURE_MODE=observe"
        } >> .env

    - name: Provider stack E2E (gateway + provider-node)
      run: |
        chmod +x scripts/provider-docker-e2e.sh
        PROVIDER_E2E_SKIP_HEAL=1 ./scripts/provider-docker-e2e.sh

  # ==================== Solana Programs ====================
  solana-check:
    needs: changes
    if: ${{ needs.changes.outputs.solana == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/solana-programs/proxyhub
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Solana
      run: |
        sh -c "$(curl -sSfL https://release.solana.com/v1.18.0/install)"
        echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
    
    - name: Install Anchor
      run: |
        cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
        avm install latest
        avm use latest
    
    - name: Install Node.js dependencies
      run: npm ci
    
    - name: Build programs
      run: anchor build
    
    - name: Run tests
      run: anchor test

  # ==================== Smart Contracts (Solidity) ====================
  contracts-check:
    needs: changes
    if: ${{ needs.changes.outputs.contracts == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/contracts
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: ./packages/contracts/package-lock.json
    
    - name: Install dependencies
      run: npm ci
    
    - name: Compile contracts
      run: npx hardhat compile
    
    - name: Run tests
      run: npx hardhat test

  # ==================== Docker Build Check ====================
  docker-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Control API Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: services/control-api/Dockerfile
        push: false
        tags: control-api:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build Web Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./apps/web
        push: false
        tags: web:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ==================== DB Migration Smoke-Test ====================
  # Applies every *.up.sql file in sequence via psql — matching exactly what
  # the custom RunMigrations() runner does at runtime (P3-14).
  # Runs on every push so a broken migration is caught before deploy.
  db-migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: proxyhubb
          POSTGRES_PASSWORD: proxyhubb
          POSTGRES_DB: proxyhubb_migrate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4

    - name: Run all up migrations (psql)
      env:
        PGPASSWORD: proxyhubb
      run: |
        for f in $(ls migrations/*.up.sql | sort); do
          echo "Applying $f ..."
          psql -h localhost -U proxyhubb -d proxyhubb_migrate_test -f "$f" \
            || { echo "FAILED: $f"; exit 1; }
        done

    - name: Verify key tables exist
      env:
        PGPASSWORD: proxyhubb
      run: |
        psql -h localhost -U proxyhubb -d proxyhubb_migrate_test -c \
          "SELECT table_name FROM information_schema.tables
           WHERE table_schema = 'public'
           ORDER BY table_name;" \
          | grep -E "wallets|sessions|nodes|provider_tokens|spending_records"

    - name: Verify wallet schema (migrations 080-088)
      env:
        PGPASSWORD: proxyhubb
      run: |
        set -euo pipefail
        DB=proxyhubb_migrate_test
        cols=$(psql -h localhost -U proxyhubb -d "$DB" -t -A -c \
          "SELECT column_name FROM information_schema.columns
           WHERE table_name = 'wallets'
             AND column_name IN ('withdrawal_whitelist','primary_withdrawal_address','withdrawal_address_changed_at','balance_usdt');")
        echo "$cols" | grep -q withdrawal_whitelist
        echo "$cols" | grep -q primary_withdrawal_address
        echo "$cols" | grep -q withdrawal_address_changed_at
        echo "$cols" | grep -q balance_usdt && { echo "balance_usdt should be dropped"; exit 1; } || true
        psql -h localhost -U proxyhubb -d "$DB" -t -A -c \
          "SELECT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_name = 'user_flags');" | grep -q t
        psql -h localhost -U proxyhubb -d "$DB" -t -A -c \
          "SELECT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name = 'wallet_ledger_entries' AND column_name = 'tx_hash');" | grep -q t
        echo "Wallet schema closure checks passed"

    - name: Run all down migrations (rollback smoke-test)
      env:
        PGPASSWORD: proxyhubb
      run: |
        for f in $(ls migrations/*.down.sql | sort -r); do
          echo "Rolling back $f ..."
          psql -h localhost -U proxyhubb -d proxyhubb_migrate_test -f "$f"
        done
      continue-on-error: true   # Down migrations are best-effort in CI

  # ==================== Lint & Format Check ====================
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Check Markdown
      uses: DavidAnson/markdownlint-cli2-action@v15
      with:
        globs: '**/*.md'
      continue-on-error: true
    
    - name: Check YAML
      run: |
        pip install yamllint
        yamllint -d relaxed .github/workflows/
      continue-on-error: true
