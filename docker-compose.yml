services:
  # ==================== DB Migrate (one-shot init container) ====================
  db-migrate:
    build:
      context: .
      dockerfile: services/control-api/Dockerfile
    container_name: proxyhubb-db-migrate
    environment:
      # In-container URL must use service hostname `postgres`, not host-mapped localhost.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-proxyhubb}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-proxyhubb}?sslmode=disable
      - AUTO_MIGRATE=true
      - FORCE_MIGRATE=${FORCE_MIGRATE:-false}
      - MIGRATE_ONLY=true
      - MIGRATIONS_DIR=/app/migrations
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
      - TOKEN_HMAC_SECRET=${TOKEN_HMAC_SECRET:?TOKEN_HMAC_SECRET must be set}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      - NATS_URL=nats://nats:4222
      - PORT=8080
      - APP_ENV=migration
      - GIN_MODE=release
      - DB_LOG_LEVEL=${DB_LOG_LEVEL:-warn}
      # Optional: keep treasury seed from blanking DB when migrate runs without full .env
      - SOLANA_TREASURY_ADDRESS=${SOLANA_TREASURY_ADDRESS:-}
      - SOLANA_TREASURY_HOT_ADDRESS=${SOLANA_TREASURY_HOT_ADDRESS:-}
    volumes:
      - ./migrations:/app/migrations:ro
    restart: "no"
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy

  # ==================== Control API ====================
  control-api:
    build:
      context: .
      dockerfile: services/control-api/Dockerfile
    env_file:
      - config/docker/control-api-explorer.env
    ports:
      - "${CONTROL_API_PORT:-18080}:8080"
    environment:
      - PORT=8080
      - APP_ENV=${APP_ENV:-development}
      # Do not use ${GIN_MODE} from host .env — inline comments break Gin (e.g. "debug # foo").
      - GIN_MODE=release
      - DATABASE_URL=postgresql://${POSTGRES_USER:-proxyhubb}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-proxyhubb}?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - NATS_URL=nats://nats:4222
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      # Dedicated control-plane secret for edge-gateway -> control-api gateway routes.
      - GATEWAY_SHARED_SECRET=${GATEWAY_SHARED_SECRET:?GATEWAY_SHARED_SECRET must be set}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3009,http://127.0.0.1:3009,http://localhost:3000,http://127.0.0.1:3000}
      # APP_URL is used for WebSocket CORS origin validation.
      # Set to your frontend public URL. Empty = allow all origins (dev mode).
      - APP_URL=${APP_URL:-}
      - API_BASE_URL=${API_BASE_URL:-http://localhost:18080}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3009}
      - ORACLE_PRIVATE_KEY=${ORACLE_PRIVATE_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      # --- Solana / Blockchain ---
      - SOLANA_NETWORK=${SOLANA_NETWORK:-devnet}
      - SOLANA_PROGRAM_ID=${SOLANA_PROGRAM_ID:-AZGhGfvsiGJQ5S91nkdhGi9qvSNKv3sBZyVJ63KQLfvu}
      - SOLANA_TREASURY_ADDRESS=${SOLANA_TREASURY_ADDRESS}
      - SOLANA_RPC_ENDPOINT=${SOLANA_RPC_ENDPOINT:-https://api.devnet.solana.com}
      - SOLANA_RPC_ENDPOINTS=${SOLANA_RPC_ENDPOINTS:-https://api.devnet.solana.com}
      - INDEXER_INDEX_ALL=${INDEXER_INDEX_ALL:-false}
      - SOLANA_WS_ENDPOINT=${SOLANA_WS_ENDPOINT:-wss://api.devnet.solana.com}
      - SOLANA_ORACLE_KEYPAIR=/run/secrets/oracle-keypair.json
      # BC-08: set SOLANA_TREASURY_HOT_KEYPAIR to a distinct payout key (required in production)
      - SOLANA_TREASURY_HOT_KEYPAIR=${SOLANA_TREASURY_HOT_KEYPAIR:-}
      - SOLANA_TREASURY_HOT_ADDRESS=${SOLANA_TREASURY_HOT_ADDRESS:-}
      - SOLANA_TREASURY_COLD_ADDRESS=${SOLANA_TREASURY_COLD_ADDRESS:-}
      # Hot float / vault→hot automation (staging-friendly defaults; override for mainnet)
      - SOLANA_TREASURY_HOT_MIN_BALANCE=${SOLANA_TREASURY_HOT_MIN_BALANCE:-5}
      - SOLANA_TREASURY_HOT_MAX_BALANCE=${SOLANA_TREASURY_HOT_MAX_BALANCE:-50}
      - SOLANA_TREASURY_REPLENISH_AMOUNT=${SOLANA_TREASURY_REPLENISH_AMOUNT:-15}
      - SOLANA_VAULT_TOPUP_MAX_SOL=${SOLANA_VAULT_TOPUP_MAX_SOL:-20}
      - SOLANA_VAULT_DAILY_TOPUP_CAP_SOL=${SOLANA_VAULT_DAILY_TOPUP_CAP_SOL:-200}
      - SOLANA_VAULT_RESERVE_FLOOR_SOL=${SOLANA_VAULT_RESERVE_FLOOR_SOL:-0.01}
      - SOLANA_TREASURY_SWEEP_ENABLED=${SOLANA_TREASURY_SWEEP_ENABLED:-true}
      # Phase 1 deposit vault PDA (inbound SOL outside hot EOA)
      - SOLANA_DEPOSIT_VAULT_ADDRESS=${SOLANA_DEPOSIT_VAULT_ADDRESS:-}
      - PROXYHUB_DEPOSIT_VAULT_CREDIT_ENABLED=${PROXYHUB_DEPOSIT_VAULT_CREDIT_ENABLED:-false}
      - PROXYHUB_DEPOSIT_LEGACY_TREASURY_CREDIT=${PROXYHUB_DEPOSIT_LEGACY_TREASURY_CREDIT:-true}
      - PROXYHUB_DEPOSIT_VAULT_UI=${PROXYHUB_DEPOSIT_VAULT_UI:-false}
      - PROXYHUB_DEPOSIT_REQUIRE_FINALIZED=${PROXYHUB_DEPOSIT_REQUIRE_FINALIZED:-false}
      - PROXYHUB_REQUIRE_ESCROW_PDA=${PROXYHUB_REQUIRE_ESCROW_PDA:-false}
      - PROXYHUB_REQUIRE_SESSION_PDA=${PROXYHUB_REQUIRE_SESSION_PDA:-false}
      - PROXYHUB_REQUIRE_USAGE_PROOF_BEFORE_SETTLE=${PROXYHUB_REQUIRE_USAGE_PROOF_BEFORE_SETTLE:-false}
      - PROXYHUB_ESCROW_CHALLENGE_DAYS=${PROXYHUB_ESCROW_CHALLENGE_DAYS:-7}
      - PROXYHUB_MULTISIG_SETTLE_ENABLED=${PROXYHUB_MULTISIG_SETTLE_ENABLED:-false}
      - PROXYHUB_MULTISIG_SETTLE_AMOUNT_LAMPORTS=${PROXYHUB_MULTISIG_SETTLE_AMOUNT_LAMPORTS:-100000000}
      - PROXYHUB_MULTISIG_COSIGNER_KEYPAIR=${PROXYHUB_MULTISIG_COSIGNER_KEYPAIR:-}
      - PROXYHUB_WATCHER_START_SLOT=${PROXYHUB_WATCHER_START_SLOT:-}
      # PHB_TOKEN_MINT: SPL token mint address for the platform token.
      # Used to display platform token balances on wallet details pages.
      - PHB_TOKEN_MINT=${PHB_TOKEN_MINT:-}
      # Governance proposal description storage (Pinata JWT or stub on Testnet)
      - PINATA_JWT=${PINATA_JWT:-}
      - GOVERNANCE_IPFS_STUB=${GOVERNANCE_IPFS_STUB:-}
      - IPFS_NODE_URL=${IPFS_NODE_URL:-}
      - IPFS_GATEWAY=${IPFS_GATEWAY:-}
      # --- Price Feeds ---
      - COINGECKO_API_KEY=${COINGECKO_API_KEY}
      - COINGECKO_API_URL=${COINGECKO_API_URL:-https://api.coingecko.com/api/v3}
      - COINMARKETCAP_API_KEY=${COINMARKETCAP_API_KEY}
      # --- Edge Gateway ---
      - EDGE_GATEWAY_MGMT_URL=${EDGE_GATEWAY_MGMT_URL:-http://edge-gateway:8090}
      - EDGE_GATEWAY_BUYER_HOST=${EDGE_GATEWAY_BUYER_HOST:-localhost}
      - EDGE_GATEWAY_BUYER_PORT=${EDGE_GATEWAY_BUYER_PORT:-8090}
      - CLI_DIST_VERSION=${CLI_DIST_VERSION:-1.0.6}
      - CLI_DIST_PATH=/app/cli-dist
      - PROVIDER_PUBLIC_CONTROL_API_URL=${PROVIDER_PUBLIC_CONTROL_API_URL:-${API_BASE_URL:-http://localhost:18080}}
      - PROVIDER_TUNNEL_PUBLIC_ADDR=${PROVIDER_TUNNEL_PUBLIC_ADDR:-localhost:3128}
      - PROVIDER_TUNNEL_PUBLIC_ADDRS=${PROVIDER_TUNNEL_PUBLIC_ADDRS:-}
      # --- Halo2 Prover ---
      - HALO2_PROVER_URL=${HALO2_PROVER_URL:-http://zk-prover:8095}
      - HALO2_PROVER_TIMEOUT_MS=${HALO2_PROVER_TIMEOUT_MS:-15000}
      - HALO2_PROVER_REQUIRED=${HALO2_PROVER_REQUIRED:-true}
      - GROTH16_PROVER_URL=${GROTH16_PROVER_URL:-http://groth16-prover:8096}
      - GROTH16_PROVER_TIMEOUT_MS=${GROTH16_PROVER_TIMEOUT_MS:-30000}
      - GROTH16_PROVER_REQUIRED=${GROTH16_PROVER_REQUIRED:-false}
      # BC-11-B: require lane + ready gate (must be on control-api, not zk-prover)
      - PROXYHUB_ZK_ONCHAIN_GROTH16=${PROXYHUB_ZK_ONCHAIN_GROTH16:-false}
      - PROXYHUB_ZK_ONCHAIN_GROTH16_READY=${PROXYHUB_ZK_ONCHAIN_GROTH16_READY:-false}
      - PROXYHUB_PROTOCOL_INCENTIVES=${PROXYHUB_PROTOCOL_INCENTIVES:-off}
      # Wave 5.C.5 / W10.B — ListingCommitment PDA. Default off.
      # observe annotates browse honesty and best-effort registers (sends SOL on listing publish).
      - PROXYHUB_LISTING_COMMITMENT=${PROXYHUB_LISTING_COMMITMENT:-off}
      - PROXYHUB_OPS_ONCHAIN_PAUSE=${PROXYHUB_OPS_ONCHAIN_PAUSE:-false}
      - REPUTATION_PROGRAM_ID=${REPUTATION_PROGRAM_ID:-EnVE6ehKA2dYi69B3Lo8wt2wyDgzLw4tdtSEKoMYe5bF}
      - FULL_DECENTRALIZATION=${FULL_DECENTRALIZATION:-false}
      # --- Provider proofs (Phase 1 decentralization) ---
      # observe = verify and store; enforce = reject invalid/missing proofs when node hotkey is set
      - PROVIDER_SIGNATURE_MODE=${PROVIDER_SIGNATURE_MODE:-observe}
      # Dev listing signing (marketplace create UX); set key from bootstrap provider.compose.env
      - PROXYHUB_PROVIDER_SIGNING_KEY=${PROXYHUB_PROVIDER_SIGNING_KEY:-}
      - PROXYHUB_ALLOW_DEV_LISTING_SIGN=${PROXYHUB_ALLOW_DEV_LISTING_SIGN:-false}
      - PROXYHUB_ALLOW_DEV_ESCROW_ACTIVATE=${PROXYHUB_ALLOW_DEV_ESCROW_ACTIVATE:-false}
      # --- Explorer (public API + workers) ---
      - EXPLORER_PUBLIC_SESSIONS_ENABLED=${EXPLORER_PUBLIC_SESSIONS_ENABLED:-true}
      - EXPLORER_PUBLIC_EARNINGS_ENABLED=${EXPLORER_PUBLIC_EARNINGS_ENABLED:-false}
      - EXPLORER_MIN_WRITERS=${EXPLORER_MIN_WRITERS:-2}
      - EXPLORER_METRICS_ENABLED=${EXPLORER_METRICS_ENABLED:-true}
      - EXPLORER_METRICS_INTERVAL=${EXPLORER_METRICS_INTERVAL:-10m}
      - EXPLORER_INDEXER_ENABLED=${EXPLORER_INDEXER_ENABLED:-true}
      - EXPLORER_INDEXER_POLL_INTERVAL_MS=${EXPLORER_INDEXER_POLL_INTERVAL_MS:-5000}
      # --- DB Migrations ---
      - FORCE_MIGRATE=${FORCE_MIGRATE:-false}
      - AUTO_MIGRATE=${AUTO_MIGRATE:-false}
      # --- DB Observability (E8) ---
      - DB_LOG_LEVEL=${DB_LOG_LEVEL:-warn}
      - DB_SLOW_QUERY_MS=${DB_SLOW_QUERY_MS:-500}
      - DB_MAX_OPEN_CONNS=${DB_MAX_OPEN_CONNS:-30}
      - DB_MAX_IDLE_CONNS=${DB_MAX_IDLE_CONNS:-5}
      # --- Credential migration (I3, one-time) ---
      - MIGRATE_CREDENTIALS=${MIGRATE_CREDENTIALS:-false}
      # --- Read replica (optional) ---
      - READ_REPLICA_URL=${READ_REPLICA_URL:-}
      # --- Leaderboard MV refresh interval ---
      - MV_LEADERBOARD_REFRESH_MINS=${MV_LEADERBOARD_REFRESH_MINS:-15}
      # --- Provider Engine ---
      - PLATFORM_FEE_PERCENT=${PLATFORM_FEE_PERCENT:-0.10}
      - MIN_PAYOUT_SOL=${MIN_PAYOUT_SOL:-0.01}
      - PAYOUT_BATCH_SIZE=${PAYOUT_BATCH_SIZE:-20}
      # --- Provider Token Auth (HMAC-SHA256) ---
      - TOKEN_HMAC_SECRET=${TOKEN_HMAC_SECRET:?TOKEN_HMAC_SECRET must be set}
      # --- Alert Channels (platform-native; no Slack/PagerDuty) ---
      # Optional self-hosted webhook (ntfy / Matrix bridge / custom). Leave empty for journal+NATS only.
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - ALERT_ADMIN_EMAILS=${ALERT_ADMIN_EMAILS:-}
      # Grafana → control-api forwarder (POST /internal/alerts/webhook)
      - INTERNAL_ALERT_WEBHOOK_TOKEN=${INTERNAL_ALERT_WEBHOOK_TOKEN:-}
      # Optional SMTP (self-hosted mail only; not required for S3)
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      # --- Oracle Velocity Guard ---
      - ORACLE_MAX_SINGLE_TRANSFER_SOL=${ORACLE_MAX_SINGLE_TRANSFER_SOL:-50}
      - ORACLE_MAX_HOURLY_OUTFLOW_SOL=${ORACLE_MAX_HOURLY_OUTFLOW_SOL:-500}
      - ORACLE_TRANSFER_FREEZE=${ORACLE_TRANSFER_FREEZE:-false}
      # --- Emergency price fallback ---
      - EMERGENCY_SOL_PRICE_USD=${EMERGENCY_SOL_PRICE_USD:-200}
      # --- GeoIP Backfill Worker ---
      # Resolves lat/lon for explorer nodes via ip-api.com (free, 45 req/min).
      # Requires outbound HTTP to http://ip-api.com from the container.
      # Set to "false" in air-gapped environments or when coordinates are pre-populated.
      - GEOIP_ENABLED=${GEOIP_ENABLED:-true}
      # Phase 5: aggregate session_intents → map_node_links for GET /v1/map/links
      - MAP_TOPOLOGY_ENABLED=${MAP_TOPOLOGY_ENABLED:-true}
      # --- PAYG Social System (Phases 1-4) ---
      # Milestone Worker Configuration
      - MILESTONE_CHECK_INTERVAL_MINUTES=${MILESTONE_CHECK_INTERVAL_MINUTES:-5}
      - MILESTONE_REWARDS_ENABLED=${MILESTONE_REWARDS_ENABLED:-true}
      # Review System Configuration
      - REVIEW_MIN_USAGE_GB=${REVIEW_MIN_USAGE_GB:-1}
      - REVIEW_MIN_DURATION_DAYS=${REVIEW_MIN_DURATION_DAYS:-7}
      # Circle Pool Configuration
      - CIRCLE_POOL_ENABLED=${CIRCLE_POOL_ENABLED:-true}
      - CIRCLE_MINIMUM_POOL_GB=${CIRCLE_MINIMUM_POOL_GB:-100}
      - CIRCLE_ENTERPRISE_THRESHOLD_GB=${CIRCLE_ENTERPRISE_THRESHOLD_GB:-1000}
      # Presence Tracking
      - PRESENCE_HEARTBEAT_SECONDS=${PRESENCE_HEARTBEAT_SECONDS:-60}
      - PRESENCE_TIMEOUT_MINUTES=${PRESENCE_TIMEOUT_MINUTES:-5}
    volumes:
      - ./infra/oracle-keypair.json:/run/secrets/oracle-keypair.json:ro
      - ./cli-dist:/app/cli-dist:ro
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      zk-prover:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # ==================== ZK Prover ====================
  zk-prover:
    build:
      context: ./services/zk-prover
      dockerfile: Dockerfile
    ports:
      - "8095:8095"
    environment:
      - PORT=8095
      - RUST_LOG=${ZK_PROVER_LOG:-info}
      - ZK_PROVER_KEYS_DIR=${ZK_PROVER_KEYS_DIR:-/var/lib/proxyhubb-zk}
    volumes:
      - zk_prover_keys:/var/lib/proxyhubb-zk
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:8095/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ==================== BN254 Groth16 Prover (BC-11-B) ====================
  groth16-prover:
    build:
      context: ./services/groth16-prover
      dockerfile: Dockerfile
    ports:
      - "8096:8096"
    environment:
      - PORT=8096
      - RUST_LOG=${GROTH16_PROVER_LOG:-info}
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:8096/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    profiles:
      - groth16

  # ==================== Edge Gateway ====================
  edge-gateway:
    build:
      context: ./services/edge-gateway
      dockerfile: Dockerfile
      args:
        ENABLE_OTEL: ${EDGE_GATEWAY_ENABLE_OTEL:-0}
    ports:
      - "3128:3128"    # SOCKS5/HTTP Proxy port
      - "${EDGE_GATEWAY_PORT:-8090}:8090"    # Buyer proxy API / health / ready
      - "${EDGE_GATEWAY_METRICS_PORT:-9092}:9090"  # Host metrics (9091=prometheus UI, avoid 9090 clashes)
      - "${EDGE_GATEWAY_SOCKS5_PORT:-1080}:1080"  # P6 SOCKS5 ingress (when ENABLE_SOCKS5=1)
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - HOST=0.0.0.0
      - PORT=8090
      - METRICS_PORT=9090
      - TUNNEL_PORT=3128
      # P6: optional SOCKS5 buyer ingress (no rebuild required)
      - ENABLE_SOCKS5=${ENABLE_SOCKS5:-0}
      - SOCKS5_PORT=1080
      # P4: parallel yamux lanes per provider (gateway + provider-node should match).
      - YAMUX_CONNS_PER_NODE=${YAMUX_CONNS_PER_NODE:-1}
      - PROVIDER_TRANSPORT=${PROVIDER_TRANSPORT:-yamux}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      - NATS_URL=nats://nats:4222
      - CONTROL_API_URL=http://control-api:8080
      - JWT_SECRET=${JWT_SECRET}
      # Dedicated control-plane secret for edge-gateway -> control-api gateway routes.
      - GATEWAY_SHARED_SECRET=${GATEWAY_SHARED_SECRET:?GATEWAY_SHARED_SECRET must be set}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
      # Dev-friendly: allow unleased provider tunnels locally (prod sets true explicitly)
      - REQUIRE_PROVIDER_LEASE=${REQUIRE_PROVIDER_LEASE:-false}
      - TLS_CERT_PATH=/app/certs/server.crt
      - TLS_KEY_PATH=/app/certs/server.key
      - PROVIDER_PRIVATE_KEY=${PROVIDER_PRIVATE_KEY:?PROVIDER_PRIVATE_KEY must be set}
      - GEO_DENY_LIST=${GEO_DENY_LIST:-}
      - GEO_ALLOW_LIST=${GEO_ALLOW_LIST:-}
      - REGION=${REGION:-default}
      - GEOIP_DB_PATH=/app/geoip/GeoLite2-Country.mmdb
      - SESSION_CACHE_SIZE=${SESSION_CACHE_SIZE:-100000}
      - SESSION_CACHE_TTL_SECS=${SESSION_CACHE_TTL_SECS:-300}
      # P2-12: Per-operation timeouts
      - PROXY_CONNECT_TIMEOUT_SECS=${PROXY_CONNECT_TIMEOUT_SECS:-10}
      - PROXY_IDLE_TIMEOUT_SECS=${PROXY_IDLE_TIMEOUT_SECS:-60}
      - RPC_REQUEST_TIMEOUT_SECS=${RPC_REQUEST_TIMEOUT_SECS:-15}
      # P5: OTLP traces (image must be built with EDGE_GATEWAY_ENABLE_OTEL=1)
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-edge-gateway}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # --- GeoIP Auto-Update (weekly cron) ---
      - MAXMIND_LICENSE_KEY=${MAXMIND_LICENSE_KEY:-}
      # --- Phase 8: DAO & Staking ---
      - SOLANA_RPC_URL=${SOLANA_RPC_ENDPOINT:-https://api.devnet.solana.com}
      - SOLANA_PROGRAM_ID=${SOLANA_PROGRAM_ID:-AZGhGfvsiGJQ5S91nkdhGi9qvSNKv3sBZyVJ63KQLfvu}
      - SOLANA_KEYPAIR_PATH=/run/secrets/oracle-keypair.json
      # Wave 4.2 / BC-11-C: must be reputation program ID — not proxyhub.
      - REPUTATION_PROGRAM_ID=${REPUTATION_PROGRAM_ID:-EnVE6ehKA2dYi69B3Lo8wt2wyDgzLw4tdtSEKoMYe5bF}
      # Deprecated edge-side Groth16 settlement path. Keep disabled unless explicitly testing the legacy gateway flow.
      - LEGACY_EDGE_ZK_SUBMISSION_ENABLED=${LEGACY_EDGE_ZK_SUBMISSION_ENABLED:-false}
      - PHUBB_TOKEN_MINT=${PHB_TOKEN_MINT}
      - ORACLE_PRIVATE_KEY=${ORACLE_PRIVATE_KEY:-}
      # --- D-O1: Multi-source price oracle (CoinGecko + Binance + CoinMarketCap) ---
      # CoinGecko: optional key; free tier works without one but rate-limited
      - COINGECKO_API_KEY=${COINGECKO_API_KEY:-}
      # CoinMarketCap: optional; skipped entirely when absent (2-source median still works)
      - COINMARKETCAP_API_KEY=${COINMARKETCAP_API_KEY:-}
      # Emergency fallback price (USD) when all live feeds + cache are stale
      - EMERGENCY_SOL_PRICE_USD=${EMERGENCY_SOL_PRICE_USD:-200}
      - FULL_DECENTRALIZATION=${FULL_DECENTRALIZATION:-true}
      # Reject unsigned heartbeats at the gateway when true (default false for gradual rollout)
      - PROXYHUB_REQUIRE_SIGNED_HEARTBEATS=${PROXYHUB_REQUIRE_SIGNED_HEARTBEATS:-false}
      - PROXYHUB_SESSION_CAPABILITY=${PROXYHUB_SESSION_CAPABILITY:-off}
      - PROXYHUB_SESSION_CAPABILITY_ISSUER_PUBKEY=${PROXYHUB_SESSION_CAPABILITY_ISSUER_PUBKEY:-}
      - PROXYHUB_OPERATOR_BUNDLE_PATH=${PROXYHUB_OPERATOR_BUNDLE_PATH:-}
      - PROXYHUB_OPERATOR_BUNDLE_URL=${PROXYHUB_OPERATOR_BUNDLE_URL:-}
      - PROXYHUB_OPERATOR_BUNDLE_CID=${PROXYHUB_OPERATOR_BUNDLE_CID:-}
    volumes:
      - ./certs:/app/certs:ro
      - ./geoip:/app/geoip:ro
      - ./infra/oracle-keypair.json:/run/secrets/oracle-keypair.json:ro
    depends_on:
      control-api:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      # GET not HEAD: edge historically returned 501 on HEAD; wget --spider uses HEAD.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:8090/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  # ==================== NATS (Message Bus) ====================
  nats:
    image: nats:2.10-alpine
    # JetStream with durable store — recreate without wiping streams (HA lite).
    command: ["-js", "-m", "8222", "-sd", "/data"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/varz"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ==================== Web (Frontend) ====================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - API_URL=http://control-api:8080
        - NEXT_PUBLIC_GATEWAY_URL=${GATEWAY_PUBLIC_URL:-http://localhost:8090}
        - NEXT_PUBLIC_ENABLE_EVM_WALLETS=${NEXT_PUBLIC_ENABLE_EVM_WALLETS:-false}
        - NEXT_PUBLIC_EVM_CHAIN=${NEXT_PUBLIC_EVM_CHAIN:-sepolia}
        - NEXT_PUBLIC_EVM_RPC_URL=${NEXT_PUBLIC_EVM_RPC_URL:-}
        - NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID=${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
        - NEXT_PUBLIC_SOLANA_NETWORK=${SOLANA_NETWORK:-devnet}
        - NEXT_PUBLIC_SOLANA_PROGRAM_ID=${SOLANA_PROGRAM_ID:-AZGhGfvsiGJQ5S91nkdhGi9qvSNKv3sBZyVJ63KQLfvu}
        - NEXT_PUBLIC_API_URL=${API_BASE_URL:-http://localhost:18080}
        - NEXT_PUBLIC_WS_URL=${WS_PUBLIC_URL:-ws://localhost:18080}
        - NEXT_PUBLIC_PROXY_ENDPOINT=${NEXT_PUBLIC_PROXY_ENDPOINT:-localhost:8090}
        # PAYG Social System Feature Flags
        - NEXT_PUBLIC_MILESTONES_ENABLED=${NEXT_PUBLIC_MILESTONES_ENABLED:-true}
        - NEXT_PUBLIC_CIRCLE_POOLING_ENABLED=${NEXT_PUBLIC_CIRCLE_POOLING_ENABLED:-true}
        - NEXT_PUBLIC_USAGE_REVIEWS_ENABLED=${NEXT_PUBLIC_USAGE_REVIEWS_ENABLED:-true}
        - NEXT_PUBLIC_SOCIAL_PRESENCE_ENABLED=${NEXT_PUBLIC_SOCIAL_PRESENCE_ENABLED:-true}
        - NEXT_PUBLIC_EXPLORER_PUBLIC_SESSIONS_ENABLED=${EXPLORER_PUBLIC_SESSIONS_ENABLED:-false}
        - NEXT_PUBLIC_EXPLORER_PUBLIC_EARNINGS_ENABLED=${EXPLORER_PUBLIC_EARNINGS_ENABLED:-false}
        - NEXT_PUBLIC_EXPLORER_MAP_BUY_ENABLED=${EXPLORER_MAP_BUY_ENABLED:-false}
        - NEXT_PUBLIC_UNIFIED_NETWORK=${NEXT_PUBLIC_UNIFIED_NETWORK:-false}
        - NEXT_PUBLIC_MAP_LIVE_ON_MARKETPLACE=${NEXT_PUBLIC_MAP_LIVE_ON_MARKETPLACE:-false}
        - NEXT_PUBLIC_GLOBE_TOPOLOGY=${NEXT_PUBLIC_GLOBE_TOPOLOGY:-false}
        - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
        - NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID=${NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID:-}
        - NEXT_PUBLIC_LEGACY_EXPLORER_GLOBE=${NEXT_PUBLIC_LEGACY_EXPLORER_GLOBE:-false}
    ports:
      - "3009:3000"
    environment:
      # Server-side only — used by Next.js API routes and rewrite proxy
      - API_URL=http://control-api:8080
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      # Public vars — must be browser-resolvable (public host/port)
      - NEXT_PUBLIC_API_URL=${API_BASE_URL:-http://localhost:18080}
      - NEXT_PUBLIC_PROXY_ENDPOINT=${NEXT_PUBLIC_PROXY_ENDPOINT:-localhost:8090}
      - NEXT_PUBLIC_ENABLE_EVM_WALLETS=${NEXT_PUBLIC_ENABLE_EVM_WALLETS:-false}
      - NEXT_PUBLIC_EVM_CHAIN=${NEXT_PUBLIC_EVM_CHAIN:-sepolia}
      - NEXT_PUBLIC_EVM_RPC_URL=${NEXT_PUBLIC_EVM_RPC_URL:-}
      - NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID=${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
      # WebSocket URL for real-time explorer updates (useExplorerWS hook)
      - NEXT_PUBLIC_WS_URL=${WS_PUBLIC_URL:-ws://localhost:18080}
      - NEXT_PUBLIC_SOLANA_RPC=${SOLANA_RPC_ENDPOINT:-https://api.devnet.solana.com}
      - NEXT_PUBLIC_SOLANA_NETWORK=${SOLANA_NETWORK:-devnet}
      - NEXT_PUBLIC_SOLANA_PROGRAM_ID=${SOLANA_PROGRAM_ID:-AZGhGfvsiGJQ5S91nkdhGi9qvSNKv3sBZyVJ63KQLfvu}
      - NEXT_PUBLIC_SOLANA_TREASURY=${SOLANA_TREASURY_ADDRESS}
      - NEXT_PUBLIC_EXPLORER_PUBLIC_SESSIONS_ENABLED=${EXPLORER_PUBLIC_SESSIONS_ENABLED:-false}
      - NEXT_PUBLIC_EXPLORER_PUBLIC_EARNINGS_ENABLED=${EXPLORER_PUBLIC_EARNINGS_ENABLED:-false}
      - NEXT_PUBLIC_EXPLORER_MAP_BUY_ENABLED=${EXPLORER_MAP_BUY_ENABLED:-false}
      - NEXT_PUBLIC_UNIFIED_NETWORK=${NEXT_PUBLIC_UNIFIED_NETWORK:-false}
      - NEXT_PUBLIC_MAP_LIVE_ON_MARKETPLACE=${NEXT_PUBLIC_MAP_LIVE_ON_MARKETPLACE:-false}
      - NEXT_PUBLIC_GLOBE_TOPOLOGY=${NEXT_PUBLIC_GLOBE_TOPOLOGY:-false}
    depends_on:
      control-api:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped

  # ==================== Docs (public docs.proxyhubb.com) ====================
  docs:
    build:
      context: ./apps/docs
      dockerfile: Dockerfile
    ports:
      - "3010:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:3000/docs"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped

  # ==================== PostgreSQL ====================
  postgres:
    image: postgres:16-alpine
    command: postgres -c shared_buffers=1GB -c effective_cache_size=3GB -c work_mem=16MB -c maintenance_work_mem=256MB -c checkpoint_completion_target=0.9 -c max_connections=200
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-proxyhubb}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=${POSTGRES_DB:-proxyhubb}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proxyhubb} -d ${POSTGRES_DB:-proxyhubb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      --protected-mode yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ==================== Redis Exporter ====================
  redis-exporter:
    image: oliver006/redis_exporter:v1.55.0
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "9121:9121"
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ==================== OTEL Collector (P5, optional) ====================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: proxyhubb-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel/collector-dev.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
    networks:
      - backend
    restart: unless-stopped
    profiles:
      - otel

  # ==================== Prometheus ====================
  prometheus:
    image: prom/prometheus:v2.48.0
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    networks:
      - backend
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  # ==================== Grafana ====================
  grafana:
    image: grafana/grafana:10.2.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_SECURITY_ALLOW_EMBEDDING=false
      - GF_UNIFIED_ALERTING_ENABLED=true
      - GF_SMTP_ENABLED=${GRAFANA_SMTP_ENABLED:-false}
      - GF_SMTP_HOST=${GRAFANA_SMTP_HOST:-}
      - GF_SMTP_USER=${GRAFANA_SMTP_USER:-}
      - GF_SMTP_PASSWORD=${GRAFANA_SMTP_PASSWORD:-}
      - GF_SMTP_FROM_ADDRESS=${GRAFANA_SMTP_FROM:-alerts@proxyhubb.local}
      - GF_SMTP_FROM_NAME=${GRAFANA_SMTP_FROM_NAME:-ProxyHubb Alerts}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
  grafana_data:
  postgres_data:
  prometheus_data:
  nats_data:
  zk_prover_keys:

networks:
  backend:
    driver: bridge
