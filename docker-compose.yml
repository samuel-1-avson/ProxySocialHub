services:
  # ==================== DB Migrate (one-shot init container) ====================
  db-migrate:
    build:
      context: .
      dockerfile: services/control-api/Dockerfile
    container_name: proxyhubb-db-migrate
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - AUTO_MIGRATE=true
      - FORCE_MIGRATE=${FORCE_MIGRATE:-false}
      - MIGRATE_ONLY=true
      - MIGRATIONS_DIR=/app/migrations
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
      - TOKEN_HMAC_SECRET=${TOKEN_HMAC_SECRET:?TOKEN_HMAC_SECRET must be set}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      - NATS_URL=nats://nats:4222
      - PORT=8080
      - APP_ENV=migration
      - GIN_MODE=release
      - DB_LOG_LEVEL=${DB_LOG_LEVEL:-warn}
    volumes:
      - ./migrations:/app/migrations:ro
    restart: "no"
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy

  # ==================== Control API ====================
  control-api:
    build:
      context: .
      dockerfile: services/control-api/Dockerfile
    env_file:
      - config/docker/control-api-explorer.env
    ports:
      - "${CONTROL_API_PORT:-18080}:8080"
    environment:
      - PORT=8080
      - APP_ENV=${APP_ENV:-development}
      - GIN_MODE=${GIN_MODE:-debug}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - NATS_URL=nats://nats:4222
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      # Dedicated control-plane secret for edge-gateway -> control-api gateway routes.
      - GATEWAY_SHARED_SECRET=${GATEWAY_SHARED_SECRET:?GATEWAY_SHARED_SECRET must be set}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3009,http://127.0.0.1:3009,http://localhost:3000,http://127.0.0.1:3000}
      # APP_URL is used for WebSocket CORS origin validation.
      # Set to your frontend public URL. Empty = allow all origins (dev mode).
      - APP_URL=${APP_URL:-}
      - API_BASE_URL=${API_BASE_URL:-http://localhost:18080}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3009}
      - ORACLE_PRIVATE_KEY=${ORACLE_PRIVATE_KEY}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      # --- Solana / Blockchain ---
      - SOLANA_NETWORK=${SOLANA_NETWORK:-devnet}
      - SOLANA_PROGRAM_ID=${SOLANA_PROGRAM_ID:-2yDRyTwhHnVakKKMhhGG61V9b78RUdXRjAL3UiPwmDd7}
      - SOLANA_TREASURY_ADDRESS=${SOLANA_TREASURY_ADDRESS}
      - SOLANA_RPC_ENDPOINT=${SOLANA_RPC_ENDPOINT:-https://api.devnet.solana.com}
      - SOLANA_RPC_ENDPOINTS=${SOLANA_RPC_ENDPOINTS:-https://api.devnet.solana.com}
      - INDEXER_INDEX_ALL=${INDEXER_INDEX_ALL:-false}
      - SOLANA_WS_ENDPOINT=${SOLANA_WS_ENDPOINT:-wss://api.devnet.solana.com}
      - SOLANA_ORACLE_KEYPAIR=/run/secrets/oracle-keypair.json
      # PHB_TOKEN_MINT: SPL token mint address for the platform token.
      # Used to display platform token balances on wallet details pages.
      - PHB_TOKEN_MINT=${PHB_TOKEN_MINT:-}
      # --- Price Feeds ---
      - COINGECKO_API_KEY=${COINGECKO_API_KEY}
      - COINGECKO_API_URL=${COINGECKO_API_URL:-https://api.coingecko.com/api/v3}
      - COINMARKETCAP_API_KEY=${COINMARKETCAP_API_KEY}
      # --- Edge Gateway ---
      - EDGE_GATEWAY_MGMT_URL=${EDGE_GATEWAY_MGMT_URL:-http://edge-gateway:8090}
      # --- Halo2 Prover ---
      - HALO2_PROVER_URL=${HALO2_PROVER_URL:-http://zk-prover:8095}
      - HALO2_PROVER_TIMEOUT_MS=${HALO2_PROVER_TIMEOUT_MS:-15000}
      - HALO2_PROVER_REQUIRED=${HALO2_PROVER_REQUIRED:-true}
      - FULL_DECENTRALIZATION=${FULL_DECENTRALIZATION:-false}
      # --- Provider proofs (Phase 1 decentralization) ---
      # observe = verify and store; enforce = reject invalid/missing proofs when node hotkey is set
      - PROVIDER_SIGNATURE_MODE=${PROVIDER_SIGNATURE_MODE:-observe}
      # --- Explorer (public API + workers) ---
      - EXPLORER_PUBLIC_SESSIONS_ENABLED=${EXPLORER_PUBLIC_SESSIONS_ENABLED:-true}
      - EXPLORER_PUBLIC_EARNINGS_ENABLED=${EXPLORER_PUBLIC_EARNINGS_ENABLED:-false}
      - EXPLORER_MIN_WRITERS=${EXPLORER_MIN_WRITERS:-2}
      - EXPLORER_METRICS_ENABLED=${EXPLORER_METRICS_ENABLED:-true}
      - EXPLORER_METRICS_INTERVAL=${EXPLORER_METRICS_INTERVAL:-10m}
      - EXPLORER_INDEXER_ENABLED=${EXPLORER_INDEXER_ENABLED:-true}
      - EXPLORER_INDEXER_POLL_INTERVAL_MS=${EXPLORER_INDEXER_POLL_INTERVAL_MS:-5000}
      # --- DB Migrations ---
      - FORCE_MIGRATE=${FORCE_MIGRATE:-false}
      - AUTO_MIGRATE=${AUTO_MIGRATE:-false}
      # --- DB Observability (E8) ---
      - DB_LOG_LEVEL=${DB_LOG_LEVEL:-warn}
      - DB_SLOW_QUERY_MS=${DB_SLOW_QUERY_MS:-500}
      - DB_MAX_OPEN_CONNS=${DB_MAX_OPEN_CONNS:-30}
      - DB_MAX_IDLE_CONNS=${DB_MAX_IDLE_CONNS:-5}
      # --- Credential migration (I3, one-time) ---
      - MIGRATE_CREDENTIALS=${MIGRATE_CREDENTIALS:-false}
      # --- Read replica (optional) ---
      - READ_REPLICA_URL=${READ_REPLICA_URL:-}
      # --- Leaderboard MV refresh interval ---
      - MV_LEADERBOARD_REFRESH_MINS=${MV_LEADERBOARD_REFRESH_MINS:-15}
      # --- Provider Engine ---
      - PLATFORM_FEE_PERCENT=${PLATFORM_FEE_PERCENT:-0.10}
      - MIN_PAYOUT_SOL=${MIN_PAYOUT_SOL:-0.01}
      - PAYOUT_BATCH_SIZE=${PAYOUT_BATCH_SIZE:-20}
      # --- Provider Token Auth (HMAC-SHA256) ---
      - TOKEN_HMAC_SECRET=${TOKEN_HMAC_SECRET:?TOKEN_HMAC_SECRET must be set}
      # --- Alert Channels ---
      - SLACK_ALERT_WEBHOOK_URL=${SLACK_ALERT_WEBHOOK_URL:-}
      - ALERT_ADMIN_EMAILS=${ALERT_ADMIN_EMAILS:-}
      - PAGERDUTY_ROUTING_KEY=${PAGERDUTY_ROUTING_KEY:-}
      # Alert SMTP sender (can share values with SMTP_USER/SMTP_PASS above)
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      # --- Oracle Velocity Guard ---
      - ORACLE_MAX_SINGLE_TRANSFER_SOL=${ORACLE_MAX_SINGLE_TRANSFER_SOL:-50}
      - ORACLE_MAX_HOURLY_OUTFLOW_SOL=${ORACLE_MAX_HOURLY_OUTFLOW_SOL:-500}
      - ORACLE_TRANSFER_FREEZE=${ORACLE_TRANSFER_FREEZE:-false}
      # --- Emergency price fallback ---
      - EMERGENCY_SOL_PRICE_USD=${EMERGENCY_SOL_PRICE_USD:-200}
      # --- GeoIP Backfill Worker ---
      # Resolves lat/lon for explorer nodes via ip-api.com (free, 45 req/min).
      # Requires outbound HTTP to http://ip-api.com from the container.
      # Set to "false" in air-gapped environments or when coordinates are pre-populated.
      - GEOIP_ENABLED=${GEOIP_ENABLED:-true}
      # --- PAYG Social System (Phases 1-4) ---
      # Milestone Worker Configuration
      - MILESTONE_CHECK_INTERVAL_MINUTES=${MILESTONE_CHECK_INTERVAL_MINUTES:-5}
      - MILESTONE_REWARDS_ENABLED=${MILESTONE_REWARDS_ENABLED:-true}
      # Review System Configuration
      - REVIEW_MIN_USAGE_GB=${REVIEW_MIN_USAGE_GB:-1}
      - REVIEW_MIN_DURATION_DAYS=${REVIEW_MIN_DURATION_DAYS:-7}
      # Circle Pool Configuration
      - CIRCLE_POOL_ENABLED=${CIRCLE_POOL_ENABLED:-true}
      - CIRCLE_MINIMUM_POOL_GB=${CIRCLE_MINIMUM_POOL_GB:-100}
      - CIRCLE_ENTERPRISE_THRESHOLD_GB=${CIRCLE_ENTERPRISE_THRESHOLD_GB:-1000}
      # Presence Tracking
      - PRESENCE_HEARTBEAT_SECONDS=${PRESENCE_HEARTBEAT_SECONDS:-60}
      - PRESENCE_TIMEOUT_MINUTES=${PRESENCE_TIMEOUT_MINUTES:-5}
    volumes:
      - ./infra/oracle-keypair.json:/run/secrets/oracle-keypair.json:ro
      - ./cli-dist:/app/cli-dist:ro
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      zk-prover:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # ==================== ZK Prover ====================
  zk-prover:
    build:
      context: ./services/zk-prover
      dockerfile: Dockerfile
    ports:
      - "8095:8095"
    environment:
      - PORT=8095
      - RUST_LOG=${ZK_PROVER_LOG:-info}
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:8095/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ==================== Edge Gateway ====================
  edge-gateway:
    build:
      context: ./services/edge-gateway
      dockerfile: Dockerfile
    ports:
      - "3128:3128"    # SOCKS5/HTTP Proxy port
      - "${EDGE_GATEWAY_PORT:-8090}:8090"    # Gateway API / Metrics / Health
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - HOST=0.0.0.0
      - PORT=8090
      - TUNNEL_PORT=3128
      # P4: parallel yamux lanes per provider (gateway + provider-node should match).
      - YAMUX_CONNS_PER_NODE=${YAMUX_CONNS_PER_NODE:-1}
      - PROVIDER_TRANSPORT=${PROVIDER_TRANSPORT:-yamux}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      - NATS_URL=nats://nats:4222
      - CONTROL_API_URL=http://control-api:8080
      - JWT_SECRET=${JWT_SECRET}
      # Dedicated control-plane secret for edge-gateway -> control-api gateway routes.
      - GATEWAY_SHARED_SECRET=${GATEWAY_SHARED_SECRET:?GATEWAY_SHARED_SECRET must be set}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
      - TLS_CERT_PATH=/app/certs/server.crt
      - TLS_KEY_PATH=/app/certs/server.key
      - PROVIDER_PRIVATE_KEY=${PROVIDER_PRIVATE_KEY:?PROVIDER_PRIVATE_KEY must be set}
      - GEO_DENY_LIST=${GEO_DENY_LIST:-}
      - GEO_ALLOW_LIST=${GEO_ALLOW_LIST:-}
      - REGION=${REGION:-default}
      - GEOIP_DB_PATH=/app/geoip/GeoLite2-Country.mmdb
      - SESSION_CACHE_SIZE=${SESSION_CACHE_SIZE:-100000}
      - SESSION_CACHE_TTL_SECS=${SESSION_CACHE_TTL_SECS:-300}
      # P2-12: Per-operation timeouts
      - PROXY_CONNECT_TIMEOUT_SECS=${PROXY_CONNECT_TIMEOUT_SECS:-10}
      - PROXY_IDLE_TIMEOUT_SECS=${PROXY_IDLE_TIMEOUT_SECS:-60}
      - RPC_REQUEST_TIMEOUT_SECS=${RPC_REQUEST_TIMEOUT_SECS:-15}
      # --- GeoIP Auto-Update (weekly cron) ---
      - MAXMIND_LICENSE_KEY=${MAXMIND_LICENSE_KEY:-}
      # --- Phase 8: DAO & Staking ---
      - SOLANA_RPC_URL=${SOLANA_RPC_ENDPOINT:-https://api.devnet.solana.com}
      - SOLANA_PROGRAM_ID=${SOLANA_PROGRAM_ID:-2yDRyTwhHnVakKKMhhGG61V9b78RUdXRjAL3UiPwmDd7}
      - SOLANA_KEYPAIR_PATH=/run/secrets/oracle-keypair.json
      - REPUTATION_PROGRAM_ID=${SOLANA_PROGRAM_ID:-2yDRyTwhHnVakKKMhhGG61V9b78RUdXRjAL3UiPwmDd7}
      # Deprecated edge-side Groth16 settlement path. Keep disabled unless explicitly testing the legacy gateway flow.
      - LEGACY_EDGE_ZK_SUBMISSION_ENABLED=${LEGACY_EDGE_ZK_SUBMISSION_ENABLED:-false}
      - PHUBB_TOKEN_MINT=${PHB_TOKEN_MINT}
      - ORACLE_PRIVATE_KEY=${ORACLE_PRIVATE_KEY}
      # --- D-O1: Multi-source price oracle (CoinGecko + Binance + CoinMarketCap) ---
      # CoinGecko: optional key; free tier works without one but rate-limited
      - COINGECKO_API_KEY=${COINGECKO_API_KEY:-}
      # CoinMarketCap: optional; skipped entirely when absent (2-source median still works)
      - COINMARKETCAP_API_KEY=${COINMARKETCAP_API_KEY:-}
      # Emergency fallback price (USD) when all live feeds + cache are stale
      - EMERGENCY_SOL_PRICE_USD=${EMERGENCY_SOL_PRICE_USD:-200}
      - FULL_DECENTRALIZATION=${FULL_DECENTRALIZATION:-true}
      # Reject unsigned heartbeats at the gateway when true (default false for gradual rollout)
      - PROXYHUB_REQUIRE_SIGNED_HEARTBEATS=${PROXYHUB_REQUIRE_SIGNED_HEARTBEATS:-false}
    volumes:
      - ./certs:/app/certs:ro
      - ./geoip:/app/geoip:ro
      - ./infra/oracle-keypair.json:/run/secrets/oracle-keypair.json:ro
    depends_on:
      control-api:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8090/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  # ==================== NATS (Message Bus) ====================
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/varz"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ==================== Web (Frontend) ====================
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        - API_URL=http://control-api:8080
        - NEXT_PUBLIC_GATEWAY_URL=${GATEWAY_PUBLIC_URL:-http://localhost:8090}
        - NEXT_PUBLIC_ENABLE_EVM_WALLETS=${NEXT_PUBLIC_ENABLE_EVM_WALLETS:-false}
        - NEXT_PUBLIC_EVM_CHAIN=${NEXT_PUBLIC_EVM_CHAIN:-sepolia}
        - NEXT_PUBLIC_EVM_RPC_URL=${NEXT_PUBLIC_EVM_RPC_URL:-}
        - NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID=${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
        - NEXT_PUBLIC_SOLANA_NETWORK=${SOLANA_NETWORK:-devnet}
        - NEXT_PUBLIC_SOLANA_PROGRAM_ID=${SOLANA_PROGRAM_ID:-2yDRyTwhHnVakKKMhhGG61V9b78RUdXRjAL3UiPwmDd7}
        - NEXT_PUBLIC_API_URL=${API_BASE_URL:-http://localhost:18080}
        - NEXT_PUBLIC_WS_URL=${WS_PUBLIC_URL:-ws://localhost:18080}
        # PAYG Social System Feature Flags
        - NEXT_PUBLIC_MILESTONES_ENABLED=${NEXT_PUBLIC_MILESTONES_ENABLED:-true}
        - NEXT_PUBLIC_CIRCLE_POOLING_ENABLED=${NEXT_PUBLIC_CIRCLE_POOLING_ENABLED:-true}
        - NEXT_PUBLIC_USAGE_REVIEWS_ENABLED=${NEXT_PUBLIC_USAGE_REVIEWS_ENABLED:-true}
        - NEXT_PUBLIC_SOCIAL_PRESENCE_ENABLED=${NEXT_PUBLIC_SOCIAL_PRESENCE_ENABLED:-true}
    ports:
      - "3009:3000"
    environment:
      # Server-side only — used by Next.js API routes and rewrite proxy
      - API_URL=http://control-api:8080
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      # Public vars — must be browser-resolvable (public host/port)
      - NEXT_PUBLIC_API_URL=${API_BASE_URL:-http://localhost:18080}
      - NEXT_PUBLIC_ENABLE_EVM_WALLETS=${NEXT_PUBLIC_ENABLE_EVM_WALLETS:-false}
      - NEXT_PUBLIC_EVM_CHAIN=${NEXT_PUBLIC_EVM_CHAIN:-sepolia}
      - NEXT_PUBLIC_EVM_RPC_URL=${NEXT_PUBLIC_EVM_RPC_URL:-}
      - NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID=${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
      # WebSocket URL for real-time explorer updates (useExplorerWS hook)
      - NEXT_PUBLIC_WS_URL=${WS_PUBLIC_URL:-ws://localhost:18080}
      - NEXT_PUBLIC_SOLANA_RPC=${SOLANA_RPC_ENDPOINT:-https://api.devnet.solana.com}
      - NEXT_PUBLIC_SOLANA_NETWORK=${SOLANA_NETWORK:-devnet}
      - NEXT_PUBLIC_SOLANA_PROGRAM_ID=${SOLANA_PROGRAM_ID:-2yDRyTwhHnVakKKMhhGG61V9b78RUdXRjAL3UiPwmDd7}
      - NEXT_PUBLIC_SOLANA_TREASURY=${SOLANA_TREASURY_ADDRESS}
    depends_on:
      control-api:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped

  # ==================== PostgreSQL ====================
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-proxyhubb}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=${POSTGRES_DB:-proxyhubb}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proxyhubb} -d ${POSTGRES_DB:-proxyhubb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      --protected-mode yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ==================== Redis Exporter ====================
  redis-exporter:
    image: oliver006/redis_exporter:v1.55.0
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "9121:9121"
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ==================== Prometheus ====================
  prometheus:
    image: prom/prometheus:v2.48.0
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    networks:
      - backend
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  # ==================== Grafana ====================
  grafana:
    image: grafana/grafana:10.2.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_SECURITY_ALLOW_EMBEDDING=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./infra/grafana/dashboard.json:/etc/grafana/provisioning/dashboards/proxyhubb.json:ro
    depends_on:
      - prometheus
    networks:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
  grafana_data:
  postgres_data:
  prometheus_data:

networks:
  backend:
    driver: bridge
