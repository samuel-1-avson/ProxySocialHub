version: '3.8'

services:
  # ==================== Control API ====================
  control-api:
    build:
      context: ./services/control-api
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - API_BASE_URL=${API_BASE_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - ORACLE_PRIVATE_KEY=${ORACLE_PRIVATE_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - proxyhubb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ==================== Edge Gateway ====================
  edge-gateway:
    build:
      context: .
      dockerfile: services/edge-gateway/Dockerfile
    ports:
      - "8443:8443"
      - "9090:9090"
    environment:
      - REDIS_URL=redis://redis:6379
      - CONTROL_API_URL=http://control-api:8080
      - TLS_CERT_PATH=/app/certs/server.crt
      - TLS_KEY_PATH=/app/certs/server.key
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      redis:
        condition: service_healthy
      control-api:
        condition: service_healthy
    networks:
      - proxyhubb
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8443 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ==================== Web Dashboard ====================
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3006:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8081
      - NEXT_PUBLIC_WS_URL=ws://localhost:8081
    depends_on:
      control-api:
        condition: service_healthy
    networks:
      - proxyhubb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - proxyhubb
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==================== PostgreSQL ====================
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-proxyhubb}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-proxyhubb}
      - POSTGRES_DB=${POSTGRES_DB:-proxyhubb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - proxyhubb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proxyhubb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==================== Prometheus ====================
  prometheus:
    image: prom/prometheus:v2.48.0
    ports:
      - "9091:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - proxyhubb
    restart: unless-stopped

  # ==================== Grafana ====================
  grafana:
    image: grafana/grafana:10.2.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboard.json:/etc/grafana/provisioning/dashboards/proxyhubb.json:ro
    depends_on:
      - prometheus
    networks:
      - proxyhubb
    restart: unless-stopped

  # ==================== Subtensor Node ====================
  subtensor:
    image: opentensor/subtensor:latest
    ports:
      - "9944:9944"
      - "30333:30333"
    volumes:
      - subtensor_data:/data
    command:
      - ./node-subtensor
      - --chain
      - finney
      - --base-path
      - /data
      - --rpc-external
      - --ws-external
      - --rpc-cors
      - all
      - --sync
      - warp
    networks:
      - proxyhubb
    restart: unless-stopped

  # ==================== Bittensor Bridge ====================
  bittensor-bridge:
    build:
      context: ./services/bittensor-bridge
      dockerfile: Dockerfile
    ports:
      - "8002:8000"
    environment:
      - SUBTENSOR_NETWORK=local
      - SUBTENSOR_CHAIN_ENDPOINT=ws://subtensor:9944
    depends_on:
      - subtensor
    networks:
      - proxyhubb
    restart: unless-stopped

networks:
  proxyhubb:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
  prometheus_data:
  grafana_data:
  subtensor_data:
