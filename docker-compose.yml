version: '3.8'

services:
  # ==================== Control API ====================
  control-api:
    build:
      context: ./services/control-api
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
      - APP_ENV=development
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - NATS_URL=nats://nats:4222
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - API_BASE_URL=${API_BASE_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - ORACLE_PRIVATE_KEY=${ORACLE_PRIVATE_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY}
      - PAYSTACK_PUBLIC_KEY=${PAYSTACK_PUBLIC_KEY}
      - SOLANA_NETWORK=${SOLANA_NETWORK:-devnet}
      - SOLANA_PROGRAM_ID=${SOLANA_PROGRAM_ID:-2yDRyTwhHnVakKKMhhGG61V9b78RUdXRjAL3UiPwmDd7}
      - SOLANA_TREASURY_ADDRESS=${NEXT_PUBLIC_SOLANA_TREASURY}
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - proxyhubb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ==================== Edge Gateway ====================
  edge-gateway:
    build:
      context: ./services/edge-gateway
      dockerfile: Dockerfile
    ports:
      - "3128:3128"
      - "8090:8090"
    environment:
      - RUST_LOG=info
      - REDIS_URL=redis://redis:6379
      - NATS_URL=nats://nats:4222
      - CONTROL_API_URL=http://control-api:8080
      - TLS_CERT_PATH=/app/certs/server.crt
      - TLS_KEY_PATH=/app/certs/server.key
      - PROVIDER_PRIVATE_KEY=${PROVIDER_PRIVATE_KEY}
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      - control-api
      - redis
      - nats
    networks:
      - proxyhubb
    restart: unless-stopped

  # ==================== NATS (Message Bus) ====================
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"] # Enable JetStream and Monitoring
    ports:
      - "4222:4222"
      - "8222:8222" # Monitor port
    networks:
      - proxyhubb
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/varz"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ==================== Web (Frontend) ====================
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${API_BASE_URL:-http://localhost:8081}
      - NEXT_PUBLIC_SOLANA_RPC=${SOLANA_RPC_ENDPOINT:-https://api.devnet.solana.com}
      - NEXT_PUBLIC_SOLANA_NETWORK=${SOLANA_NETWORK:-devnet}
      - NEXT_PUBLIC_SOLANA_TREASURY=${NEXT_PUBLIC_SOLANA_TREASURY}
    networks:
      - proxyhubb
    restart: unless-stopped


  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --protected-mode no
    volumes:
      - redis_data:/data
    networks:
      - proxyhubb
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ==================== Prometheus ====================
  prometheus:
    image: prom/prometheus:v2.48.0
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9091:9090"
    networks:
      - proxyhubb
    restart: unless-stopped

  # ==================== Grafana ====================
  grafana:
    image: grafana/grafana:10.2.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./infra/grafana/dashboard.json:/etc/grafana/provisioning/dashboards/proxyhubb.json:ro
    depends_on:
      - prometheus
    networks:
      - proxyhubb
    restart: unless-stopped

volumes:
  redis_data:
  grafana_data:

networks:
  proxyhubb:
    driver: bridge